function thTitle(x,y,w,op){let p=thBox(x,y,w||34);return '<rect x="'+(p.cx-p.w/2).toFixed(1)+'" y="'+(p.cy-2.3).toFixed(1)+'" width="'+p.w.toFixed(1)+'" height="4.6" rx="2.2" fill="currentColor" opacity="'+(op==null?1:op)+'"/>'}
function thLine(x,y,w,op){let p=thBox(x,y,w||24);return '<rect x="'+(p.cx-p.w/2).toFixed(1)+'" y="'+(p.cy-0.8).toFixed(1)+'" width="'+p.w.toFixed(1)+'" height="1.6" rx="0.8" fill="currentColor" opacity="'+(op==null?.45:op)+'"/>'}
function thStat(x,y,size,color){size=size||10;let p=thBox(x,y),s=size,c=color?' fill="'+color+'"':' fill="currentColor"';return '<g><rect x="'+(p.cx-s/2).toFixed(1)+'" y="'+(p.cy-s*0.34).toFixed(1)+'" width="'+s.toFixed(1)+'" height="'+(s*0.64).toFixed(1)+'" rx="1.6"'+c+'/><rect x="'+(p.cx-s*0.4).toFixed(1)+'" y="'+(p.cy+s*0.42).toFixed(1)+'" width="'+(s*0.8).toFixed(1)+'" height="1.5" rx="0.7" fill="currentColor" opacity=".45"/></g>'}
function thPanel(x,y,w,h,r,op,color){let p=thBox(x,y,w,h);return '<rect x="'+(p.cx-p.w/2).toFixed(1)+'" y="'+(p.cy-p.h/2).toFixed(1)+'" width="'+p.w.toFixed(1)+'" height="'+p.h.toFixed(1)+'" rx="'+(r==null?4:r)+'" fill="'+(color||'currentColor')+'" opacity="'+(op==null?.16:op)+'"/>'}
function thMap(x,y,w,h,color){let p=thBox(x,y,w,h),x0=p.cx-p.w/2,y0=p.cy-p.h/2;
  let pts=[[x0+p.w*0.06,y0+p.h*0.88],[x0+p.w*0.28,y0+p.h*0.3],[x0+p.w*0.5,y0+p.h*0.62],[x0+p.w*0.74,y0+p.h*0.12],[x0+p.w*0.94,y0+p.h*0.42]];
  return '<polyline points="'+pts.map(pp=>pp[0].toFixed(1)+','+pp[1].toFixed(1)).join(' ')+'" fill="none" stroke="'+(color||'currentColor')+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>';
}
function thChart(x,y,w,h,style,color){let p=thBox(x,y,w,h),x0=p.cx-p.w/2,y0=p.cy-p.h/2,c=color||'currentColor';
  if(style==='bars'){let n=7,bw=p.w/n,out='';for(let i=0;i<n;i++){let bh=p.h*(0.25+0.6*Math.abs(Math.sin(i*1.7)));out+='<rect x="'+(x0+i*bw+bw*0.18).toFixed(1)+'" y="'+(y0+p.h-bh).toFixed(1)+'" width="'+(bw*0.64).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="0.6" fill="'+c+'"/>'}return out}
  let vals=[.7,.3,.55,.15,.6,.35,.8],n=vals.length,pts=vals.map((v,i)=>[x0+(i/(n-1))*p.w,y0+p.h*v]);
  let line='<polyline points="'+pts.map(pp=>pp[0].toFixed(1)+','+pp[1].toFixed(1)).join(' ')+'" fill="none" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
  let area='<polygon points="'+pts.map(pp=>pp[0].toFixed(1)+','+pp[1].toFixed(1)).join(' ')+' '+(x0+p.w).toFixed(1)+','+(y0+p.h).toFixed(1)+' '+x0.toFixed(1)+','+(y0+p.h).toFixed(1)+'" fill="'+c+'" opacity=".22"/>';
  return area+line;
}
function thSplits(x,y,w,h,rows){rows=rows||4;let p=thBox(x,y,w,h),x0=p.cx-p.w/2,y0=p.cy-p.h/2,rh=p.h/rows,out='';
  for(let i=0;i<rows;i++)out+='<rect x="'+x0.toFixed(1)+'" y="'+(y0+i*rh+rh*0.22).toFixed(1)+'" width="'+p.w.toFixed(1)+'" height="'+(rh*0.4).toFixed(1)+'" rx="0.8" fill="currentColor" opacity="'+(0.5-i*0.06).toFixed(2)+'"/>';
  return out;
}

function ovlTemplateThumb(key){
  let t=OVL_TPL_THUMB[key]||OVL_TPL_THUMB.blank;
  let bg=t.bg==='transparent'?'':'<rect width="108" height="192" fill="'+t.bg+'"/>';
  let checker=t.checker?thChecker():'';
  return '<svg viewBox="0 0 108 192" xmlns="http://www.w3.org/2000/svg" style="color:'+t.fg+'" role="img" aria-hidden="true">'+bg+checker+t.body+'</svg>';
}

/* ---------- preset: simpan & muat ulang desain overlay milik pengguna ---------- */
function ovlPresetsKey(){return 'overlayPresets:'+currentAthleteId()}
function ovlLoadPresets(){try{let raw=localStorage.getItem(ovlPresetsKey());let list=raw?JSON.parse(raw):[];return Array.isArray(list)?list:[]}catch(e){return[]}}
function ovlSavePresetsList(list){try{localStorage.setItem(ovlPresetsKey(),JSON.stringify(list));return true}catch(e){return false}}
function ovlSaveCurrentAsPreset(name){
  name=(name||'').trim();
  if(!name){toast('Nama preset tidak boleh kosong');return}
  if(!OVL.els.length){toast('Belum ada elemen untuk disimpan');return}
  let list=ovlLoadPresets();
  list.unshift({id:ovlUid(),name:name,savedAt:Date.now(),bg:JSON.parse(JSON.stringify(OVL.bg)),els:JSON.parse(JSON.stringify(OVL.els))});
  if(list.length>24)list=list.slice(0,24);
  if(ovlSavePresetsList(list)){toast('Preset "'+name+'" tersimpan');ovlPanePreset()}
  else toast('Preset gagal disimpan (penyimpanan penuh)');
}
function ovlApplyPreset(id){
  let pr=ovlLoadPresets().find(p=>p.id===id);if(!pr)return;
  ovlSnapshot();
  OVL.bg=JSON.parse(JSON.stringify(pr.bg));
  OVL.els=JSON.parse(JSON.stringify(pr.els));
  OVL.sel=null;ovlSave();ovlDraw();OVL_TAB='style';ovlRenderPanes();
  toast('Preset "'+pr.name+'" diterapkan');
}
function ovlDeletePreset(id){
  let list=ovlLoadPresets(),pr=list.find(p=>p.id===id);if(!pr)return;
  if(!confirm('Hapus preset "'+pr.name+'"? Tindakan ini tidak bisa dibatalkan.'))return;
  ovlSavePresetsList(list.filter(p=>p.id!==id));
  toast('Preset dihapus');
  ovlPanePreset();
}
function ovlPresetElSVG(el){
  let type=el.type;
  if(type==='stat')return thStat(el.x,el.y,10,el.color);
  if(type==='text')return thTitle(el.x,el.y,Math.max(18,Math.min(64,String(el.text||'').length*3.2)));
  if(type==='emoji')return '<text x="'+(el.x/100*108).toFixed(1)+'" y="'+(el.y/100*192+3).toFixed(1)+'" text-anchor="middle" font-size="10">'+esc(el.text||'🔥')+'</text>';
  if(type==='map')return thMap(el.x,el.y,el.w,el.h,el.stroke);
  if(type==='chart')return thChart(el.x,el.y,el.w,el.h,el.style,el.color);
  if(type==='splits')return thSplits(el.x,el.y,el.w,el.h);
  if(type==='shape')return thPanel(el.x,el.y,el.w,Math.max(el.h,3),el.radius?Math.min(el.radius/4,8):2,0.3);
  return '';
}
function ovlPresetThumb(preset){
  let bg=preset.bg||ovlDefaultBg(),els=preset.els||[],bgSvg;
  if(bg.mode==='photo'&&bg.photo){
    bgSvg='<image href="'+bg.photo+'" x="0" y="0" width="108" height="192" preserveAspectRatio="xMidYMid slice"/><rect width="108" height="192" fill="#000000" opacity="'+((bg.dim||0)/100*0.85).toFixed(2)+'"/>';
  }else if(bg.mode==='solid'){
    bgSvg='<rect width="108" height="192" fill="'+(bg.color||'#101014')+'"/>';
  }else{
    let th=overlayTheme(bg.theme||'sunset'),gid='pg'+esc(preset.id);
    bgSvg='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+th.grad.map(g=>'<stop offset="'+(g[0]*100)+'%" stop-color="'+g[1]+'"/>').join('')+'</linearGradient></defs><rect width="108" height="192" fill="url(#'+gid+')"/>';
  }
  let body=els.map(ovlPresetElSVG).join('');
  return '<svg viewBox="0 0 108 192" xmlns="http://www.w3.org/2000/svg" style="color:#ffffff" role="img" aria-hidden="true">'+bgSvg+body+'</svg>';
}
function ovlPanePreset(){
  let p=$('#ovlPanePreset');if(!p)return;
  let list=ovlLoadPresets();
  let grid=list.length?'<div class="ovl-tpl-grid">'+list.map(pr=>'<div class="ovl-tpl ovl-preset-card" data-preset="'+pr.id+'" role="button" tabindex="0"><span class="ovl-tpl-thumb">'+ovlPresetThumb(pr)+'</span><b>'+esc(pr.name)+'</b><button type="button" class="ovl-preset-del" data-preset-del="'+pr.id+'" aria-label="Hapus preset">✕</button></div>').join('')+'</div>':'<p class="muted ovl-hint">Belum ada preset tersimpan. Atur tampilanmu lalu simpan di atas.</p>';
  p.innerHTML='<div class="ovl-preset-save"><input type="text" id="ovlPresetName" maxlength="30" placeholder="Nama preset, mis. Lari Pagi"><button type="button" class="btn primary" id="ovlPresetSaveBtn">Simpan</button></div><p class="muted ovl-hint">Simpan tampilan overlay saat ini agar bisa dipakai lagi kapan saja. Ketuk kartu untuk menerapkan.</p>'+grid;
  let nameInput=$('#ovlPresetName');
  $('#ovlPresetSaveBtn').onclick=()=>{ovlSaveCurrentAsPreset(nameInput.value);nameInput.value=''};
  nameInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#ovlPresetSaveBtn').click()}};
  $$('#ovlPanePreset [data-preset]').forEach(card=>{card.onclick=e=>{if(e.target.closest('[data-preset-del]'))return;ovlApplyPreset(card.dataset.preset)};card.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('[data-preset-del]')){e.preventDefault();ovlApplyPreset(card.dataset.preset)}}});
  $$('#ovlPanePreset [data-preset-del]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();ovlDeletePreset(btn.dataset.presetDel)});
}

/* ---------- side panes UI ---------- */
function ovlRow(label,inner){return '<label class="ovl-field"><span>'+esc(label)+'</span>'+inner+'</label>'}
function ovlSwatchRow(attr,val){return '<div class="ovl-swatches">'+OVL_SWATCHES.map(c=>'<button type="button" class="ovl-sw'+(String(val).toLowerCase()===c?' on':'')+'" data-color-attr="'+attr+'" data-color="'+c+'" style="background:'+c+'"></button>').join('')+'<input type="color" class="ovl-sw-custom" data-color-attr="'+attr+'" value="'+(val||'#ffffff')+'"></div>'}
function ovlRenderPanes(){
  $$('#ovlTabs .sub-tab').forEach(b=>b.classList.toggle('active',b.dataset.ovlTab===OVL_TAB));
  ['template','add','style','bg','layers','preset'].forEach(t=>{let p=$('#ovlPane'+t.charAt(0).toUpperCase()+t.slice(1));if(p)p.hidden=t!==OVL_TAB});
  if(OVL_TAB==='template')ovlPaneTemplate();
  if(OVL_TAB==='add')ovlPaneAdd();
  if(OVL_TAB==='style')ovlPaneStyle();
  if(OVL_TAB==='bg')ovlPaneBg();
  if(OVL_TAB==='layers')ovlPaneLayers();
  if(OVL_TAB==='preset')ovlPanePreset();
}
function ovlPaneTemplate(){
  let p=$('#ovlPaneTemplate');if(!p)return;
  let list=ovlTemplateList();
  if(!OVL_TPL_CAT)OVL_TPL_CAT=OVL_TPL_CATS[0];
  /* simpan posisi scroll header chip kategori sebelum di-render ulang, supaya klik tidak melempar balik ke awal */
  let prevChips=$('#ovlCatChips'),chipScroll=prevChips?prevChips.scrollLeft:0;
  let chips='<button type="button" class="ovl-cat-chip'+(OVL_TPL_CAT==='all'?' active':'')+'" data-cat="all">Semua</button>'+
    OVL_TPL_CATS.map(g=>'<button type="button" class="ovl-cat-chip'+(OVL_TPL_CAT===g?' active':'')+'" data-cat="'+esc(g)+'">'+esc(g)+'</button>').join('');
  let shown=OVL_TPL_CAT==='all'?list:list.filter(t=>t.g===OVL_TPL_CAT);
  p.innerHTML='<p class="muted ovl-hint">Semua template kini transparan by default \u2014 latar foto tetap tembus, tinggal unduh PNG-nya lalu tempel di atas foto favoritmu. Pilih sebagai titik awal, lalu ubah sebebasnya di tab lain.</p>'+
    '<div class="ovl-cat-chips" id="ovlCatChips">'+chips+'</div>'+
    '<div class="ovl-tpl-grid">'+shown.map(t=>'<button type="button" class="ovl-tpl" data-tpl="'+t.k+'" title="'+esc(t.d)+'"><span class="ovl-tpl-thumb">'+ovlTemplateThumb(t.k)+'</span><b>'+esc(t.n)+'</b></button>').join('')+'</div>';
  let newChips=$('#ovlCatChips');if(newChips)newChips.scrollLeft=chipScroll;
  $$('#ovlPaneTemplate [data-tpl]').forEach(b=>b.onclick=()=>ovlApplyTemplate(b.dataset.tpl));
  $$('#ovlCatChips [data-cat]').forEach(b=>b.onclick=()=>{OVL_TPL_CAT=b.dataset.cat;ovlPaneTemplate()});
}

  let note=OVL_STREAM_STATE==='loading'?'<p class="muted ovl-hint">⏳ Mengambil data detik-per-detik (HR, elevasi, power) dari Strava...</p>':(OVL_STREAM_STATE==='none'?'<p class="muted ovl-hint">Aktivitas ini tidak punya data detail Strava, jadi grafik &amp; splits akan kosong.</p>':'');

    '<div class="overlay-stat-group"><small class="overlay-stat-group-label">ELEMEN</small><div class="overlay-stat-chips">'+
      '<button type="button" class="overlay-stat-chip" data-add-el="text">+ Teks</button>'+
      '<button type="button" class="overlay-stat-chip" data-add-el="map">+ Peta rute</button>'+
      '<button type="button" class="overlay-stat-chip" data-add-el="chart">+ Grafik</button>'+
      '<button type="button" class="overlay-stat-chip" data-add-el="splits">+ Splits</button>'+
      '<button type="button" class="overlay-stat-chip" data-add-el="shape">+ Garis/Kotak</button>'+
      '<button type="button" class="overlay-stat-chip" data-add-el="circle">+ Lingkaran</button>'+
    '</div></div>'+statHtml+
    '<div class="overlay-stat-group"><small class="overlay-stat-group-label">EMOJI</small><div class="ovl-emoji-grid">'+OVL_EMOJIS.map(e=>'<button type="button" class="ovl-emoji" data-add-emoji="'+e+'">'+e+'</button>').join('')+'</div></div>';
  $$('#ovlPaneAdd [data-add-stat]').forEach(b=>b.onclick=()=>ovlAdd(ovlNewEl('stat',{key:b.dataset.addStat,pos:{y:45}})));

    if(a==='front'&&i<OVL.els.length-1){OVL.els.splice(i,1);OVL.els.push(el)}
    if(a==='back'&&i>0){OVL.els.splice(i,1);OVL.els.unshift(el)}
    ovlSave();ovlDraw();ovlRenderPanes();

function ovlBindAttrs(root,obj){
  root.querySelectorAll('[data-attr]').forEach(inp=>{
    let attr=inp.dataset.attr,ev=(inp.type==='checkbox'||inp.tagName==='SELECT')?'change':'input';
    inp.addEventListener(ev,()=>{
      let v=inp.type==='checkbox'?inp.checked:(inp.type==='range'?parseFloat(inp.value):inp.value);
      if(attr==='weight')v=parseInt(v,10);
      obj[attr]=v;ovlSave();ovlDraw();
      if(attr==='metric'&&!ovlStreams())ovlFetchStreams();
    });
  });
  root.querySelectorAll('[data-color-attr]').forEach(btn=>{
    if(btn.tagName==='INPUT'){btn.addEventListener('input',()=>{obj[btn.dataset.colorAttr]=btn.value;ovlSave();ovlDraw()});return}
    btn.onclick=()=>{obj[btn.dataset.colorAttr]=btn.dataset.color;ovlSave();ovlDraw();
      btn.parentNode.querySelectorAll('.ovl-sw').forEach(s=>s.classList.toggle('on',s===btn))};
  });
}
function ovlPaneBg(){
  let p=$('#ovlPaneBg'),bg=OVL.bg||(OVL.bg=ovlDefaultBg());if(!p)return;
  p.innerHTML=ovlRow('Jenis latar','<select data-attr="mode"><option value="gradient"'+(bg.mode==='gradient'?' selected':'')+'>Gradien tema</option><option value="solid"'+(bg.mode==='solid'?' selected':'')+'>Warna polos</option><option value="photo"'+(bg.mode==='photo'?' selected':'')+'>Foto sendiri</option><option value="transparent"'+(bg.mode==='transparent'?' selected':'')+'>Transparan (stiker PNG)</option></select>')+
    (bg.mode==='gradient'?ovlRow('Tema','<select data-attr="theme"><option value="sunset"'+(bg.theme==='sunset'?' selected':'')+'>Strava Sunset</option><option value="dark"'+(bg.theme==='dark'?' selected':'')+'>Dark Minimal</option><option value="light"'+(bg.theme==='light'?' selected':'')+'>Light Clean</option><option value="mono"'+(bg.theme==='mono'?' selected':'')+'>Mono Orange</option></select>'):'')+
    (bg.mode==='solid'?'<div class="ovl-field"><span>Warna</span>'+ovlSwatchRow('color',bg.color)+'</div>':'')+
    (bg.mode==='photo'?'<div class="ovl-field"><span>Foto latar</span><input type="file" accept="image/*" id="ovlBgPhoto"></div>'+
      ovlRow('Gelapkan','<input type="range" min="0" max="85" data-attr="dim" value="'+bg.dim+'">')+
      ovlRow('Blur','<input type="range" min="0" max="30" data-attr="blur" value="'+bg.blur+'">'):'')+
    '<p class="muted ovl-hint">Latar transparan menghasilkan PNG tanpa background — cocok ditempel di atas foto/video story.</p>';
  ovlBindAttrs(p,bg);
  p.querySelectorAll('[data-attr]').forEach(i=>{if(i.dataset.attr==='mode')i.addEventListener('change',()=>ovlPaneBg())});
  let f=$('#ovlBgPhoto');
  if(f)f.onchange=e=>{
    let file=e.target.files[0];if(!file)return;
    let rd=new FileReader();
    rd.onload=()=>{let img=new Image();img.onload=()=>{OVL_BGIMG=img;bg.photo=rd.result;ovlSave();ovlDraw()};img.src=rd.result};
    rd.readAsDataURL(file);
  };
}
function ovlPaneLayers(){
  let p=$('#ovlPaneLayers'),x=ovlActivity();if(!p)return;
  if(!OVL.els.length){p.innerHTML='<p class="muted ovl-hint">Belum ada elemen. Buka tab Template atau Tambah.</p>';return}
  let name=el=>el.type==='stat'?((ovlStatVal(el.key,x)||{}).label||el.key):el.type==='text'?('Teks: '+String(el.text||'').slice(0,18)):el.type==='emoji'?('Emoji '+el.text):el.type==='map'?'Peta rute':el.type==='chart'?('Grafik '+((OVL_METRICS.find(m=>m.k===el.metric)||{}).n||'')):el.type==='splits'?'Tabel splits':'Bentuk';
  p.innerHTML='<div class="ovl-layers">'+OVL.els.slice().reverse().map(el=>'<div class="ovl-layer'+(el.id===OVL.sel?' on':'')+'" data-layer="'+el.id+'"><span>'+esc(name(el))+'</span><span class="ovl-layer-acts"><button type="button" data-layer-act="up" data-id="'+el.id+'">↑</button><button type="button" data-layer-act="down" data-id="'+el.id+'">↓</button><button type="button" data-layer-act="del" data-id="'+el.id+'">✕</button></span></div>').join('')+'</div>';
  $$('#ovlPaneLayers [data-layer]').forEach(d=>d.onclick=e=>{if(e.target.dataset.layerAct)return;OVL.sel=d.dataset.layer;OVL_TAB='style';ovlDraw();ovlRenderPanes()});
  $$('#ovlPaneLayers [data-layer-act]').forEach(b=>b.onclick=()=>{
    let id=b.dataset.id,i=OVL.els.findIndex(e=>e.id===id),el=OVL.els[i];if(i<0)return;ovlSnapshot();
    if(b.dataset.layerAct==='del'){ovlRemove(id);return}
    if(b.dataset.layerAct==='up'&&i<OVL.els.length-1){OVL.els.splice(i,1);OVL.els.splice(i+1,0,el)}
    if(b.dataset.layerAct==='down'&&i>0){OVL.els.splice(i,1);OVL.els.splice(i-1,0,el)}
    ovlSave();ovlDraw();ovlPaneLayers();
  });
}

/* ---------- export ---------- */
function ovlExport(){
  if(!ovlActivity()){toast('Pilih aktivitas dulu');return}
  if(!OVL.els.length){toast('Tambahkan minimal satu elemen ke kartu');return}
  let c=document.createElement('canvas');c.width=OVL_W;c.height=OVL_H;
  let ctx=c.getContext('2d'),keep=OVL.sel;OVL.sel=null;
  ovlDraw(ctx);OVL.sel=keep;
  let dataUrl=c.toDataURL('image/png');
  $('#detailContent').innerHTML='<div class="wrapped-preview"><img src="'+dataUrl+'" alt="Overlay aktivitas"></div><div class="wrapped-actions"><button type="button" class="btn primary" id="overlayDownload">⬇ Unduh PNG</button><button type="button" class="btn secondary" id="overlayShare" hidden>📤 Share</button></div>';
  openModal();
  c.toBlob(function(blob){
    if(!blob)return;
    $('#overlayDownload').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='active-coach-overlay.png';a.click()};
    try{let file=new File([blob],'active-coach-overlay.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){let b=$('#overlayShare');b.hidden=false;b.onclick=async()=>{try{await navigator.share({files:[file],title:'Overlay Aktivitas',text:'Overlay aktivitas dari Active Coach'})}catch(e){}}}
    }catch(e){}
  },'image/png');
}

/* ---------- entry point ---------- */
async function ovlEnsureFonts(){
  if(OVL_FONTS_READY||!document.fonts)return;OVL_FONTS_READY=true;
  try{await Promise.all(OVL_FONTS.map(f=>document.fonts.load('900 60px '+f.css)).concat(OVL_FONTS.map(f=>document.fonts.load('700 30px '+f.css))));ovlDraw()}catch(e){}
}
function renderOverlayEditor(){
  let sel=$('#ovlActivitySelect');if(!sel)return;
  if(!OVL.bg)OVL.bg=ovlDefaultBg();
  if(!OVL.els.length&&!OVL._loaded){OVL._loaded=true;ovlLoad()}
  let logs=(DATA.logs||[]).slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,80);
  sel.innerHTML=logs.map(l=>'<option value="'+esc(l.id)+'">'+esc(fmtDateShort(l.date))+' · '+esc(l.title)+(l.distance?' · '+l.distance.toFixed(1)+' km':'')+'</option>').join('')||'<option value="">Belum ada aktivitas</option>';
  if(OVL.activityId&&logs.some(l=>String(l.id)===String(OVL.activityId)))sel.value=OVL.activityId;else OVL.activityId=sel.value;
  if(OVL.bg&&OVL.bg.photo&&!OVL_BGIMG){let img=new Image();img.onload=()=>{OVL_BGIMG=img;ovlDraw()};img.src=OVL.bg.photo}
  if(!OVL.els.length)ovlApplyTemplate('grid');
  ovlDraw();ovlRenderPanes();ovlEnsureFonts();ovlFetchStreams();
}

</script>

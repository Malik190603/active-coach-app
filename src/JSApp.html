<script>
'use strict';

function attachSheetDrag(handleId,boxId,closeFn){
  let handle=$('#'+handleId);if(!handle)return;
  let box=$('#'+boxId),startY=0,dy=0,dragging=false;
  handle.addEventListener('touchstart',e=>{if(window.innerWidth>=1000)return;startY=e.touches[0].clientY;dy=0;dragging=true;box.classList.add('dragging')},{passive:true});
  handle.addEventListener('touchmove',e=>{if(!dragging)return;dy=Math.max(0,e.touches[0].clientY-startY);box.style.transform='translateY('+dy+'px)'},{passive:true});
  handle.addEventListener('touchend',()=>{if(!dragging)return;dragging=false;box.classList.remove('dragging');if(dy>90){closeFn()}else{box.style.transform=''}});
}

function initPullToRefresh(){
  let ind=$('#ptrIndicator');if(!ind)return;
  let label=$('#ptrLabel'),startY=0,dist=0,pulling=false,startTarget=null;const THRESHOLD=84,MAX=110;
  function loginOpen(){let ls=$('#loginScreen');return ls&&!ls.hidden}
  function modalOpen(){let m=$('#modal');return m&&m.classList.contains('show')}
  document.addEventListener('touchstart',e=>{
    if(window.innerWidth>=1000||loginOpen()||modalOpen()||window.scrollY>4||LOAD_BUSY)return;
    if(e.touches.length>1)return;
    let t=e.target;if(t.closest&&(t.closest('input,select,textarea,button,a,.fab-stack,.popup-overlay,.modal')))return;
    startY=e.touches[0].clientY;dist=0;pulling=true;startTarget=t;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!pulling)return;
    if(window.scrollY>4){pulling=false;dist=0;ind.style.height='0px';ind.classList.remove('ready');return}
    let delta=e.touches[0].clientY-startY;
    if(delta<=0){dist=0;ind.style.height='0px';ind.classList.remove('ready');return}
    dist=Math.min(delta*0.45,MAX);
    ind.style.height=dist+'px';
    ind.classList.toggle('ready',dist>=THRESHOLD)
  },{passive:true});
  document.addEventListener('touchend',async()=>{
    if(!pulling)return;pulling=false;
    if(dist>=THRESHOLD){
      if(Date.now()-LAST_PTR_LOAD<8000||LOAD_BUSY){ind.classList.remove('ready');ind.style.height='0px';dist=0;return}
      LAST_PTR_LOAD=Date.now();
      ind.classList.add('loading');label.textContent='Menyinkronkan...';ind.style.height=THRESHOLD+'px';
      try{await load()}catch(e){}
      ind.classList.remove('loading','ready');label.textContent='Tarik untuk sinkronkan';ind.style.height='0px';dist=0;
    }else{
      ind.classList.remove('ready');ind.style.height='0px';dist=0;
    }
  });
}

async function load(){if(LOAD_BUSY)return;LOAD_BUSY=true;let first=!$('#app')||$('#app').hidden;try{let __ld=$('#loading');if(__ld){if(!LOADING_SKELETON_HTML)LOADING_SKELETON_HTML=__ld.innerHTML;else __ld.innerHTML=LOADING_SKELETON_HTML}showGlobalLoader('Memuat data…');if(first){$('#loading').hidden=false;$('#app').hidden=true}let keepPro=DATA&&DATA.pro,keepGarage=DATA&&DATA.bikeGarage;DATA=await gs('getAppData',currentAthleteId());try{sportAdaptDefaults()}catch(e){}if(keepGarage&&!DATA.bikeGarage)DATA.bikeGarage=keepGarage;ROUTE_CACHE=null;PLAN_FORM=null;PLAN_DONUT_FILTER=null;compareSelection=[];let n=DATA.profile?.nama||SESSION.nama||'Athlete',photo=DATA.profile?.profilePhoto||'';setAvatarEls(n,photo);$$('.js-athlete-name').forEach(el=>el.textContent=n);let pin=$('#profileIdName');if(pin)pin.textContent=n;let pis=$('#profileIdSub');if(pis)pis.textContent=(DATA.recommendation||{}).level||'Siap berlatih';$('#loading').hidden=true;$('#app').hidden=false;let v=currentPageView();if(v==='detail'){closeDetailPage()}else{renderPageContent(v)}requestAnimationFrame(()=>{initSubTabPills();$$('.page:not([hidden])').forEach(positionSubPill)})}catch(e){console.error(e);$('#loading').hidden=false;$('#loading').innerHTML=inlineSpinner('Gagal memuat, coba lagi…');toast('Gagal memuat data')}hideGlobalLoader();LOAD_BUSY=false}
async function loadStrava(){try{let s=await gs('getStravaStatus',currentAthleteId());STRAVA_CONNECTED=!!s.connected;document.documentElement.setAttribute('data-strava',s.connected?'on':'off');let st=$('#syncState');if(st)st.innerHTML=s.connected?stravaTag()+' tersambung':stravaTag()+' belum tersambung';let sub=$('#syncStateSub');if(sub)sub.textContent=s.connected?('Akun: '+(s.athlete||'atlet')+'. Tarik aktivitas terbaru kapan saja.'):'Hubungkan akun agar aktivitas masuk otomatis.';let cl=document.querySelector('#stravaConnect .js-connect-label'),cs=document.querySelector('#stravaConnect .js-connect-sub');if(cl)cl.innerHTML=s.connected?'Putuskan '+stravaTag():'Hubungkan '+stravaTag();if(cs)cs.textContent=s.connected?'Hentikan akses aplikasi ke akun Strava':'Izinkan akses data aktivitas';let sc=$('#stravaConnect');if(sc){sc.classList.toggle('is-danger',!!s.connected);sc.onclick=()=>s.connected?(confirm('Putuskan koneksi Strava?')&&disconnectStrava()):connectStrava(s)}let ss=$('#stravaSync');if(ss){ss.hidden=!s.connected;ss.onclick=syncStrava}let badge=$('#dashboardSyncState');if(badge)badge.textContent=s.connected?'Strava tersambung':'Strava belum tersambung';$$('.acx-syncbtn').forEach(b=>b.title=s.connected?'Strava tersambung · sinkronisasi':'Strava belum tersambung');let ps=$('#profileSyncState');if(ps)ps.innerHTML=s.connected?stravaTag()+' tersambung · '+esc(s.athlete||''):stravaTag()+' belum tersambung';if(currentPageView()==='dashboard'&&!(DATA.logs||[]).length){try{renderDashboard()}catch(e){}}}catch(e){STRAVA_CONNECTED=false;document.documentElement.setAttribute('data-strava','off');let st=$('#syncState');if(st)st.textContent='Status sinkronisasi tidak tersedia'}}
function connectStrava(s){if(!s.configured)return toast('Isi kredensial '+stravaTag()+' di Script Properties');window.open(s.authUrl,'_blank','noopener')}
async function disconnectStrava(){showGlobalLoader('Memutus Strava…');await gs('disconnectStrava',currentAthleteId());hideGlobalLoader();toast(stravaTag()+' diputus');loadStrava()}
async function syncStrava(){if(LOAD_BUSY){toast('Masih memuat, tunggu sebentar…');return}let root=document.documentElement,__syncT0=Date.now(),__syncT=setInterval(()=>{let t=$('#globalLoaderText');if(t)t.textContent='Menyinkronkan Strava… '+Math.round((Date.now()-__syncT0)/1000)+' dtk'},1000);root.classList.add('is-syncing');try{let p=$('#syncPopup');if(p)p.hidden=true;showGlobalLoader('Menyinkronkan Strava…');let r=await gs('syncStravaAll',currentAthleteId());await load();await loadStrava();clearInterval(__syncT);hideGlobalLoader();let next=DATA.dashboardPlan?`${DATA.dashboardPlanDay||'Plan berikutnya'}: ${DATA.dashboardPlan.title} ${duration(DATA.dashboardPlan.minutes)}`:'Susun plan mingguan untuk arahan berikutnya';toast(`${r.imported||0} aktivitas masuk. ${next}`)}catch(e){clearInterval(__syncT);hideGlobalLoader();toast('Sinkronisasi gagal: '+(e.message||e))}root.classList.remove('is-syncing')}

function acxNavClick(btn){
  let page=btn.dataset.page,cur=currentPageView();
  if(cur===page){window.scrollTo({top:0,behavior:'smooth'});return}

  switchPage(page,{restoreScroll:true});
}

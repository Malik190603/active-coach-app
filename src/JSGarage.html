<script>
'use strict';

const GARAGE_NONE='__none__';
const GARAGE_TYPES={road:'Road',gravel:'Gravel',mtb:'MTB',tt:'TT / Triathlon',hybrid:'Hybrid / City',folding:'Sepeda lipat',ebike:'E-Bike',other:'Lainnya'};
const GARAGE_GROUPS=[['drivetrain','Penggerak'],['brake','Rem'],['wheel','Roda & Ban'],['cockpit','Kokpit & Titik Kontak'],['frame','Rangka & Suspensi'],['care','Perawatan Rutin'],['other','Lainnya']];
const GARAGE_SERVICE_TYPES={service:'Servis / setel',replace:'Ganti baru',upgrade:'Upgrade',clean:'Cuci & lube',check:'Cek / inspeksi',repair:'Perbaikan'};
const GARAGE_COLORS=['#1c1c1e','#8e8e93','#d1d1d6','#ff3b30','#ff9500','#ffcc00','#34c759','#30b0c7','#007aff','#5856d6','#af52de','#ff2d55'];
const GARAGE_HOW={gear:'Gear Strava',manual:'Manual',default:'Sepeda utama',othergear:'Gear lain',indoor:'Indoor',nobike:'Tanpa sepeda',excluded:'Diabaikan'};
let GARAGE_UI={active:false,entry:'garage',bikeId:'',tab:'overview',rideFilter:'all',rideLimit:40,syncing:false,autoSynced:false,loading:false,error:''};

function fmtRp(v){return 'Rp'+Math.round(Number(v)||0).toLocaleString('id-ID')}

function gxRpShort(v){v=Math.round(Number(v)||0);let a=Math.abs(v),f=(n,d)=>n.toLocaleString('id-ID',{maximumFractionDigits:d});if(a>=1e9)return 'Rp'+f(v/1e9,2)+' M';if(a>=1e6)return 'Rp'+f(v/1e6,1)+' jt';if(a>=1e4)return 'Rp'+f(v/1e3,0)+' rb';return fmtRp(v)}
function gxNum(v,dec){return (Number(v)||0).toLocaleString('id-ID',{maximumFractionDigits:dec==null?0:dec})}
function gxKm(v,dec){return gxNum(v,dec)+' km'}
function gxIso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function gxToday(){return gxIso(new Date())}
function gxAddDays(s,n){let d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return gxIso(d)}
function gxDays(from,to){if(!from)return null;let a=new Date(from+'T00:00:00'),b=new Date((to||gxToday())+'T00:00:00');let n=Math.round((b-a)/86400000);return isFinite(n)?n:null}
function gxAgo(ts){if(!ts)return 'belum pernah';let m=Math.round((Date.now()-ts)/60000);if(m<1)return 'baru saja';if(m<60)return m+' menit lalu';let h=Math.round(m/60);if(h<24)return h+' jam lalu';return Math.round(h/24)+' hari lalu'}
function gxEta(days){if(days==null||!isFinite(days))return '';if(days<=0)return 'sekarang';if(days<14)return '±'+Math.ceil(days)+' hari lagi';if(days<60)return '±'+Math.round(days/7)+' minggu lagi';if(days<730)return '±'+Math.round(days/30)+' bulan lagi';return '> 2 tahun lagi'}
function gxIcon(id){return `<span class="icon"><svg><use href="#${id}"/></svg></span>`}
function gxVal(sel){let el=$(sel);return el?String(el.value||'').trim():''}
function gxNumVal(sel){let v=gxVal(sel).replace(/\s/g,'');if(v.indexOf(',')>=0)v=v.replace(/\./g,'').replace(',','.');let n=Number(v);return isFinite(n)&&n>0?n:0}
function gxBikeColor(b){return (b&&b.color)||'#8e8e93'}
function gxErr(e){return esc(String((e&&e.message)||e||'Terjadi kesalahan')).slice(0,180)}

function garageState(){return DATA.bikeGarage||null}
function bikeGarage(){return (DATA.bikeGarage&&DATA.bikeGarage.bikes)||[]}
function bikeById(id){return bikeGarage().find(b=>String(b.id)===String(id))||null}
function stravaBikeById(id){return ((garageState()||{}).stravaBikes||[]).find(s=>s.id===id)||null}
function garageApply(r,msg){
  if(!r||!Array.isArray(r.bikes))throw new Error('Respons server tidak valid');
  DATA.bikeGarage=r;garageModel.cache=null;GARAGE_UI.error='';
  if(r.photoError)toast(esc(r.photoError));else if(msg)toast(msg);
  garageRefresh();
}
async function garageCall(fn,args,opts){
  opts=opts||{};let btn=opts.btn,label=btn?btn.innerHTML:'';
  if(btn){btn.disabled=true;btn.innerHTML=opts.busy||'Menyimpan…'}
  try{
    let r=await gs(fn,...args,currentAthleteId());
    if(opts.close)closeModal();
    if(opts.before)opts.before(r);
    garageApply(r,opts.msg);
    return r;
  }catch(e){toast('Gagal: '+gxErr(e));return null}
  finally{if(btn&&document.body.contains(btn)){btn.disabled=false;btn.innerHTML=label}}
}
function garageEnsureLoaded(){
  if(DATA.bikeGarage||GARAGE_UI.loading)return;
  GARAGE_UI.loading=true;GARAGE_UI.error='';
  gs('getBikeGarage',currentAthleteId()).then(r=>{DATA.bikeGarage=r;garageModel.cache=null}).catch(e=>{GARAGE_UI.error=gxErr(e)}).finally(()=>{GARAGE_UI.loading=false;garageRefresh();garageAutoSync()});
}
function garageAutoSync(){
  let G=garageState();if(!G||GARAGE_UI.autoSynced||!G.stravaConnected||!GARAGE_UI.active)return;
  GARAGE_UI.autoSynced=true;
  if(!G.gearSyncedAt){toast('Menghubungkan ride Strava ke sepeda…');garageRunGearSync(true)}
  else if(Date.now()-G.gearSyncedAt>6*3600000)garageRunGearSync(false,true);
}
async function garageRunGearSync(full,silent){
  if(GARAGE_UI.syncing)return;GARAGE_UI.syncing=true;garageRefresh();
  try{
    let r=await gs('garageSyncGear',currentAthleteId(),!!full);
    DATA.bikeGarage=r;garageModel.cache=null;
    let i=r.syncInfo||{};
    if(!silent||i.changed)toast('Gear tersinkron · '+gxNum(i.scanned)+' ride dipindai'+(i.changed?', '+gxNum(i.changed)+' diperbarui':''));
  }catch(e){if(!silent)toast('Sinkron gear gagal: '+gxErr(e))}
  finally{GARAGE_UI.syncing=false;garageRefresh()}
}

function garageIsRideLog(x){return !!x&&(x.sport==='Cycling'||/ride/i.test(String(x.sportType||'')))}
function garageModel(){
  let G=DATA.bikeGarage;if(!G)return null;
  let logs=DATA.logs||[],key=(G.serverTime||0)+'|'+logs.length+'|'+(logs[0]?logs[0].id:'')+'|'+(logs.length?logs[logs.length-1].id:'')+'|'+gxToday()+'|'+(DATA.pro&&DATA.pro.analysis?Object.keys(DATA.pro.analysis).length:0);
  if(garageModel.cache&&garageModel.cache.key===key)return garageModel.cache;
  let bikes=G.bikes||[],byId={},byGear={},gearOf={},per={},rides=[],unassigned=[];
  bikes.forEach(b=>{byId[b.id]=b;if(b.gearId)byGear[b.gearId]=b;per[b.id]={bike:b,rides:[],counted:[],ridesKm:0}});
  let gi=G.gearIndex||{};Object.keys(gi).forEach(g=>(gi[g]||[]).forEach(id=>{gearOf[String(id)]=g}));
  let ov=G.overrides||{},anyLinked=bikes.some(b=>b.gearId&&!b.retired),dflt=byId[G.defaultBikeId];
  if(dflt&&dflt.retired)dflt=null;
  logs.forEach(x=>{
    if(!garageIsRideLog(x))return;
    let sid=String(x.stravaId||''),o=sid?ov[sid]:'',gear=sid?(gearOf[sid]||''):'',bike=null,how='';
    if(o===GARAGE_NONE)how='excluded';
    else if(o&&byId[o]){bike=byId[o];how='manual'}
    else if(gear&&byGear[gear]){bike=byGear[gear];how='gear'}
    else if(gear&&anyLinked)how='othergear';
    else if(dflt){if(!dflt.includeIndoor&&/virtual/i.test(String(x.sportType||'')))how='indoor';else{bike=dflt;how='default'}}
    else how='nobike';
    let r={log:x,id:x.id,sid:sid,date:String(x.date||'').slice(0,10),km:Number(x.distance)||0,gear:gear,how:how,bikeId:bike?bike.id:'',counted:false};
    if(bike){let p=per[bike.id];r.counted=!bike.trackFrom||r.date>=bike.trackFrom;p.rides.push(r);if(r.counted){p.counted.push(r);p.ridesKm+=r.km}}
    else if(how!=='excluded')unassigned.push(r);
    rides.push(r);
  });
  let today=gxToday(),c56=gxAddDays(today,-56),c30=gxAddDays(today,-30),byDate=(a,c)=>c.date.localeCompare(a.date);
  Object.keys(per).forEach(id=>{
    let p=per[id],b=p.bike,sb=b.gearId?stravaBikeById(b.gearId):null;
    p.rides.sort(byDate);p.counted.sort(byDate);
    p.stravaBike=sb;p.useStrava=b.odoSource==='strava'&&!!sb&&Number(sb.distanceKm)>0;
    p.odo=p.useStrava?Number(sb.distanceKm):(Number(b.offsetKm)||0)+p.ridesKm;
    p.weeklyKm=p.rides.filter(r=>r.date>=c56).reduce((s,r)=>s+r.km,0)/8;p.dailyKm=p.weeklyKm/7;
    p.km30=p.rides.filter(r=>r.date>=c30).reduce((s,r)=>s+r.km,0);
    p.lastRide=p.rides[0]||null;
    p.parts=(b.parts||[]).map(pt=>garagePartStatus(b,pt,p));
    p.due=p.parts.filter(s=>s.level==='bad'||s.level==='warn').sort((a,c)=>c.ratio-a.ratio);
    p.health=garageHealth(p);
    p.serviceCost=(b.history||[]).reduce((s,h)=>s+(Number(h.cost)||0),0);
    p.upgradeParts=(b.parts||[]).filter(x=>x.status==='upgrade');
    p.upgradeCost=p.upgradeParts.reduce((s,x)=>s+(Number(x.price)||0),0);
  });
  garageModel.cache={key:key,per:per,rides:rides,unassigned:unassigned,dflt:dflt,byGear:byGear};
  return garageModel.cache;
}
function garageKmSince(p,date){let s=0;p.counted.forEach(r=>{if(r.date>=date)s+=r.km});return s}
function garageOdoAt(p,date){if(!date)return p.odo;return Math.max(0,Math.round((p.odo-garageKmSince(p,date))*10)/10)}
function garagePartStatus(b,pt,p){
  let byDate=pt.trackBy==='date'&&!!pt.installedDate;
  let usedKm=byDate?garageKmSince(p,pt.installedDate):Math.max(0,p.odo-(Number(pt.installedKm)||0));

  let wetKm=0;try{wetKm=typeof proWetExtra==='function'?proWetExtra(p,pt):0}catch(e){wetKm=0}usedKm+=wetKm;
  let ivK=Number(pt.intervalKm)||0,ivD=Number(pt.intervalDays)||0;
  let ageDays=pt.installedDate?gxDays(pt.installedDate):null;
  let rK=ivK>0?usedKm/ivK:0,rD=ivD>0&&ageDays!=null?ageDays/ivD:0,ratio=Math.max(rK,rD);
  if(pt.condition==='Ganti')ratio=Math.max(ratio,1);else if(pt.condition==='Waspada')ratio=Math.max(ratio,0.8);
  let remKm=ivK>0?ivK-usedKm:null,remDays=ivD>0&&ageDays!=null?ivD-ageDays:null;
  let etas=[];if(remKm!=null&&p.dailyKm>0.05)etas.push(remKm/p.dailyKm);if(remDays!=null)etas.push(remDays);
  let etaDays=etas.length?Math.min(...etas):null;
  let has=ivK>0||ivD>0;
  let level=ratio>=1?'bad':ratio>=0.8?'warn':has?'ok':'none';
  let remaining=Infinity;
  if(remKm!=null)remaining=remKm;
  if(remDays!=null)remaining=Math.min(remaining,Math.round(remDays*Math.max(1,p.dailyKm)));
  if(pt.condition==='Ganti')remaining=Math.min(remaining,0);else if(pt.condition==='Waspada')remaining=Math.min(remaining,300);
  return {part:pt,wetKm:wetKm,usedKm:usedKm,ageDays:ageDays,ratio:ratio,remKm:remKm,remDays:remDays,etaDays:etaDays,level:level,remaining:remaining,hasInterval:has};
}
function garageHealth(p){
  let iv=p.parts.filter(s=>s.hasInterval||s.part.condition!=='Baik');
  if(!iv.length)return {score:100,grade:'Prima',color:'var(--ios-green)'};
  let avg=iv.reduce((s,x)=>s+Math.min(x.ratio,1),0)/iv.length,bad=iv.filter(x=>x.level==='bad').length,warn=iv.filter(x=>x.level==='warn').length;
  let score=Math.max(0,Math.min(100,Math.round(100-avg*40-bad*12-warn*4)));
  return score>=85?{score:score,grade:'Prima',color:'var(--ios-green)'}:score>=65?{score:score,grade:'Baik',color:'var(--ios-teal)'}:score>=45?{score:score,grade:'Perlu perhatian',color:'var(--ios-orange)'}:{score:score,grade:'Kritis',color:'var(--ios-red)'};
}

function bikeServiceDue(){
  let m=garageModel();if(!m)return [];let out=[];
  Object.keys(m.per).forEach(id=>{let p=m.per[id];if(p.bike.retired)return;p.parts.forEach(s=>{if(!isFinite(s.remaining))return;out.push({bike:p.bike,part:s.part,used:Math.round(s.usedKm),remaining:Math.round(s.remaining),ratio:s.ratio,level:s.level,etaDays:s.etaDays,status:s})})});
  return out.sort((a,b)=>b.ratio-a.ratio||a.remaining-b.remaining);
}
function serviceText(d){return d.remaining<=0?'Terlambat '+gxKm(-d.remaining):'Sisa '+gxKm(d.remaining)}
function garageStatusText(s){
  let bits=[];
  if(s.remKm!=null)bits.push(s.remKm<=0?'lewat '+gxKm(-s.remKm):'sisa '+gxKm(s.remKm));
  if(s.remDays!=null)bits.push(s.remDays<=0?'lewat '+gxNum(-s.remDays)+' hari':'sisa '+gxNum(s.remDays)+' hari');
  if(s.part.condition&&s.part.condition!=='Baik')bits.push('kondisi '+s.part.condition.toLowerCase());
  if(!bits.length)bits.push(gxKm(s.usedKm)+' terpakai');
  return bits.join(' · ');
}

window.__gxPhotos=window.__gxPhotos||{};window.__gxPhotoLoading=window.__gxPhotoLoading||{};
function garageBikeSvg(color){return `<svg class="gx-bike-svg" viewBox="0 0 120 70" aria-hidden="true"><g fill="none" stroke="${esc(color)}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="48" r="17"/><circle cx="94" cy="48" r="17"/><path d="M26 48 L55 48 L48 20 Z"/><path d="M48 20 L80 20 L55 48"/><path d="M80 20 L94 48"/><path d="M48 20 L46 13 M40 12.5 H54"/><path d="M80 20 L79 11 L88 10"/></g><circle cx="55" cy="48" r="4" fill="${esc(color)}"/></svg>`}
function garageMediaHtml(b){
  let src=b.photoId?window.__gxPhotos[b.photoId]:'';
  if(src)return `<img src="${src}" alt="${esc(b.name)}">`;
  return garageBikeSvg(gxBikeColor(b))+(b.photoId?`<span class="gx-photo-wait" data-gx-photo="${esc(b.photoId)}"></span>`:'');
}
function garageLoadPhotos(root){
  (root||document).querySelectorAll('[data-gx-photo]').forEach(el=>{
    let id=el.dataset.gxPhoto;if(!id||window.__gxPhotoLoading[id])return;
    window.__gxPhotoLoading[id]=true;
    gs('getBikePhotoContent',id,currentAthleteId()).then(src=>{window.__gxPhotos[id]=src;document.querySelectorAll('[data-gx-photo="'+id+'"]').forEach(w=>{let box=w.parentElement;if(box)box.innerHTML=`<img src="${src}" alt="">`})}).catch(()=>{}).finally(()=>{delete window.__gxPhotoLoading[id]});
  });
}
function compressBikePhoto(file){
  return new Promise(ok=>{
    let img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        let w0=img.width||1600,h0=img.height||1200,out='';
        let tries=[[1400,0.82],[1280,0.75],[1024,0.72],[900,0.68]];
        for(let a=0;a<tries.length;a++){
          let max=tries[a][0],q=tries[a][1],r=Math.min(1,max/Math.max(w0,h0));
          let w=Math.max(1,Math.round(w0*r)),h=Math.max(1,Math.round(h0*r));
          let c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          out=c.toDataURL('image/jpeg',q);
          if(out.length<=900000)break;
        }
        URL.revokeObjectURL(url);
        ok(Math.round(out.length*0.75)<=1048576?out:'');
      }catch(e){URL.revokeObjectURL(url);ok('')}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);ok('')};
    img.src=url;
  });
}

function garageProSafe(fn,...args){try{return typeof window[fn]==='function'?(window[fn](...args)||''):''}catch(e){console.log('Pro '+fn,e);return ''}}
function garageRefresh(opts){let v=currentPageView();if(GARAGE_UI.active&&(v==='detail'||(v==='garage'&&SUB_STATE.garage==='bikes')))garageRender(opts)}
function garageSetHeader(){
  let svc=GARAGE_UI.entry==='service',b=GARAGE_UI.bikeId?bikeById(GARAGE_UI.bikeId):null;
  if(currentPageView()==='garage'){let t=$('#garageTitle'),k=$('#garageKicker'),bb=$('#garageBackBtn');if(t)t.textContent=b?b.name:'Garasi';if(k)k.textContent=b?'Odometer, part, servis & ride sepeda ini':(svc?'Pilih sepeda untuk jadwal servis':'Sepeda, sepatu & perawatan');if(bb){bb.hidden=!b;bb.onclick=()=>garageBackToPicker()}let nav=document.querySelector('[data-subnav="garage"]');if(nav)nav.classList.toggle('is-collapsed',!!b);return}
  $('#detailPageEyebrow').textContent=svc?'Bengkel':'Garasi';
  $('#detailPageTitle').textContent=b?b.name:(svc?'Bengkel sepeda':'Garasi sepeda');
  $('#detailPageSubtitle').textContent=b?'Odometer, part, servis, dan ride sepeda ini — semuanya otomatis dari Strava.':(svc?'Pilih sepeda dulu untuk melihat jadwal servis dan riwayat bengkelnya.':'Pilih sepeda dulu. Km tiap sepeda dihitung otomatis dari ride Strava.');
}
function garageRender(opts){
  opts=opts||{};let body=renderHost();if(!body)return;
  if(GARAGE_UI.bikeId&&DATA.bikeGarage&&!bikeById(GARAGE_UI.bikeId))GARAGE_UI.bikeId='';
  let y=window.scrollY;
  garageSetHeader();body.innerHTML=garageHtml();body.onclick=garageClick;garageLoadPhotos(body);
  if(typeof proGarageAfterRender==='function')try{proGarageAfterRender(body)}catch(e){console.log(e)}
  let chip=body.querySelector('.gx-switch-chip.active');if(chip&&chip.scrollIntoView)try{chip.scrollIntoView({block:'nearest',inline:'center'})}catch(e){}
  window.scrollTo(0,opts.top?0:y);
}
function garageHtml(){
  if(!DATA.bikeGarage){
    if(GARAGE_UI.error)return `<article class="panel"><div class="insight"><b>Garasi gagal dimuat</b><p>${GARAGE_UI.error}</p></div><button type="button" class="btn primary gx-wide" data-gx-reload>Coba lagi</button></article>`;
    garageEnsureLoaded();return '<article class="panel">'+inlineSpinner('Memuat garasi…')+'</article>';
  }
  let b=GARAGE_UI.bikeId?bikeById(GARAGE_UI.bikeId):null;
  return b?garageBikeHtml(b):garagePickerHtml();
}
function garageOpenBike(id,tab){GARAGE_UI.bikeId=id;GARAGE_UI.tab=tab||(GARAGE_UI.entry==='service'?'service':'overview');GARAGE_UI.rideLimit=40;GARAGE_UI.rideFilter='all';garageRender({top:true})}
function garageBackToPicker(){GARAGE_UI.bikeId='';garageRender({top:true})}

function garageSyncHtml(){
  let G=garageState();
  if(!G.stravaConnected)return `<div class="gx-sync"><span class="gx-sync-ic">${gxIcon('i-sync')}</span><div class="gx-sync-text"><b>Strava belum terhubung</b><small>Hubungkan Strava agar km sepeda terhitung otomatis dari ride.</small></div></div>`;
  let sb=G.stravaBikes||[],unknown=sb.some(s=>s.source==='unknown');
  return `<div class="gx-sync"><span class="gx-sync-ic${GARAGE_UI.syncing?' spin':''}">${gxIcon('i-sync')}</span><div class="gx-sync-text"><b>${GARAGE_UI.syncing?'Menyinkronkan gear Strava…':'Auto-link ride Strava'}</b><small>${gxNum(G.trackedRides)} ride terlacak · sinkron ${gxAgo(G.gearSyncedAt)}${sb.length?' · '+sb.length+' sepeda di Strava':''}</small></div><button type="button" class="gx-pill" data-gx-sync ${GARAGE_UI.syncing?'disabled':''}>Sinkron</button></div>`
    +(unknown&&!G.stravaBikesFull?`<p class="gx-hint">Nama sepeda di Strava belum terbaca. Putuskan lalu hubungkan ulang Strava sekali (izin profil baru) agar nama & total km gear ikut tampil.</p>`:'');
}
function garagePickerHtml(){
  let G=garageState(),m=garageModel(),bikes=bikeGarage(),active=bikes.filter(b=>!b.retired),retired=bikes.filter(b=>b.retired),svc=GARAGE_UI.entry==='service';
  let linked={};bikes.forEach(b=>{if(b.gearId)linked[b.gearId]=true});
  let strNew=(G.stravaBikes||[]).filter(s=>!linked[s.id]&&!s.retired);
  if(!bikes.length){
    return `<article class="panel gx-empty"><div class="gx-empty-art">${garageBikeSvg('var(--ios-orange)')}</div><h3>Garasi masih kosong</h3><p class="muted">Tambahkan sepedamu. Km-nya langsung dihitung otomatis dari ride Strava, dan jadwal servis tiap part dipantau di Bengkel.</p><button type="button" class="btn primary gx-wide" data-gx-add>Tambah sepeda</button></article>`
      +(strNew.length?garageStravaImportHtml(strNew):'')
      +`<article class="panel">${garageSyncHtml()}</article>`;
  }
  let due=bikeServiceDue(),bad=due.filter(d=>d.level==='bad').length,warn=due.filter(d=>d.level==='warn').length;
  let totalKm=active.reduce((s,b)=>s+m.per[b.id].odo,0),cost=bikes.reduce((s,b)=>s+m.per[b.id].serviceCost,0);
  let head=`<div class="metric-grid">${metric('SEPEDA',String(active.length),retired.length?retired.length+' pensiun':'aktif di garasi')}${metric('TOTAL KM',gxKm(totalKm),'semua sepeda aktif')}${metric('SERVIS',bad?bad+' mendesak':warn?warn+' segera':'Aman',bad||warn?'buka sepeda terkait':'tidak ada yang lewat jadwal')}${metric('BIAYA BENGKEL',gxRpShort(cost),'total tercatat')}</div>`;
  let un=m.unassigned,unKm=un.reduce((s,r)=>s+r.km,0);

function garageClick(e){
  let t=e.target.closest('[data-gx-open],[data-gx-picker],[data-gx-add],[data-gx-import],[data-gx-sync],[data-gx-unassigned],[data-gx-tab],[data-gx-edit],[data-gx-default],[data-gx-service],[data-gx-service-part],[data-gx-part],[data-gx-add-part],[data-gx-hist],[data-gx-ride],[data-gx-ride-filter],[data-gx-more-rides],[data-gx-reload]');
  if(!t||!this.contains(t))return;
  let d=t.dataset,b=GARAGE_UI.bikeId?bikeById(GARAGE_UI.bikeId):null;
  if(d.gxOpen!==undefined)return garageOpenBike(d.gxOpen);
  if(d.gxPicker!==undefined)return garageBackToPicker();
  if(d.gxAdd!==undefined)return bikeForm(null);
  if(d.gxImport!==undefined){let s=stravaBikeById(d.gxImport);return bikeForm(null,s?{name:s.name,gearId:s.id}:null)}
  if(d.gxSync!==undefined)return garageRunGearSync(false);
  if(d.gxUnassigned!==undefined)return garageUnassignedSheet();
  if(d.gxReload!==undefined){GARAGE_UI.error='';return garageRender()}
  if(d.gxRideFilter!==undefined){GARAGE_UI.rideFilter=d.gxRideFilter;GARAGE_UI.rideLimit=40;return garageRender()}
  if(d.gxMoreRides!==undefined){GARAGE_UI.rideLimit+=60;return garageRender()}
  if(!b)return;
  if(d.gxTab!==undefined){GARAGE_UI.tab=d.gxTab;return garageRender()}
  if(d.gxEdit!==undefined)return bikeForm(b);
  if(d.gxDefault!==undefined)return garageCall('garageSetDefault',[b.id],{btn:t,msg:esc(b.name)+' jadi sepeda utama ✓',busy:'…'});
  if(d.gxServicePart!==undefined)return serviceForm(b.id,d.gxServicePart);
  if(d.gxService!==undefined)return serviceForm(b.id,'');
  if(d.gxPart!==undefined)return partForm(b.id,d.gxPart);
  if(d.gxAddPart!==undefined)return partForm(b.id,'');
  if(d.gxHist!==undefined)return historySheet(b.id,d.gxHist);
  if(d.gxRide!==undefined)return garageRideSheet(d.gxRide);
}

function garagePreviewOdo(bikeId,gearId,trackFrom,offset,makeDefault,includeIndoor){
  let m=garageModel(),G=garageState();if(!m)return null;
  let bikes=bikeGarage(),byGear={};bikes.forEach(x=>{if(x.gearId&&x.id!==bikeId)byGear[x.gearId]=x});if(gearId)byGear[gearId]={id:bikeId||'__new__'};
  let anyLinked=Object.keys(byGear).length>0,isDef=makeDefault||G.defaultBikeId===bikeId||!bikes.some(x=>!x.retired&&x.id!==bikeId),ov=G.overrides||{},km=0,n=0;
  m.rides.forEach(r=>{
    let o=ov[r.sid],mine=false;
    if(o===GARAGE_NONE)return;
    if(o&&bikeById(o))mine=o===bikeId;
    else if(r.gear&&byGear[r.gear])mine=!!gearId&&r.gear===gearId;
    else if(r.gear&&anyLinked)mine=false;
    else mine=isDef&&(includeIndoor||!/virtual/i.test(String(r.log.sportType||'')));
    if(mine&&(!trackFrom||r.date>=trackFrom)){km+=r.km;n++}
  });
  return {km:km+offset,n:n};
}

  let m=garageModel();if(!m)return;let un=m.unassigned,bikes=bikeGarage().filter(x=>!x.retired);
  let groups={};un.forEach(r=>{let k=r.how==='othergear'?'g:'+r.gear:r.how;(groups[k]=groups[k]||[]).push(r)});
  let linkable=bikes.filter(x=>!x.gearId);
  let blocks=Object.keys(groups).map(k=>{
    let list=groups[k],km=list.reduce((s,r)=>s+r.km,0),title,desc,actions='';
    if(k.indexOf('g:')===0){let gid=k.slice(2),sb=stravaBikeById(gid);title='Gear Strava: '+(sb?sb.name:gid);desc='Ride ini memakai gear Strava yang belum ditautkan ke sepeda garasi.';
      actions=`<div class="gx-unas-actions">${linkable.length?`<select class="gx-link-sel" data-gear="${esc(gid)}"><option value="">Tautkan ke sepeda…</option>${linkable.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select>`:''}<button type="button" class="gx-pill" data-new-gear="${esc(gid)}">+ Sepeda baru</button></div>`}
    else if(k==='indoor'){title='Ride indoor';desc='Ride virtual/trainer tidak otomatis masuk ke sepeda utama. Aktifkan "hitung ride indoor" di pengaturan sepeda, atau pindahkan manual di bawah.'}
    else {title='Belum ada sepeda utama';desc='Jadikan salah satu sepeda sebagai sepeda utama agar ride tanpa gear otomatis masuk.'}
    return `<div class="gx-unas"><b>${esc(title)}</b><small>${gxNum(list.length)} ride · ${gxKm(km)}</small><p>${esc(desc)}</p>${actions}</div>`;
  }).join('');
  let rows=un.slice(0,150).map(r=>`<label class="gx-unas-row"><input type="checkbox" value="${esc(r.sid)}"${r.sid?'':' disabled'}><span><b>${esc(r.log.title||'Ride')}</b><small>${esc(fmtDateShort(r.date))} · ${gxKm(r.km,1)} · ${esc(GARAGE_HOW[r.how]||'')}</small></span></label>`).join('');
  $('#detailBox').classList.remove('wide');
  $('#detailContent').innerHTML=`<div class="detail-box-inner"><span class="eyebrow">AUTO-LINK</span><h2>${gxNum(un.length)} ride tanpa sepeda</h2>${blocks}
    <div class="gx-section-title" style="margin-top:14px">Atau pindahkan manual</div>
    <div class="gx-unas-bar"><label class="gx-check"><input type="checkbox" id="gxuAll"> Pilih semua</label><select id="gxuBike">${bikes.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}<option value="${GARAGE_NONE}">Abaikan (bukan sepeda garasi)</option></select></div>
    <div class="gx-unas-list">${rows}</div>${un.length>150?`<p class="gx-hint">Menampilkan 150 ride terbaru dari ${gxNum(un.length)}.</p>`:''}
    <button type="button" class="btn primary gx-wide" id="gxuGo" style="margin-top:12px">Pindahkan ride terpilih</button></div>`;
  openModal();
  $('#gxuAll').onchange=e=>$$('#detailContent .gx-unas-row input:not([disabled])').forEach(c=>c.checked=e.target.checked);
  $$('#detailContent .gx-link-sel').forEach(sel=>sel.onchange=()=>{if(!sel.value)return;sel.disabled=true;garageCall('garageSaveBike',[{id:sel.value,gearId:sel.dataset.gear}],{close:true,msg:'Gear tertaut — ride otomatis masuk ✓'}).then(r=>{if(!r&&document.body.contains(sel))sel.disabled=false})});
  $$('#detailContent [data-new-gear]').forEach(el=>el.onclick=()=>{let s=stravaBikeById(el.dataset.newGear);bikeForm(null,{name:s?s.name:'',gearId:el.dataset.newGear})});
  $('#gxuGo').onclick=()=>{let ids=$$('#detailContent .gx-unas-row input:checked').map(c=>c.value).filter(Boolean);if(!ids.length){toast('Pilih minimal 1 ride');return}garageCall('garageAssignRides',[ids,gxVal('#gxuBike')],{btn:$('#gxuGo'),busy:'Memindahkan…',close:true,msg:ids.length+' ride dipindahkan ✓'})};
}

  let cfg=DETAIL_RENDERERS[key];if(!cfg)return;GARAGE_UI.active=false;let body=document.getElementById('detailPageBody');if(!body)return;body.onclick=null;
  if(currentPageView()==='detail'){if(CUR_DETAIL&&!opts.back&&CUR_DETAIL!==key)DETAIL_STACK.push({key:CUR_DETAIL,y:window.scrollY})}else{DETAIL_ORIGIN=currentPageView();DETAIL_STACK=[]}

  let ic=$('#detailPageIcon');if(ic){ic.className='acx-detail-ic icon tone-'+(meta?meta.t:'gray');ic.innerHTML='<svg><use href="#'+(meta?meta.i:'i-sparkles')+'"/></svg>'}

<script>
'use strict';

const PRO={loading:null,running:false,page:'',maps:{},progress:null,cache:{}};
const PRO_ACTIVITY_HOOKS=[];
const PRO_BIKE_MASS=9;

function proN(v,dec){return (Number(v)||0).toLocaleString('id-ID',{maximumFractionDigits:dec==null?0:dec,minimumFractionDigits:0})}
function proKm(v,dec){return proN(v,dec==null?1:dec)+' km'}
function proDur(sec){sec=Math.round(Number(sec)||0);let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+'j '+String(m).padStart(2,'0')+'m':m?m+' mnt'+(m<10&&s?' '+s+' dtk':''):s+' dtk'}

function proLogsDesc(){let n=(DATA.logs||[]).length;if(PRO.cache.__desc&&PRO.cache.__descN===n)return PRO.cache.__desc;PRO.cache.__descN=n;return PRO.cache.__desc=(DATA.logs||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
function proMinSec(sec){sec=Math.round(Number(sec)||0);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function proPct(v,dec){return (v>0?'+':'')+proN(v,dec==null?1:dec)+'%'}
function proIcon(id){return `<span class="icon"><svg><use href="#${id}"/></svg></span>`}
function proToday(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function proAddDays(s,n){let d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function proDaysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function proErr(e){return esc(String((e&&e.message)||e||'Terjadi kesalahan')).slice(0,180)}
function proSleep(ms){return new Promise(r=>setTimeout(r,ms))}
function proHav(a,b){let R=6371000,r=Math.PI/180,dLat=(b[0]-a[0])*r,dLng=(b[1]-a[1])*r,s=Math.sin(dLat/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(s)))}
function proMedian(arr){if(!arr.length)return 0;let s=arr.slice().sort((a,b)=>a-b),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
function proLinReg(xs,ys){let n=xs.length;if(n<2)return {a:0,b:0,r2:0};let mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n,sxy=0,sxx=0,syy=0;for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)**2;syy+=(ys[i]-my)**2}let b=sxx?sxy/sxx:0;return {a:my-b*mx,b:b,r2:sxx&&syy?(sxy*sxy)/(sxx*syy):0}}
function proWeightKg(){let m=DATA.metrics||{},p=DATA.profile||{};return Number(m.weightKg)||Number(p.weightKg)||65}

function proState(){return DATA.pro||null}
function proLoad(force){
  if(DATA.pro&&!force)return Promise.resolve(DATA.pro);
  if(PRO.loading)return PRO.loading;
  PRO.loading=gs('proGetState',currentAthleteId()).then(r=>{DATA.pro=r;PRO.cache={};return r}).catch(e=>{PRO.loadErr=proErr(e);throw e}).finally(()=>{PRO.loading=null});
  return PRO.loading;
}
function proInvalidate(){PRO.cache={}}
function proA(sid){let s=proState();let a=s&&s.analysis?s.analysis[String(sid)]:null;return a&&!a.err?a:null}

function proEntries(filter){
  let key='entries';if(!PRO.cache[key]){PRO.cache[key]=proLogsDesc().filter(x=>x.stravaId).map(x=>({log:x,a:proA(x.stravaId)})).filter(e=>e.a)}
  return filter?PRO.cache[key].filter(filter):PRO.cache[key];
}
function proStore(key,def){let s=proState();let v=s&&s.store?s.store[key]:undefined;return v===undefined||v===null?def:v}
async function proStoreSave(key,data,msg){
  try{let r=await gs('proStoreSet',key,data,currentAthleteId());if(!DATA.pro.store)DATA.pro.store={};DATA.pro.store[key]=r.data;proInvalidate();if(msg)toast(msg);return r.data}
  catch(e){toast('Gagal menyimpan: '+proErr(e));throw e}
}
async function proStoreRemove(key,msg){try{await gs('proStoreDelete',key,currentAthleteId());if(DATA.pro.store)delete DATA.pro.store[key];proInvalidate();if(msg)toast(msg)}catch(e){toast('Gagal menghapus: '+proErr(e))}}
function proRefreshPage(){
  if(!PRO.page)return;let cfg=DETAIL_RENDERERS[PRO.page];if(!cfg)return;let v=currentPageView(),host=renderHost();if(!host)return;
  if(v==='detail'){if(CUR_DETAIL&&CUR_DETAIL!==PRO.page)return}else if(host.dataset.mounted!==PRO.page)return;
  let y=window.scrollY;proDestroyMaps();host.innerHTML=cfg.render();if(cfg.after)cfg.after();window.scrollTo(0,y);
  if(v==='performance'&&typeof renderPerfAnalysis==='function')renderPerfAnalysis();
}

async function proRunAnalysis(){
  if(PRO.running)return;PRO.running=true;PRO.progress={done:0};proPaintProgress();
  try{
    await proLoad();
    for(let guard=0;guard<200;guard++){
      let r=await gs('proAnalyzeBatch',currentAthleteId(),12);
      if(r.busy){await proSleep(5000);continue}
      Object.assign(DATA.pro.analysis,r.entries||{});DATA.pro.pending=r.remaining;PRO.progress.done+=(r.done||0);proInvalidate();proPaintProgress();
      if(r.rateLimited){toast('Batas kuota Strava tercapai (100 permintaan/15 menit). Lanjutkan lagi ±15 menit, atau aktifkan analisis otomatis.');return}
      if(!r.remaining||!r.done)break;
    }
    toast(DATA.pro.pending?'Analisis berhenti sementara — ketuk lagi untuk melanjutkan':'Analisis selesai ✓');
  }catch(e){toast('Analisis terhenti: '+proErr(e)+'. Lanjutkan lagi nanti (batas kuota Strava).')}
  finally{PRO.running=false;PRO.progress=null;proRefreshPage();if(currentPageView()==='performance'&&typeof renderPerfAnalysis==='function')renderPerfAnalysis()}
}
function proPaintProgress(){
  let s=proState(),el=document.getElementById('proProgress');if(!el||!s)return;
  let total=s.total||0,done=Math.max(0,total-(s.pending||0)),pct=total?Math.round(done/total*100):0;
  el.innerHTML=proCoverageInner(s,pct,done,total);
  let b=el.querySelector('[data-pro-run]');if(b)b.onclick=()=>proRunAnalysis();
}
function proCoverageInner(s,pct,done,total){
  return `<div class="pro-cov-top"><div><b>${PRO.running?'Menganalisis aktivitas…':done>=total?'Semua aktivitas sudah dianalisis':'Analisis lanjutan'}</b><small>${proN(done)} dari ${proN(total)} aktivitas · ${pct}%</small></div>${done<total?`<button type="button" class="pro-pill" data-pro-run ${PRO.running?'disabled':''}>${PRO.running?'Berjalan…':'Analisis sekarang'}</button>`:''}</div><div class="pro-bar"><i style="width:${pct}%"></i></div>`;
}

function proCoverageBanner(){
  let s=proState();if(!s)return '';let total=s.total||0,done=Math.max(0,total-(s.pending||0));
  if(total&&done>=total&&!PRO.running)return '';
  let pct=total?Math.round(done/total*100):0;
  return `<article class="panel pro-cov" id="proProgress">${proCoverageInner(s,pct,done,total)}</article>`;
}
function proCacheCheck(){let n=(DATA.logs||[]).length+'|'+((DATA.logs||[])[0]||{}).id;if(PRO.cache.__n!==n)PRO.cache={__n:n}}
function proNeedState(render){
  if(DATA.pro){proCacheCheck();return render()}
  if(PRO.loadErr)return `<article class="panel"><div class="insight"><b>Data analisis gagal dimuat</b><p>${PRO.loadErr}</p></div><button type="button" class="btn primary pro-wide" data-pro-retry>Coba lagi</button></article>`;
  proLoad().then(proRefreshPage).catch(proRefreshPage);
  return '<article class="panel">'+inlineSpinner('Memuat analisis lanjutan…')+'</article>';
}
function proBindCommon(root){
  root=root||renderHost();if(!root)return;
  let run=root.querySelector('[data-pro-run]');if(run)run.onclick=()=>proRunAnalysis();
  let rt=root.querySelector('[data-pro-retry]');if(rt)rt.onclick=()=>{PRO.loadErr='';proRefreshPage()};
  root.querySelectorAll('[data-pro-open]').forEach(el=>el.onclick=()=>openDetailPage(el.dataset.proOpen));
  root.querySelectorAll('[data-pro-act]').forEach(el=>el.onclick=()=>showDetail(el.dataset.proAct));
  root.querySelectorAll('[data-pro-seg]').forEach(el=>el.onclick=()=>{let [k,v]=el.dataset.proSeg.split('=');PRO[k]=v;proRefreshPage()});
}
function proEmpty(title,text){return `<article class="panel"><div class="insight"><b>${esc(title)}</b><p>${text}</p></div></article>`}
function proSeg(key,opts,cur){return `<div class="seg pro-seg">${opts.map(o=>`<button type="button" class="seg-item${cur===o[0]?' active':''}" data-pro-seg="${key}=${o[0]}">${esc(o[1])}</button>`).join('')}</div>`}
function proStat(label,value,note,color){return `<div class="pro-stat"><small>${esc(label)}</small><b${color?` style="color:${color}"`:''}>${value}</b>${note?`<span>${note}</span>`:''}</div>`}
function proActRow(log,right,sub){return `<button type="button" class="glist-row" data-pro-act="${esc(log.id)}"><span class="glist-text"><b>${esc(log.title||'Aktivitas')}</b><small>${esc(fmtDate(log.date))}${sub?' · '+sub:''}</small></span>${right?`<span class="glist-value">${right}</span>`:''}<span class="glist-chev icon"><svg><use href="#i-chevron"/></svg></span></button>`}

function proDestroyMaps(){Object.keys(PRO.maps).forEach(k=>{try{PRO.maps[k].remove()}catch(e){}delete PRO.maps[k]})}

function proTemp(a){return a.wx&&a.wx.t!=null?a.wx.t:(a.tDev!=null?a.tDev:null)}
function proEF(a,sport){if(sport==='Cycling'&&a.efP)return {v:a.efP,unit:'NP/HR',kind:'power'};if(a.efS)return {v:a.efS,unit:sport==='Running'?'m/mnt per bpm':'km/j per 100 bpm',kind:'speed'};return null}

function proDurabilityModel(){
  if(PRO.cache.dura)return PRO.cache.dura;
  let since=proAddDays(proToday(),-90),rides=proEntries(e=>e.log.sport==='Cycling'&&e.log.date>=since);
  let buckets={b0:[0,0],b1000:[0,0],b2000:[0,0],b3000:[0,0]},src={};
  rides.forEach(e=>{let d=e.a.dura||{};Object.keys(buckets).forEach(k=>{if(!d[k])return;if(d[k][0]>buckets[k][0]){buckets[k][0]=d[k][0];src[k+'5']=e.log}if(d[k][1]>buckets[k][1]){buckets[k][1]=d[k][1];src[k+'20']=e.log}})});
  let hasPower=buckets.b0[1]>0;
  let ret=k=>buckets.b0[1]&&buckets[k][1]?buckets[k][1]/buckets.b0[1]*100:null;
  let hrRides=proEntries(e=>e.log.sport==='Cycling'&&e.a.durH&&e.a.durH.ret>0).slice(0,40);

  let byMonth={};proEntries(e=>e.log.sport==='Cycling'&&e.a.dura&&e.a.dura.b0).forEach(e=>{let m=e.log.date.slice(0,7),b=byMonth[m]||(byMonth[m]={f:0,t:0});b.f=Math.max(b.f,e.a.dura.b0[1]||0);if(e.a.dura.b2000)b.t=Math.max(b.t,e.a.dura.b2000[1]||0)});
  let trend=Object.keys(byMonth).sort().slice(-12).map(m=>({m:m,r:byMonth[m].f&&byMonth[m].t?byMonth[m].t/byMonth[m].f*100:null}));
  return PRO.cache.dura={buckets,src,hasPower,ret,hrRides,trend,count:rides.length};
}
function proDuraGrade(r){return r>=95?['Elite','var(--ios-green)']:r>=90?['Sangat baik','var(--ios-teal)']:r>=85?['Cukup','var(--ios-orange)']:['Perlu dilatih','var(--ios-red)']}
function proEFModel(sport){
  let k='ef'+sport;if(PRO.cache[k])return PRO.cache[k];
  let since=proAddDays(proToday(),-365);
  let pts=proEntries(e=>e.log.sport===sport&&e.log.date>=since&&e.a.steady).map(e=>{let ef=proEF(e.a,sport);return ef?{log:e.log,ef:ef.v,kind:ef.kind,unit:ef.unit,t:proTemp(e.a)}:null}).filter(Boolean);
  let kind=pts.filter(p=>p.kind==='power').length>=pts.length/2?'power':'speed';pts=pts.filter(p=>p.kind===kind).reverse();
  let withT=pts.filter(p=>p.t!=null),reg=withT.length>=8?proLinReg(withT.map(p=>p.t),withT.map(p=>p.ef)):null;
  let base=pts.length?proMedian(pts.map(p=>p.ef)):0;

  let slopePct=reg&&base&&reg.b<0&&reg.r2>0.05?reg.b/base*100:-0.9,own=!!(reg&&base&&reg.b<0&&reg.r2>0.05);
  pts.forEach(p=>{p.adj=p.t!=null&&p.t>22?p.ef/(1+slopePct/100*(p.t-22)):p.ef});
  let recent=pts.filter(p=>p.log.date>=proAddDays(proToday(),-42)).map(p=>p.adj),prev=pts.filter(p=>p.log.date<proAddDays(proToday(),-42)&&p.log.date>=proAddDays(proToday(),-84)).map(p=>p.adj);
  let change=recent.length>=2&&prev.length>=2?(proMedian(recent)/proMedian(prev)-1)*100:null;
  return PRO.cache[k]={pts,kind,unit:pts[0]?pts[0].unit:'',slopePct,own,change,base};
}

      <p class="pro-note">${r2!=null?(r2>=95?'Luar biasa: power-mu hampir tidak turun walau sudah 2.000 kJ. Ini ciri atlet endurance yang siap gran fondo/lomba panjang.':r2>=90?'Bagus. Untuk naik kelas, tambahkan blok tempo/sweet spot di jam ke-3 long ride.':'Power turun cukup banyak saat lelah. Latihan paling efektif: long ride 3–4 jam dengan 2×20 menit tempo di jam terakhir + fueling 60–90 g karbo/jam.'):'Lakukan ride > 2.000 kJ (±3 jam) dengan beberapa usaha keras di akhir untuk mengukur durability.'}</p></article>`;
    }

    }

    html+=`<article class="panel"><div class="panel-head"><div><span class="eyebrow">EFFICIENCY FACTOR · KOREKSI SUHU</span><h3>${E.change!=null?'Kebugaran aerobik '+proPct(E.change)+' (6 minggu)':'Tren efisiensi aerobik'}</h3><small class="muted">${E.kind==='power'?'Normalized Power ÷ HR':'Kecepatan di medan datar ÷ HR'} pada sesi Z1–Z2 stabil ≥ 40 menit.</small></div></div>

      <div class="pro-stats">${proStat('Koreksi suhu',proN(E.slopePct,1)+'%/°C',E.own?'dari datamu sendiri':'estimasi literatur')}${proStat('Sesi stabil',proN(E.pts.length),'12 bulan')}${proStat('EF median',proN(E.base,2),esc(E.unit))}</div>

    </article>`;
    return html;
  });
}

function proClimbClusters(){
  if(PRO.cache.climbs)return PRO.cache.climbs;
  let list=[];proEntries(e=>(e.a.climbs||[]).length).slice().reverse().forEach(e=>{(e.a.climbs||[]).forEach(c=>{if(c.a&&c.b)list.push({c:c,log:e.log,sport:e.log.sport})})});
  let clusters=[];
  list.forEach(it=>{let hit=clusters.find(cl=>cl.sport===it.sport&&proHav(cl.a,it.c.a)<220&&proHav(cl.b,it.c.b)<220);
    if(!hit){hit={key:it.c.a[0].toFixed(3)+','+it.c.a[1].toFixed(3)+'|'+it.c.b[0].toFixed(3)+','+it.c.b[1].toFixed(3),a:it.c.a,b:it.c.b,sport:it.sport,tries:[]};clusters.push(hit)}
    hit.tries.push(it)});
  let names=proStore('climbNames',{})||{};
  clusters.forEach(cl=>{let t=cl.tries;cl.len=proMedian(t.map(x=>x.c.d));cl.gain=proMedian(t.map(x=>x.c.g));cl.grade=cl.len?cl.gain/cl.len*100:0;cl.best=t.reduce((a,b)=>b.c.s<a.c.s?b:a);cl.last=t[t.length-1];cl.cat=cl.best.c.cat||'';cl.name=names[cl.key]||'';
    cl.label=cl.name||(`Tanjakan ${proKm(cl.len/1000,1)} · ${proN(cl.grade,1)}%`);
    cl.trend=t.length>=3?(t[t.length-1].c.s-proMedian(t.slice(0,-1).map(x=>x.c.s)))/proMedian(t.slice(0,-1).map(x=>x.c.s))*100:null});
  clusters.sort((a,b)=>b.tries.length-a.tries.length||b.gain-a.gain);
  return PRO.cache.climbs=clusters;
}

function proClimbTime(P,mass,L,grade){let rho=1.16,cda=0.36,crr=0.005,gA=9.81,f=v=>0.5*rho*cda*v*v*v+crr*mass*gA*v+mass*gA*v*grade-P,lo=0.3,hi=20;for(let i=0;i<40;i++){let m=(lo+hi)/2;if(f(m)>0)hi=m;else lo=m}return L/((lo+hi)/2)}
function proPowerForTime(sec,mass,L,grade){let v=L/sec,rho=1.16,cda=0.36,crr=0.005,gA=9.81;return 0.5*rho*cda*v*v*v+crr*mass*gA*v+mass*gA*v*grade}

function proRunFormModel(){

  let rows=proEntries(e=>e.log.sport==='Running'&&e.a.run).slice(0,80).reverse();
  let allBins={};rows.slice(-20).forEach(e=>(e.a.run.bins||[]).forEach(b=>{let k=b[0],x=allBins[k]||(allBins[k]={spm:0,st:0,w:0});x.spm+=b[1]*b[3];x.st+=b[2]*b[3];x.w+=b[3]}));
  let bins=Object.keys(allBins).map(Number).sort((a,b)=>a-b).filter(k=>allBins[k].w>=120&&k>=6&&k<=25).map(k=>({v:k,spm:allBins[k].spm/allBins[k].w,st:allBins[k].st/allBins[k].w}));
  let flags=[];
  if(bins.length>=3){let reg=proLinReg(bins.map(b=>b.v),bins.map(b=>b.spm)),regS=proLinReg(bins.map(b=>b.v),bins.map(b=>b.st)),fast=bins[bins.length-1];
    if(reg.b<0.6&&regS.b>0.04&&fast.spm<170)flags.push(['Overstriding saat kencang','Saat pace naik, cadence hampir tidak ikut naik ('+proN(reg.b,1)+' spm per km/j) — kecepatan didapat dari langkah makin panjang. Ini menaikkan beban lutut & rem di tiap pijakan.']);
    else flags.push(['Pola sehat','Cadence ikut naik saat kecepatan naik ('+proN(reg.b,1)+' spm per km/j).']);}
  let last=rows[rows.length-1];if(last&&last.a.run.spm<160)flags.push(['Cadence rendah','Cadence rata-rata '+last.a.run.spm+' spm. Target bertahap +5% (±'+Math.round(last.a.run.spm*1.05)+' spm) biasanya mengurangi beban sendi.']);
  return PRO.cache.runform={rows,bins,flags};
}
function proRunFormRender(){
  PRO.page='runform';

    let M=proRunFormModel(),html=proCoverageBanner();
    if(!M.rows.length)return html+proEmpty('Belum ada data form lari','Butuh lari dengan data cadence (jam/HP yang merekam langkah) yang sudah dianalisis.');
    let last=M.rows[M.rows.length-1].a.run;
    html+=`<article class="panel"><div class="panel-head"><div><span class="eyebrow">FORM LARI</span><h3>${last.spm} spm · langkah ${proN(last.st,2)} m</h3><small class="muted">Lari terakhir. Panjang langkah = kecepatan ÷ cadence.</small></div></div>
      <div class="chart-wrap" id="proRunTrendWrap"></div></article>`;

}

<script>
'use strict';

const PRO_ZONE_COLORS=['#7e8b99','#34c759','#e5a13d','#ff3b30','#8b5cf6'];
const PRO_PZONE_COLORS=['#7e8b99','#30b0c7','#34c759','#ffcc00','#ff9500','#ff3b30','#af52de'];

const PRO_MAP_METRICS=[['hr','Zona HR'],['speed','Kecepatan'],['power','Power'],['grade','Tanjakan'],['alt','Elevasi']];
function proTrack(st,maxPts){
  let g=k=>(st[k]&&st[k].data)||[],t=g('time'),ll=g('latlng'),n=t.length;if(n<10||ll.length!==n)return null;
  let step=Math.max(1,Math.ceil(n/(maxPts||1500))),o={t:[],ll:[],d:[],alt:[],v:[],hr:[],w:[],gr:[],cad:[]},d=g('distance'),alt=g('altitude'),v=g('velocity_smooth'),hr=g('heartrate'),w=g('watts'),gr=g('grade_smooth'),cad=g('cadence');
  for(let i=0;i<n;i+=step){o.t.push(t[i]);o.ll.push(ll[i]);o.d.push(d.length===n?d[i]:0);o.alt.push(alt.length===n?alt[i]:null);o.v.push(v.length===n?v[i]*3.6:null);o.hr.push(hr.length===n?hr[i]:null);o.w.push(w.length===n?w[i]:null);o.gr.push(gr.length===n?gr[i]:null);o.cad.push(cad.length===n?cad[i]:null)}
  if(o.t[o.t.length-1]!==t[n-1]){o.t.push(t[n-1]);o.ll.push(ll[n-1]);o.d.push(d.length===n?d[n-1]:0);o.alt.push(alt.length===n?alt[n-1]:null);o.v.push(v.length===n?v[n-1]*3.6:null);o.hr.push(hr.length===n?hr[n-1]:null);o.w.push(w.length===n?w[n-1]:null);o.gr.push(gr.length===n?gr[n-1]:null);o.cad.push(cad.length===n?cad[n-1]:null)}
  o.n=o.t.length;o.has={hr:o.hr.some(x=>x>40),power:o.w.filter(x=>x>0).length>o.n*.3,grade:o.gr.some(x=>x!=null),alt:o.alt.some(x=>x!=null),speed:o.v.some(x=>x!=null)};
  return o;
}
function proMetricColor(tr,metric,i){
  if(metric==='hr'){let v=tr.hr[i],zs=(DATA.hrZones||[]).map(z=>Number(z.low));if(!(v>40)||!zs.length)return '#8e8e93';let k=0;zs.forEach((z,j)=>{if(v>=z)k=j});return PRO_ZONE_COLORS[Math.min(4,k)]}
  if(metric==='power'){let v=tr.w[i],ftp=Number((DATA.metrics||{}).ftp)||200;if(v==null)return '#8e8e93';let p=v/ftp*100,k=p<55?0:p<76?1:p<91?2:p<106?3:p<121?4:p<151?5:6;return PRO_PZONE_COLORS[k]}
  if(metric==='grade'){let g=tr.gr[i];if(g==null)return '#8e8e93';return g<-2?'#0a84ff':g<2?'#34c759':g<5?'#ffcc00':g<8?'#ff9500':g<12?'#ff3b30':'#8b0000'}
  let arr=metric==='alt'?tr.alt:tr.v,v=arr[i];if(v==null)return '#8e8e93';
  let lo=tr['lo_'+metric],hi=tr['hi_'+metric];if(lo==null){let s=arr.filter(x=>x!=null).sort((a,b)=>a-b);lo=tr['lo_'+metric]=s[Math.floor(s.length*.05)]||0;hi=tr['hi_'+metric]=s[Math.floor(s.length*.95)]||1}
  let f=Math.max(0,Math.min(1,(v-lo)/((hi-lo)||1)));return `hsl(${Math.round(220-220*f)},85%,50%)`;
}
function proLegend(metric){
  if(metric==='hr')return (DATA.hrZones||[]).map((z,i)=>`<span><i style="background:${PRO_ZONE_COLORS[Math.min(4,i)]}"></i>${esc(z.zone)}</span>`).join('');
  if(metric==='power')return ['Z1','Z2','Z3','Z4','Z5','Z6','Z7'].map((z,i)=>`<span><i style="background:${PRO_PZONE_COLORS[i]}"></i>${z}</span>`).join('');
  if(metric==='grade')return [['#0a84ff','Turun'],['#34c759','< 2%'],['#ffcc00','2–5%'],['#ff9500','5–8%'],['#ff3b30','8–12%'],['#8b0000','> 12%']].map(x=>`<span><i style="background:${x[0]}"></i>${x[1]}</span>`).join('');
  return `<span><i style="background:hsl(220,85%,50%)"></i>rendah</span><span class="pro-grad"></span><span><i style="background:hsl(0,85%,50%)"></i>tinggi</span>`;
}
PRO_ACTIVITY_HOOKS.push(function proInteractiveMap(x,d){
  if(!d||!d.streams||(DATA.privacy&&DATA.privacy.hideRoutes))return;
  let tr=proTrack(d.streams,1500);if(!tr)return;
  let anchor=document.getElementById('detailCharts');if(!anchor)return;
  let metrics=PRO_MAP_METRICS.filter(m=>tr.has[m[0]]);if(!metrics.length)return;
  let state={metric:metrics[0][0],idx:0,playing:false,speed:60,layers:[],marker:null,raf:0};
  anchor.insertAdjacentHTML('beforebegin',`<div class="detail-section pro-imap" id="proImap"><span class="eyebrow">PETA INTERAKTIF</span>
    <div class="pro-chips pro-metric-chips">${metrics.map(m=>`<button type="button" data-imap-metric="${m[0]}" class="${m[0]===state.metric?'active':''}">${m[1]}</button>`).join('')}</div>
    <div class="pro-legend" id="proImapLegend"></div>
    <div class="pro-readout" id="proImapRead"></div>
    <canvas class="pro-scrub" id="proImapScrub" height="120"></canvas>
    <div class="pro-imap-ctrl"><button type="button" class="pro-pill" id="proImapPlay">▶ Replay</button><select id="proImapSpeed"><option value="30">30×</option><option value="60" selected>60×</option><option value="120">120×</option><option value="300">300×</option></select><button type="button" class="pro-pill" id="proImap3d"><span class="icon ic-inline"><svg><use href="#i-mountain"/></svg></span> Flyover 3D</button><button type="button" class="pro-pill" id="proImapGhost"><span class="icon ic-inline"><svg><use href="#i-ghost"/></svg></span> Ghost</button></div>
    <p class="pro-note">Geser jari di grafik untuk menggerakkan titik di peta, atau ketuk rute di peta.</p></div>`);
  let canvas=$('#proImapScrub'),ctx=canvas.getContext('2d');
  let map=()=>typeof detailMap!=='undefined'?detailMap:null;
  let paintRoute=()=>{
    let m=map();if(!m||!window.L)return;state.layers.forEach(l=>{try{m.removeLayer(l)}catch(e){}});state.layers=[];

function proRouteSimilar(a,b){
  if(a.sport!==b.sport||!a.polyline||!b.polyline)return null;
  if(Math.abs(a.distance-b.distance)>Math.max(1,a.distance*.15))return null;
  let pa=decodePolyline(a.polyline),pb=decodePolyline(b.polyline);if(pa.length<2||pb.length<2)return null;
  if(proHav(pa[0],pb[0])>400||proHav(pa[pa.length-1],pb[pb.length-1])>400)return null;
  let step=Math.max(1,Math.floor(pa.length/25)),sum=0,c=0;
  for(let i=0;i<pa.length;i+=step){let md=1e9;for(let j=0;j<pb.length;j++){let d=proHav(pa[i],pb[j]);if(d<md)md=d}sum+=md;c++}
  let avg=sum/c;return avg<200?avg:null;
}

function proTileOf(lat,lng,z){let n=2**z,x=Math.floor((lng+180)/360*n),r=lat*Math.PI/180,y=Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n);return [x,y]}

function proExplorerModel(z,sport){

  logs.forEach(x=>{let p=decodePolyline(x.polyline);if(p.length<2)return;let st=proTileOf(p[0][0],p[0][1],z).join('_');starts[st]=(starts[st]||0)+1;
    for(let i=1;i<p.length;i++){let a=p[i-1],b=p[i],dd=proHav(a,b),steps=Math.max(1,Math.ceil(dd/(z>=16?60:150)));for(let s=0;s<=steps;s++){let f=s/steps,t=proTileOf(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,z).join('_');if(!tiles[t])tiles[t]=x.date}}});

  let nearest=[];if(home){let [hx,hy]=home.split('_').map(Number);nearest=Object.keys(frontier).map(k=>{let [x,y]=k.split('_').map(Number);return {k:k,x:x,y:y,d:Math.hypot(x-hx,y-hy)}}).sort((a,b)=>a.d-b.d).slice(0,5)}

function proRouteSegments(pts){
  if(pts.length<2)return null;let d=[0];for(let i=1;i<pts.length;i++)d.push(d[i-1]+proHav(pts[i-1],pts[i]));
  let total=d[d.length-1],hasEle=pts.some(p=>p[2]!=null),segs=[],j=0,step=200;
  let at=x=>{while(j<pts.length-2&&d[j+1]<x)j++;let f=d[j+1]>d[j]?(x-d[j])/(d[j+1]-d[j]):0;return [pts[j][0]+(pts[j+1][0]-pts[j][0])*f,pts[j][1]+(pts[j+1][1]-pts[j][1])*f,hasEle?(pts[j][2]||0)+(((pts[j+1][2]||0)-(pts[j][2]||0))*f):0]};
  let prev=at(0);for(let x=step;x<total+step;x+=step){let xx=Math.min(total,x),p=at(xx),len=xx-(x-step);if(len<20)break;segs.push({from:x-step,len:len,ele:p[2],grade:hasEle?(p[2]-prev[2])/len:0,brg:(Math.atan2((p[1]-prev[1])*Math.cos(prev[0]*Math.PI/180),p[0]-prev[0])*180/Math.PI+360)%360,ll:[p[0],p[1]]});prev=p}

  segs.forEach((s,i)=>{let a=segs.slice(Math.max(0,i-1),i+2);s.g=Math.max(-0.2,Math.min(0.2,a.reduce((t,x)=>t+x.grade*x.len,0)/a.reduce((t,x)=>t+x.len,0)))});
  return {segs:segs,total:total,gain:segs.reduce((t,s)=>t+Math.max(0,s.grade*s.len),0),hasEle:hasEle,mid:segs[Math.floor(segs.length/2)].ll,start:[pts[0][0],pts[0][1]]};

function proSimulate(route,o){
  let rho=1.16,g=9.81,m=o.mass,cda=o.cda,crr=o.crr,eff=0.975;

  let run=Pavg=>{let t=0,res=[],eSum=0,e4=0;route.segs.forEach(s=>{let hour=o.startHour!=null?Math.floor(o.startHour+t/3600):null,head=0;
      if(o.wind&&hour!=null){let w=o.wind(hour);if(w)head=w.ws/3.6*0.72*Math.cos((w.wd-s.brg)*Math.PI/180)}
      let f=s.g>0.01?Math.min(1.18,1+s.g*3.2):s.g<-0.02?Math.max(0.35,1+s.g*9):1;if(head>1.5)f=Math.min(1.2,f+0.05);

      let dt=s.len/v;t+=dt;eSum+=P*dt;e4+=Math.pow(P,4)*dt;res.push({s:s,P:P,v:v,dt:dt,head:head,t:t})});

  let out=run(o.power);out.power=o.power;return out;
}

async function proPacerRun(mode,silent){

  let sim=proSimulate(route,{mass:P.mass,cda:Number(P.cda),crr:Number(P.crr),power:P.power,targetSec:targetSec,startHour:startHour,wind:wind});

  let carbs=hours<1?20:hours<2?45:hours<3?65:IF>0.75?90:80,T=temp!=null?temp:29,fluid=Math.min(1000,Math.max(400,500+Math.round((T-20)*30))),sodium=T>=28?'700–1.000':'500–700';

  let res=sim.res,parts=[],cur=null;res.forEach(r=>{let cls=r.s.g>0.03?'up':r.s.g<-0.03?'down':'flat';if(!cur||(cur.cls!==cls&&cur.len>=1200)||cur.len>=Math.max(4000,route.total/10)){cur={cls:cls,from:r.s.from,len:0,t:0,e:0,gain:0,head:0,rs:[]};parts.push(cur)}cur.len+=r.s.len;cur.t+=r.dt;cur.e+=r.P*r.dt;cur.gain+=r.s.g*r.s.len;cur.head+=r.head*r.dt;cur.rs.push(r)});

function proParseWork(steps){
  for(let s of steps||[]){let t=String(s.target||''),m=t.match(/(\d+)\s*(?:-\s*(\d+))?\s*x\s*(\d+)\s*(?:-\s*(\d+))?\s*(menit|dtk|detik)/i),z=t.match(/Z([1-5])/);

}
function proPowerZone(pct){return pct<55?1:pct<76?2:pct<91?3:pct<106?4:pct<121?5:pct<151?6:7}

<script>

  return {cfg:c,ready:true,trips:trips,byMonth:byMonth,km:km,save:save,co2:km*co2,per:per,co2k:co2};
}
function proCommuteRender(){
  PRO.page='commute';
  return proNeedState(()=>{
    let M=proCommuteModel(),c=M.cfg,ep=proEndpointClusters(),html='';
    if(M.ready){let mk=proToday().slice(0,7),cur=M.byMonth[mk]||{n:0,km:0},curSave=cur.km*M.per+(c.mode==='mobil'?cur.n*(Number(c.parking)||0):0);

        <div class="pro-stats">${proStat('Total hemat',gxRpShort(M.save),'sepanjang riwayat')}${proStat('Perjalanan',proN(M.trips.length),proKm(M.km,0))}${proStat('CO₂',proN(M.co2,0)+' kg','≈ '+proN(M.co2/21,1)+' pohon/tahun')}</div>
        <div class="chart-wrap" id="proCommuteWrap" style="margin-top:12px"></div></article>
        ${M.trips.length?`<div class="group-list">${M.trips.slice(0,12).map(t=>proActRow(t.log,fmtRp(t.log.distance*M.per),t.dir+' · '+proKm(t.log.distance))).join('')}</div>`:''}`}
    else html+=`<article class="panel gx-empty"><h3>Atur titik rumah & kantor</h3><p class="muted">Ride/lari yang berawal di satu titik dan berakhir di titik lainnya dihitung sebagai commute — lengkap dengan penghematan bensin/ongkos dan CO₂.</p></article>`;
    html+=`<article class="panel"><div class="panel-head"><div><span class="eyebrow">PENGATURAN</span></div></div><div class="settings-form gx-form">
      <label>Titik rumah<select id="cmHome"><option value="">— pilih —</option>${ep.map((e,i)=>`<option value="${i}"${c.home&&proHav([c.home.lat,c.home.lng],[e.lat,e.lng])<300?' selected':''}>Titik ${i+1} · ${e.n}× awal/akhir aktivitas (${e.lat.toFixed(3)}, ${e.lng.toFixed(3)})</option>`).join('')}</select></label>
      <label>Titik kantor/kampus<select id="cmWork"><option value="">— pilih —</option>${ep.map((e,i)=>`<option value="${i}"${c.work&&proHav([c.work.lat,c.work.lng],[e.lat,e.lng])<300?' selected':''}>Titik ${i+1} · ${e.n}× (${e.lat.toFixed(3)}, ${e.lng.toFixed(3)})</option>`).join('')}</select></label>
      <div class="pro-map sm" id="proCmMap"></div>
      <label>Biasanya pakai<select id="cmMode"><option value="motor"${c.mode==='motor'?' selected':''}>Motor</option><option value="mobil"${c.mode==='mobil'?' selected':''}>Mobil</option><option value="ojol"${c.mode==='ojol'?' selected':''}>Ojek online</option></select></label>
      <div class="zone-inputs"><label>Harga BBM (Rp/L)<input id="cmFuel" inputmode="numeric" value="${c.fuel}"></label><label>Konsumsi (km/L)<input id="cmKmpl" inputmode="numeric" value="${c.kmpl}"></label></div>
      <div class="zone-inputs"><label>Parkir/trip (mobil)<input id="cmPark" inputmode="numeric" value="${c.parking}"></label><label>Tarif ojol (Rp/km)<input id="cmFare" inputmode="numeric" value="${c.fare}"></label></div>
      <button type="button" class="btn primary gx-wide" id="cmSave">Simpan pengaturan</button></div></article>`;
    return html;
  });
}
function proCommuteAfter(){
  proBindCommon();let M=proCommuteModel(),ep=proEndpointClusters();
  if(M.ready&&document.getElementById('proCommuteWrap')){let ks=Object.keys(M.byMonth).sort().slice(-12);renderChart('proCommuteWrap','proCommuteChart','bar',{labels:ks.map(k=>new Date(k+'-01T00:00:00').toLocaleDateString('id-ID',{month:'short'})),datasets:[{label:'Hemat (Rp)',data:ks.map(k=>Math.round(M.byMonth[k].km*M.per)),backgroundColor:COLOR.green}]},{plugins:{legend:{display:false}}})}
  setTimeout(()=>{let m=proMap('proCmMap',{zoomControl:false});if(!m||!ep.length)return;ep.forEach((e,i)=>L.marker([e.lat,e.lng],{icon:L.divIcon({className:'pro-ghost-mk',html:`<span style="background:#5856d6">${i+1}</span>`,iconSize:[24,24],iconAnchor:[12,12]})}).addTo(m));m.fitBounds(L.latLngBounds(ep.map(e=>[e.lat,e.lng])).pad(.3))},40);
  let sv=$('#cmSave');if(sv)sv.onclick=async()=>{let h=$('#cmHome').value,w=$('#cmWork').value;if(h===''||w===''||h===w){toast('Pilih titik rumah dan kantor yang berbeda');return}
    let data={home:{lat:ep[h].lat,lng:ep[h].lng},work:{lat:ep[w].lat,lng:ep[w].lng},radius:350,mode:$('#cmMode').value,fuel:Number($('#cmFuel').value)||10000,kmpl:Number($('#cmKmpl').value)||40,parking:Number($('#cmPark').value)||0,fare:Number($('#cmFare').value)||3000};

const PRO_LIFE_TYPES=[['sakit','Sakit','#ff3b30'],['cedera','Cedera','#ff9500'],['liburan','Liburan','#30b0c7'],['sibuk','Sibuk kerja/kuliah','#8e8e93'],['lain','Lainnya','#af52de']];
function proLoadHistory(){
  let key='hist';if(PRO.cache[key])return PRO.cache[key];
  let logs=(DATA.logs||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));if(!logs.length)return PRO.cache[key]={days:[],logs:[]};
  let ftp=Number((DATA.metrics||{}).ftp)||0,zones=DATA.hrZones||[],lt=zones[3]?Number(zones[3].low):165,rest=Number((DATA.metrics||{}).hrRest)||60,load={};
  logs.forEach(x=>{let h=x.minutes/60,tss=0;if(x.avgPower&&ftp){let IF=x.avgPower*1.05/ftp;tss=h*IF*IF*100}else if(x.avgHr){let r=Math.max(0.3,Math.min(1.2,(x.avgHr-rest)/Math.max(20,lt-rest)));tss=h*r*r*100}else tss=h*45;load[x.date]=(load[x.date]||0)+Math.min(400,tss)});
  let d=logs[0].date,end=proToday(),ctl=0,days=[];while(d<=end){ctl=ctl+((load[d]||0)-ctl)/42;days.push({d:d,ctl:ctl});d=proAddDays(d,1)}
  return PRO.cache[key]={days:days,logs:logs};
}
function proMilestones(){
  let H=proLoadHistory(),logs=H.logs,out=[];if(!logs.length)return out;
  out.push({date:logs[0].date,icon:'i-flag',title:'Aktivitas pertama',sub:logs[0].title,log:logs[0]});
  [[50,'i-bike'],[100,'i-star'],[150,'i-flame'],[200,'i-trophy']].forEach(([km,ic])=>{let f=logs.find(x=>x.sport==='Cycling'&&x.distance>=km);if(f)out.push({date:f.date,icon:ic,title:`Ride ${km} km pertama`,sub:f.title+' · '+proKm(f.distance),log:f})});
  [[5,'5K'],[10,'10K'],[21.1,'Half marathon'],[42.2,'Marathon']].forEach(([km,lab])=>{let f=logs.find(x=>x.sport==='Running'&&x.distance>=km*0.98);if(f)out.push({date:f.date,icon:'i-shoe',title:`${lab} pertama`,sub:f.title+' · '+duration(f.minutes),log:f})});
  let cum=0,marks=[1000,2500,5000,10000,25000,50000],mi=0;logs.forEach(x=>{cum+=x.distance;while(mi<marks.length&&cum>=marks[mi]){out.push({date:x.date,icon:'i-road',title:`Total ${proN(marks[mi])} km`,sub:'akumulasi semua aktivitas'});mi++}});
  let best20=0;proEntries(e=>e.a.mmp&&e.a.mmp[1200]).slice().reverse().forEach(e=>{let v=e.a.mmp[1200];if(v>best20*1.02&&v>100){if(best20)out.push({date:e.log.date,icon:'i-bolt',title:`Rekor power 20 menit: ${v} W`,sub:'naik '+proN((v/best20-1)*100,0)+'%',log:e.log});best20=Math.max(best20,v)}});
  (typeof bikeGarage==='function'?bikeGarage():[]).forEach(b=>{let d=b.purchaseDate||(b.createdAt?new Date(b.createdAt).toISOString().slice(0,10):'');if(d)out.push({date:d,icon:'i-bike',title:'Sepeda baru: '+b.name,sub:[b.brand,b.model].filter(Boolean).join(' ')})});
  (proStore('events',[])||[]).filter(e=>e.done||e.date<proToday()).forEach(e=>out.push({date:e.date,icon:'i-medal',title:e.name,sub:e.result?'hasil '+e.result:'event selesai'}));
  (proStore('lifeNotes',[])||[]).forEach(n=>{let t=PRO_LIFE_TYPES.find(x=>x[0]===n.type)||PRO_LIFE_TYPES[4];out.push({date:n.from,icon:'i-edit',title:t[1]+(n.note?': '+n.note:''),sub:n.to&&n.to!==n.from?'sampai '+fmtDate(n.to):'',note:n})});
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
function proTimelineRender(){
  PRO.page='timeline';
  return proNeedState(()=>{
    let H=proLoadHistory();if(!H.logs.length)return proEmpty('Belum ada riwayat','Sinkronkan Strava untuk melihat perjalanan latihanmu.');
    let M=proMilestones(),years={};M.forEach(m=>{(years[m.date.slice(0,4)]=years[m.date.slice(0,4)]||[]).push(m)});
    let first=H.logs[0].date,total=H.logs.reduce((s,x)=>s+x.distance,0),hours=H.logs.reduce((s,x)=>s+x.minutes,0)/60;
    return `<article class="panel"><div class="panel-head"><div><span class="eyebrow">PERJALANAN SEJAK ${esc(fmtDate(first)).toUpperCase()}</span><h3>${proKm(total,0)} · ${proN(hours)} jam</h3><small class="muted">Garis = fitness (CTL); area berwarna = catatan hidup (sakit, cedera, liburan…).</small></div><button type="button" class="gx-pill" data-life-add>+ Catatan</button></div>
      <div class="chart-wrap tall" id="proTlWrap"></div><div class="pro-legend">${PRO_LIFE_TYPES.map(t=>`<span><i style="background:${t[2]}"></i>${t[1]}</span>`).join('')}</div></article>
      ${Object.keys(years).sort().reverse().map(y=>`<div class="gx-section-title">${y}</div><div class="pro-tl">${years[y].map((m,i)=>`<button type="button" class="pro-tl-item"${m.log?` data-pro-act="${esc(m.log.id)}"`:m.note?` data-life-edit="${esc(m.note.id)}"`:''}><span class="pro-tl-ic">${/^i-/.test(m.icon)?proIcon(m.icon):m.icon}</span><span class="pro-tl-body"><b>${esc(m.title)}</b><small>${esc(fmtDate(m.date))}${m.sub?' · '+esc(m.sub):''}</small></span></button>`).join('')}</div>`).join('')}`;
  });
}
function proTimelineAfter(){
  proBindCommon();let H=proLoadHistory();if(!H.days.length||!document.getElementById('proTlWrap'))return;
  let step=Math.max(1,Math.ceil(H.days.length/300)),pts=H.days.filter((_,i)=>i%step===0||i===H.days.length-1),notes=proStore('lifeNotes',[])||[];
  let band={id:'proBands',beforeDatasetsDraw(chart){let {ctx,chartArea,scales}=chart;if(!chartArea)return;notes.forEach(n=>{let t=PRO_LIFE_TYPES.find(x=>x[0]===n.type)||PRO_LIFE_TYPES[4],i0=pts.findIndex(p=>p.d>=n.from),i1=pts.findIndex(p=>p.d>(n.to||n.from));if(i0<0)return;if(i1<0)i1=pts.length-1;let x0=scales.x.getPixelForValue(i0),x1=Math.max(x0+3,scales.x.getPixelForValue(i1));ctx.save();ctx.fillStyle=t[2]+'33';ctx.fillRect(x0,chartArea.top,x1-x0,chartArea.bottom-chartArea.top);ctx.restore()})}};
  let el=document.getElementById('proTlWrap');el.innerHTML='<canvas id="proTlChart"></canvas>';if(CHARTS.proTlChart){CHARTS.proTlChart.destroy();delete CHARTS.proTlChart}
  CHARTS.proTlChart=new Chart(document.getElementById('proTlChart').getContext('2d'),{type:'line',data:{labels:pts.map(p=>p.d),datasets:[{label:'Fitness (CTL)',data:pts.map(p=>+p.ctl.toFixed(1)),borderColor:COLOR.blue,backgroundColor:healthAreaGradient(COLOR.blue),fill:true,tension:.3,pointRadius:0}]},options:deepMerge(healthChartDefaults(),{plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:6,callback:function(v){let d=pts[v]&&pts[v].d,long=pts.length>=2&&proDaysBetween(pts[0].d,pts[pts.length-1].d)>300;return d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',long?{month:'short',year:'2-digit'}:{day:'numeric',month:'short'}):''}}}}}),plugins:[band]});
  let root=renderHost();root.querySelectorAll('[data-life-add]').forEach(b=>b.onclick=()=>proLifeForm(null));root.querySelectorAll('[data-life-edit]').forEach(b=>b.onclick=()=>proLifeForm((proStore('lifeNotes',[])||[]).find(n=>n.id===b.dataset.lifeEdit)));
}
function proLifeForm(n){
  let isNew=!n;n=n||{id:'n'+Date.now().toString(36),type:'sakit',from:proToday(),to:proToday(),note:''};
  $('#detailBox').classList.remove('wide');
  $('#detailContent').innerHTML=`<div class="detail-box-inner gx-form"><span class="eyebrow">CATATAN HIDUP</span><h2>${isNew?'Tambah catatan':'Ubah catatan'}</h2><p class="muted">Menjelaskan turun-naiknya fitness di timeline.</p><div class="settings-form">
    <label>Jenis<select id="lnType">${PRO_LIFE_TYPES.map(t=>`<option value="${t[0]}"${n.type===t[0]?' selected':''}>${t[1]}</option>`).join('')}</select></label>
    <div class="zone-inputs"><label>Dari<input id="lnFrom" type="date" value="${esc(n.from)}"></label><label>Sampai<input id="lnTo" type="date" value="${esc(n.to||n.from)}"></label></div>
    <label>Keterangan<input id="lnNote" maxlength="80" placeholder="cth. demam berdarah" value="${esc(n.note||'')}"></label>
    <button type="button" class="btn primary gx-wide" id="lnSave">Simpan</button>${isNew?'':'<button type="button" class="btn gx-btn-danger gx-wide" id="lnDel">Hapus</button>'}</div></div>`;
  openModal();let others=()=>(proStore('lifeNotes',[])||[]).filter(x=>x.id!==n.id);
  $('#lnSave').onclick=async()=>{let from=$('#lnFrom').value||proToday(),to=$('#lnTo').value||from;if(to<from)to=from;try{await proStoreSave('lifeNotes',others().concat([{id:n.id,type:$('#lnType').value,from:from,to:to,note:$('#lnNote').value.trim().slice(0,80)}]).slice(-150),'Catatan tersimpan ✓');closeModal();proRefreshPage()}catch(e){}};
  let del=$('#lnDel');if(del)del.onclick=async()=>{try{await proStoreSave('lifeNotes',others(),'Catatan dihapus');closeModal();proRefreshPage()}catch(e){}};
}

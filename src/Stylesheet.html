<style>
:root{
  --app-vh:100vh;
  --orange:#ff9500; --orange-dark:#c96f00; --orange-light:#fff2e0;
  --blue:#0a84ff; --blue-light:#e8f2ff;
  --ink:#1c1c1e; --ink2:#48484a; --muted:#8a8a8e;
  --line:#e5e5ea; --bg:#f2f2f7; --canvas:#f7f7f9; --white:#fff;
  --green:#2ea84a; --green-light:#e6f7ea;
  --red:#ff3b30; --red-light:#ffece9;
  --strava:#fc4c02;
  /* Health-app style brand accent (red/pink) used for active/selected UI, not for data-category colors */
  --accent:#ff375f; --accent-2:#fa114f; --accent-light:#ffe7ec;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.10);
  --card-shadow:0 1px 3px rgba(30,30,45,.05),0 10px 22px -14px rgba(30,30,45,.13);
  --card-shadow-hover:0 2px 5px rgba(30,30,40,.06),0 16px 32px -12px rgba(30,30,45,.16);
  --panel-shadow:0 1px 2px rgba(30,30,45,.035),0 4px 12px -8px rgba(30,30,45,.06);
  --radius:20px;
  --card-radius:18px;
  --icon-radius:9px;
  --card-gap:18px;
  --section-gap:30px;
  --ease-spring:cubic-bezier(.22,1,.36,1);
  /* Liquid Glass surface tokens */
  --glass-bg:color-mix(in srgb,var(--white) 62%,transparent);
  --glass-border:color-mix(in srgb,var(--white) 55%,transparent);
  --glass-blur:saturate(180%) blur(20px);
  --glass-shadow:0 8px 30px -10px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.5);
}
:root[data-theme="dark"]{
  --orange:#ff9f0a; --orange-dark:#ffb340; --orange-light:#3a2a10;
  --blue:#409cff; --blue-light:#122a44;
  --ink:#f2f2f7; --ink2:#c7c7cc; --muted:#8e8e93;
  --line:#2c2c2e; --bg:#000; --canvas:#000; --white:#1c1c1e;
  --green:#30d158; --green-light:#0e2a15;
  --red:#ff6961; --red-light:#3a1512;
  --strava:#fc4c02;
  --accent:#ff375f; --accent-2:#ff6482; --accent-light:#3a1420;
  --shadow:0 1px 1px rgba(0,0,0,.16),0 10px 26px -14px rgba(0,0,0,.28);
  --card-shadow:0 1px 2px rgba(0,0,0,.22),0 10px 24px -14px rgba(0,0,0,.32);
  --card-shadow-hover:0 2px 5px rgba(0,0,0,.26),0 18px 34px -12px rgba(0,0,0,.46);
  --panel-shadow:0 1px 1px rgba(0,0,0,.16),0 4px 12px -8px rgba(0,0,0,.2);
  --glass-bg:color-mix(in srgb,var(--white) 46%,transparent);
  --glass-border:color-mix(in srgb,var(--white) 30%,rgba(255,255,255,.14));
  --glass-shadow:0 8px 30px -10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
}
*{box-sizing:border-box}
html{background:var(--canvas)}
html,body{height:100%;min-height:100%}
/* ---------- linear icon set (SF Symbols-style) ---------- */
.icon{display:inline-flex;align-items:center;justify-content:center;line-height:0;flex:none}
.icon svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-link .icon,.bottom-nav button .icon{font-size:18px}
.browse-icon .icon{font-size:16px;color:#fff}
.metric-icon .icon{font-size:12px}
.brand-mark .icon{font-size:17px}
.fab-sync .icon{font-size:21px}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.45 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}

/* ---------- Apple Health vertical rhythm: generous, consistent gaps between grouped sections/cards instead of ad-hoc margins ---------- */
.page>*{margin-top:0}
.page>*+*{margin-top:var(--section-gap)}
#dashOverviewWrap>*,#dashInsightWrap>*,#detailPageBody>*,#progressInsights>*,#progressCompliance>*{margin-top:0!important}
#dashOverviewWrap>*+*,#dashInsightWrap>*+*,#detailPageBody>*+*,#progressInsights>*+*,#progressCompliance>*+*{margin-top:var(--card-gap)!important}
.charts-grid,.dashboard-grid,.activity-feed,.settings-grid,.menu-card-list{gap:var(--card-gap);margin-bottom:0}
.dashboard-summary-grid{gap:var(--card-gap)}
.target-list,.segment-list,.plan-week-list{gap:11px}

@media (prefers-reduced-motion:no-preference){
  .page:not([hidden]){animation:page-enter .38s var(--ease-spring)}
  .panel,.plan-hero,.metric,.menu-day-row,.insight,.activity-card{transition:transform .16s var(--ease-spring),box-shadow .2s ease,border-color .22s ease,background .2s ease}
  .metric[type="button"]:active,.activity-card:active,.menu-day-row:active,.plan-week-row:active{transform:scale(.975)}
  .plan-hero:active{transform:scale(.99)}
  .plan-hero{animation:hero-enter .5s var(--ease-spring)}
  .hero-progress-fill,.target-fill,.compliance-bar i{transition:width .8s var(--ease-spring)}
  .btn{transition:transform .22s var(--ease-spring),background .18s ease,border-color .18s ease,box-shadow .22s ease}
  .btn:active{transform:scale(.95)}
  /* staggered entrance for cards inside a section, Apple Health "cascading" reveal */
  @keyframes page-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes hero-enter{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
}
/* ---------- hover only for real pointer devices (avoid sticky-hover "web" feel on touch) ---------- */
@media (hover:hover) and (pointer:fine){
  .metric[type="button"]:hover{box-shadow:var(--card-shadow-hover)}
  .activity-card:hover{box-shadow:var(--card-shadow-hover)}
  .plan-week-row:hover{box-shadow:var(--card-shadow-hover)}
  .menu-day-row:hover{background:var(--line)}
  .browse-row:hover{background:var(--bg)}
}
[hidden]{display:none!important}
.app{display:flex;min-height:100vh;min-height:100dvh;min-height:var(--app-vh)}
.login-screen{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;display:block;width:100%;height:100vh;height:100dvh;height:var(--app-vh);background:var(--canvas);overflow-y:auto;-webkit-overflow-scrolling:touch}
.auth-card{width:100%;max-width:300px;display:flex;flex-direction:column;align-items:center;gap:24px;margin:auto}
.auth-hero{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.auth-app-icon{width:72px;height:72px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(155deg,var(--accent),var(--accent-2));color:#fff;font-size:32px;box-shadow:0 12px 26px -10px rgba(250,17,79,.45),inset 0 1px 0 rgba(255,255,255,.28)}
.auth-title{margin:0;font-size:25px;font-weight:800;letter-spacing:-.4px;color:var(--ink)}
.auth-subtitle{margin:0;max-width:250px;font-size:13px;line-height:1.5;color:var(--muted)}
.auth-form{width:100%;display:flex;flex-direction:column;gap:10px}
.auth-field{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:14px;padding:13px 15px;box-shadow:var(--card-shadow);transition:box-shadow .15s ease}
.auth-field:focus-within{box-shadow:0 0 0 2px var(--accent-light),var(--card-shadow)}
.auth-field-icon{color:var(--muted);font-size:16px;flex:none}
.auth-field input{border:0;background:transparent;outline:0;flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);padding:0}
.auth-field input::placeholder{color:var(--muted)}
.auth-submit{width:100%;border-radius:14px;padding:13px;font-size:14.5px;font-weight:700;margin-top:4px;box-shadow:0 10px 20px -10px rgba(250,17,79,.45)}
.auth-toggle{font-size:12.5px}
.auth-error{background:var(--red-light);color:var(--red);border-radius:10px;padding:9px 12px;font-size:12px;font-weight:700;text-align:center;width:100%}
.auth-error[hidden]{display:none}
.auth-field-invalid{border-color:var(--red) !important}
.btn.is-loading{position:relative;color:transparent !important;pointer-events:none}
.btn.is-loading::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;animation:btnspin .7s linear infinite}
.btn.secondary.is-loading::after{border-color:rgba(0,0,0,.25);border-top-color:var(--ink)}
@keyframes btnspin{to{transform:rotate(360deg)}}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:0;color:var(--muted);font-weight:600;text-transform:lowercase}
.eyebrow::first-letter{text-transform:uppercase}
.muted{color:var(--muted)}

/* ---------- sidebar (desktop) ---------- */
.sidebar{width:230px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--white);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;transition:width .2s,padding .2s}
.sidebar-toggle{margin-left:auto;width:26px;height:26px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.app.sidebar-collapsed .sidebar{width:66px;padding-left:10px;padding-right:10px}.app.sidebar-collapsed .sidebar-label,.app.sidebar-collapsed .athlete-mini div,.app.sidebar-collapsed .sidebar-foot{display:none}.app.sidebar-collapsed .brand{margin:0 0 26px}.app.sidebar-collapsed .sidebar-toggle{transform:rotate(180deg);margin:auto}.app.sidebar-collapsed .athlete-mini{padding:8px;justify-content:center}.app.sidebar-collapsed .nav-link{justify-content:center;padding:11px 4px;border-left:0;font-size:0}.app.sidebar-collapsed .nav-link span{width:auto;font-size:17px}
.brand{display:flex;gap:10px;align-items:center;margin:0 8px 26px}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;font-size:19px;font-weight:900;flex:none}
.brand b{display:block;letter-spacing:1.4px;font-size:13px}
.brand small{display:block;color:var(--muted);letter-spacing:.1px;font-size:11px;margin-top:2px;text-transform:lowercase}
.brand small::first-letter{text-transform:uppercase}
.athlete-mini{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:22px}
.avatar{display:grid;place-items:center;background:var(--ink);color:var(--white);width:32px;height:32px;border-radius:50%;font-weight:800;flex:none}
.athlete-mini b,.athlete-mini small{display:block}
.athlete-mini small{color:var(--muted);font-size:11px;margin-top:2px}
.sidebar nav{display:grid;gap:3px}
.nav-link{display:flex;gap:12px;align-items:center;width:100%;border:0;border-radius:12px;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;font-weight:600;border-left:3px solid transparent}
.nav-link span{width:18px;font-size:17px;text-align:center}
.nav-link:hover{background:var(--bg)}
.nav-link.active{background:var(--accent-light);color:var(--accent);border-left-color:var(--accent);font-weight:700}
.sidebar-foot{margin-top:auto;color:#a7a7b0;font-size:11px;padding:14px 8px;border-top:1px solid var(--line)}

/* ---------- main / topbar ---------- */
.content{min-width:0;flex:1;padding:18px 18px 100px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--canvas) 78%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);padding:12px 0;margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}
.topbar-brand{display:flex;align-items:center;gap:9px}
.topbar-brand .brand-mark{width:30px;height:30px;font-size:16px;border-radius:9px}
.topbar-brand b{display:block;font-size:11px;letter-spacing:1.4px}
.topbar-brand small{display:block;color:var(--muted);font-size:11px}
.topbar h1{font-size:22px;margin:2px 0 0}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sync-state{color:var(--muted);font-size:11px;white-space:nowrap}
.btn{border:0;border-radius:24px;padding:10px 16px;font-weight:600;cursor:pointer;font:inherit;font-size:13px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.secondary{background:var(--white);border:1px solid var(--line);color:var(--ink)}
.theme-toggle{width:38px;padding:10px;text-align:center}
.btn.secondary:hover{border-color:var(--ink);color:var(--ink)}
.loading{max-width:520px;margin:72px auto;padding:28px 24px;text-align:center;color:var(--ink);font-weight:700;border:1px solid var(--line);border-radius:22px;background:var(--white);box-shadow:none}
.loading:before{content:'↗';display:grid;place-items:center;width:46px;height:46px;margin:0 auto 13px;border-radius:14px;background:var(--ink);color:var(--white);font-size:24px}

/* ---------- avatar profile button (top-right, Apple Health style) ---------- */
.avatar-btn{border:0;cursor:pointer;font:inherit;padding:0;position:relative}
.avatar-btn.active{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.top-actions .avatar-btn{width:36px;height:36px;font-size:14px}

/* ---------- athlete-mini as a nav button (sidebar) ---------- */
button.athlete-mini{border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
button.athlete-mini:hover{border-color:var(--ink2)}

/* ---------- browse list (Apple Health "Browse" grouped rows) ---------- */
.browse-section-label{padding:0 4px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.1px;text-transform:lowercase}
.browse-section-label::first-letter{text-transform:uppercase}
.page>.browse-section-label+.browse-list{margin-top:8px!important}
.browse-list{display:flex;flex-direction:column;background:var(--white);border-radius:var(--card-radius);overflow:hidden;box-shadow:var(--panel-shadow)}
.browse-row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.browse-row:last-child{border-bottom:0}
.browse-icon{width:32px;height:32px;border-radius:var(--icon-radius);display:grid;place-items:center;font-size:14px;flex:none;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.12)}
.browse-row-text{flex:1;min-width:0}
.browse-row-text b{display:block;font-size:14px;font-weight:600}
.browse-row-text small{color:var(--muted);font-size:11px}
.browse-chevron{color:var(--muted);font-size:19px;flex:none}

/* ---------- profile page header (Apple Health "Done" sheet style) ---------- */
.profile-page-hero{justify-content:space-between;align-items:center!important}
.profile-page-id{display:flex;align-items:center;gap:12px}
.profile-page-id .profile-avatar{width:44px;height:44px;font-size:16px}

/* ---------- strava logo (inline text replacement) ---------- */
.strava-logo{height:.85em;width:auto;vertical-align:-0.12em;display:inline-block;object-fit:contain}
.btn .strava-logo,.link-btn .strava-logo{height:.8em}
.sync-state .strava-logo,.sidebar-foot .strava-logo,.muted .strava-logo,.match .strava-logo{height:.8em}
.profile-info .strava-logo{height:.75em}

/* ---------- strava-style profile header ---------- */
.profile-header{display:flex;gap:16px;align-items:center;background:none;color:var(--ink);border-radius:0;padding:2px 2px 18px;margin-bottom:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.profile-avatar{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--white);font-size:19px;font-weight:700;flex:none}
.avatar.has-photo,.profile-avatar.has-photo{color:transparent;background-position:center;background-size:cover}
.profile-info{flex:1;min-width:160px}
.profile-info h2{margin:0 0 3px;font-size:19px;font-weight:700;letter-spacing:-.2px;color:var(--ink)}
.profile-info p{margin:0;color:var(--muted);font-size:12px}
.profile-stats-row{display:flex;gap:22px;flex-wrap:wrap;margin-top:4px}
.profile-stat b{display:block;font-size:19px;font-weight:700;color:var(--ink)}
.profile-stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.1px;margin-top:2px;text-transform:lowercase}
.profile-stat small::first-letter{text-transform:uppercase}
.stat-delta{display:inline-block;font-size:12px;font-weight:700;margin-left:5px;padding:1px 6px;border-radius:10px}
.stat-delta.up{background:var(--green-light);color:var(--green)}
.stat-delta.down{background:var(--red-light);color:var(--red)}
.stat-delta.flat{background:var(--bg);color:var(--muted)}
.plan-hero{position:relative;overflow:hidden;padding:20px;margin-bottom:14px;border-radius:26px;background:var(--white);color:var(--ink);box-shadow:var(--card-shadow-hover)}.plan-hero:after{display:none}.plan-hero>*{position:relative;z-index:1}.plan-hero .eyebrow{color:var(--muted)}.plan-hero h2{font-size:23px;font-weight:700;letter-spacing:-.3px;line-height:1.15;margin:6px 0}.plan-hero p{margin:0;color:var(--ink2);max-width:680px;font-size:13px;line-height:1.5}.plan-hero-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.readiness-chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:6px 10px;background:var(--bg);color:var(--ink2);font-size:11px;font-weight:700;white-space:nowrap}.hero-progress{margin:16px 0 12px;max-width:520px}.hero-progress-head{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:6px}.hero-progress-track{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}.hero-progress-fill{height:100%;background:var(--accent);border-radius:inherit}.hero-actions{display:flex;gap:8px;flex-wrap:wrap}.hero-actions .btn{background:var(--ink);color:var(--white)}.hero-actions .btn.secondary{color:var(--ink);background:transparent;border:1px solid var(--line)}

.hero{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 0 16px;gap:10px;flex-wrap:wrap}
.hero h2{font-size:clamp(26px,6vw,34px);font-weight:800;letter-spacing:-.6px;line-height:1.1;margin:6px 0 4px}
.hero p{margin:0;color:var(--muted);font-size:12px}
.hero.compact{margin-bottom:16px}
.hero.compact .detail-back-btn{margin-bottom:2px}
.month-chip{border-radius:30px;background:var(--ink);color:var(--white);padding:9px 14px;font-size:11px;font-weight:700}

/* ---------- filters ---------- */
.filters{display:flex;align-items:end;gap:8px;flex-wrap:wrap;background:none;border:0;padding:0;margin-bottom:14px}
.filters label{color:var(--muted);font-size:10px;font-weight:600}
.filters input,.filters select{display:block;min-width:128px;margin-top:4px;border:1px solid var(--line);background:var(--white);border-radius:10px;padding:9px;color:var(--ink);font:inherit;font-size:12px}
.date-presets.sub-tabs{margin:0 0 14px}
@media(max-width:520px){.date-presets.sub-tabs{width:100%;display:flex}}
.activity-filters input{min-width:150px}

/* ---------- metrics: separated 'Highlights' cards (Apple Health style) ---------- */
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.metric{position:relative;background:var(--white);border-radius:18px;padding:14px 14px 15px;box-shadow:var(--card-shadow);overflow:hidden}
.metric[type="button"]{width:100%;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.metric b{display:block;font-size:27px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums;margin:11px 0 1px;line-height:1.05}
.metric small{color:var(--muted);font-size:10.5px;font-weight:600}
.metric .eyebrow{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.1px;color:var(--ink2)}
.metric-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:var(--icon-radius);font-size:12px;flex:none;background:var(--orange);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.12)}
.metric:nth-of-type(4n+1) .metric-icon{background:var(--orange)}
.metric:nth-of-type(4n+2) .metric-icon{background:var(--blue)}
.metric:nth-of-type(4n+3) .metric-icon{background:var(--green)}
.metric:nth-of-type(4n+4) .metric-icon{background:#8b5cf6}
@media(min-width:700px){
  .metric-grid{grid-template-columns:repeat(4,1fr)}
}

/* ---------- panels & charts (Apple Health card) ---------- */
.panel{background:var(--white);border-radius:18px;padding:18px 18px 20px;box-shadow:var(--panel-shadow);margin-bottom:0}
.panel h3{font-weight:700;letter-spacing:-.3px}
.details-panel{margin-bottom:12px}
.details-panel summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.details-panel summary::-webkit-details-marker{display:none}
.details-panel summary::after{content:'⌄';font-size:16px;color:var(--muted);transition:transform .2s ease;margin-left:auto}
.details-panel[open] summary::after{transform:rotate(180deg)}
.details-panel[open] summary{margin-bottom:12px}
.details-panel .calendar-grid{margin-top:0}
.details-panel .calendar-legend{margin-top:10px}
.panel-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:12px}
.panel h3{font-size:16px;margin:4px 0}
.panel small{color:var(--muted)}
.charts-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
.chart-panel{min-width:0}
.chart-wrap{position:relative;height:190px}
.chart-wrap.tall{height:220px}
.chart-empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:12px}
.link-btn{background:transparent;border:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:11px}
.dashboard-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
.dashboard-calendar{margin-bottom:14px}
.target-list,.segment-list{display:grid;gap:10px}
.mini-gauge{width:104px;height:104px;margin:0 auto 12px;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(var(--white) 56%,transparent 57%),conic-gradient(var(--ink) var(--value),var(--line) 0)}
.mini-gauge.hr{background:radial-gradient(var(--white) 56%,transparent 57%),conic-gradient(var(--blue) var(--value),var(--line) 0)}
.mini-gauge b,.mini-gauge small{display:block}.mini-gauge b{font-size:15px}.mini-gauge small{font-size:11px;color:var(--muted);margin-top:3px}
.target-row,.segment-row{background:var(--bg);border-radius:14px;padding:12px 13px;transition:background .2s ease}
.target-row-head,.segment-row-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}
.target-row b,.segment-row b{font-size:13px;font-weight:700}
.target-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.target-fill{height:100%;background:var(--green);border-radius:99px}
.target-row.running .target-fill{background:var(--blue)}
.segment-row small{display:block;color:var(--muted);margin-top:4px}

/* ---------- gauge (Apple Health ring style) ---------- */
.gauge-card{flex-direction:column;align-items:center;text-align:center;gap:8px;display:flex;padding:6px 0 2px}
.gauge-wrap{position:relative;width:168px;height:168px;flex:none;margin:0 auto}
.gauge-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge-wrap .gauge-track{fill:none;stroke:var(--bg);stroke-width:11}
.gauge-wrap .gauge-value{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dasharray 1.1s var(--ease-spring),stroke 0.4s ease;filter:drop-shadow(0 1px 1px rgba(0,0,0,.08))}
.gauge-num{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;letter-spacing:-1.4px;font-variant-numeric:tabular-nums;animation:gauge-num-in .6s var(--ease-spring) .15s backwards}
@keyframes gauge-num-in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.gauge-copy{min-width:0}
.gauge-copy .level{background:none;border-radius:0;padding:0;font-size:13px;font-weight:700;text-transform:none;margin-bottom:4px;display:block}
.gauge-copy .level.green{color:var(--green)}
.gauge-copy .level.orange{color:var(--orange-dark)}
.gauge-copy .level.red{color:var(--red)}
.ring-ctl{stroke:var(--blue)}
.ring-atl{stroke:var(--accent)}
.ring-legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:10px;font-weight:700;color:var(--muted)}
.ring-legend span{display:inline-flex;align-items:center;gap:4px}
.ring-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ring-dot.tsb{background:var(--green)}
.ring-dot.ctl{background:var(--blue)}
.ring-dot.atl{background:var(--accent)}
.advice{color:var(--muted);line-height:1.5;font-size:12px;margin:0 auto;max-width:280px}
.load-num-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}

/* ---------- today plan ---------- */
.today-plan{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.today-plan .plan-copy{min-width:0;flex:1}
.today-plan h3{margin:6px 0 4px;font-size:17px}
.today-plan p{margin:0;color:var(--muted);line-height:1.5;font-size:12px}
.plan-badge{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:900;letter-spacing:.3px;margin-right:5px;background:var(--bg);color:var(--ink)}
.plan-badge.Hard{background:var(--red-light);color:var(--red)}
.plan-badge.Rest{background:var(--bg);color:var(--muted)}
.plan-badge.Endurance{background:var(--green-light);color:var(--green)}
.plan-badge.Recovery{background:var(--orange-light);color:var(--orange-dark)}
.match{color:var(--green);font-weight:800;font-size:11px;margin-top:5px}
.plan-meta{color:var(--muted);font-size:11px;margin:4px 0 8px}
.plan-empty{background:var(--bg);border-radius:14px;padding:16px;color:var(--muted);text-align:center;font-size:12px}
.upcoming-list{display:grid;gap:7px;margin-top:8px}
.upcoming-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px}
.upcoming-row b,.upcoming-row small{display:block;font-size:12px}
.upcoming-row small{color:var(--muted);margin-top:2px}
.upcoming-row.today{border-color:var(--blue);background:var(--blue-light)}

/* ---------- activity feed (strava style cards w/ mini map) ---------- */
.activity-feed{display:grid;grid-template-columns:1fr;gap:12px}
.activity-card{position:relative;background:var(--white);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:var(--card-shadow)}
.compare-checkbox{position:absolute;top:8px;right:8px;z-index:3;width:26px;height:26px;border-radius:50%;background:rgba(20,20,25,.55);display:flex;align-items:center;justify-content:center;cursor:pointer}
.compare-checkbox input{width:16px;height:16px;cursor:pointer}
.compare-bar{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:45;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.compare-bar[hidden]{display:none}
.compare-bar-actions{display:flex;gap:6px}
.compare-bar .btn{padding:7px 14px;font-size:11px;border-radius:999px}
.detail-box.wide{max-width:860px}
.compare-legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin:8px 0 14px}
.compare-legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-left:10px}
.compare-legend .dot.a{background:var(--ink);margin-left:0}
.compare-legend .dot.b{background:var(--blue)}
.compare-table{display:grid;gap:4px;margin:6px 0 16px}
.compare-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 10px;border-radius:9px;background:var(--bg);font-size:12px;align-items:center}
.compare-row.compare-head{background:transparent;color:var(--muted);font-weight:800;padding:0 10px}
.compare-row b.a{color:var(--orange-dark)}
.compare-row b.b{color:#2e97f2}
.lap-list{display:grid;gap:4px;margin-top:8px}
.lap-row{display:grid;grid-template-columns:22px 1fr 1fr 1fr 1fr 1fr;gap:6px;font-size:11px;padding:7px 8px;border-radius:8px;background:var(--bg);align-items:center}
.lap-row.lap-head{background:transparent;color:var(--muted);font-weight:800;padding:0 8px}
.lap-idx{font-weight:700;color:var(--ink)}
.interval-list{display:grid;gap:4px;margin-top:10px}
.interval-row{display:grid;grid-template-columns:22px 1fr 1fr;gap:6px;font-size:11px;padding:7px 8px;border-radius:8px;background:var(--bg);align-items:center}
.interval-row.interval-head{background:transparent;color:var(--muted);font-weight:800;padding:0 8px}
.climb-list{display:grid;gap:4px;margin-top:10px}
.climb-row{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;gap:6px;font-size:11px;padding:7px 8px;border-radius:8px;background:var(--bg);align-items:center}
.climb-row.climb-head{background:transparent;color:var(--muted);font-weight:800;padding:0 8px}
.mini-map{height:120px;background:#e9edf1;display:block;overflow:hidden}
.mini-map svg{width:100%;height:100%;display:block}
.mini-map.empty{display:flex;align-items:center;justify-content:center;color:#9aa4ab;font-size:26px;background:repeating-linear-gradient(135deg,#eef1f2,#eef1f2 10px,#e4e8ea 10px,#e4e8ea 20px)}
.activity-card-body{padding:14px}
.activity-card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.activity-card h3{margin:0 0 8px;font-size:16px;line-height:1.3}
.sport-chip{display:inline-flex;align-items:center;gap:4px;color:var(--orange-dark);background:var(--orange-light);border-radius:20px;padding:4px 9px;font-size:10px;font-weight:700}
.sport-chip.run{color:var(--blue);background:var(--blue-light)}
.sport-chip.other{color:var(--muted);background:var(--bg)}
.activity-stats{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--line);margin-top:2px;padding-top:11px}
.activity-stat{flex:1;text-align:left}
.activity-stat b,.activity-stat small{display:block}
.activity-stat b{font-size:14px;color:var(--ink)}
.activity-stat small{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.3px;text-transform:uppercase}
.feed-empty,.empty-state{grid-column:1/-1;padding:30px 16px;background:var(--white);border-radius:16px;color:var(--muted);text-align:center;font-size:12px;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);box-shadow:var(--card-shadow)}
.empty-state span{font-size:26px;display:block;margin-bottom:8px}
.empty-state b{display:block;color:var(--ink);margin-bottom:4px}
.source-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;letter-spacing:.4px;padding:3px 7px;border-radius:20px;background:var(--orange-light);color:var(--orange-dark)}

/* ---------- sub tabs (Apple segmented control) ---------- */
.sub-tabs{display:inline-flex;gap:0;margin:0 0 16px;border-bottom:0;background:var(--bg);border-radius:99px;padding:3px;overflow-x:auto;position:relative}
.sub-tab-pill{position:absolute;top:3px;bottom:3px;left:0;border-radius:99px;background:var(--white);box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:0;pointer-events:none;transition:transform .35s var(--ease-spring),width .35s var(--ease-spring)}
.sub-tab{border:0;background:transparent;border-radius:99px;padding:7px 14px;color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;transition:color .25s ease,background .25s var(--ease-spring),box-shadow .25s ease,transform .2s var(--ease-spring);position:relative;z-index:1}
.sub-tab.active{color:var(--ink);background:transparent;box-shadow:none}
.sub-tab:active{transform:scale(.94)}

/* ---------- calendar heatmap ---------- */
.calendar-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 12px}
.calendar-nav b{font-size:13px;min-width:130px;text-align:center}
.cal-nav-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:16px;line-height:1;cursor:pointer}
.cal-nav-btn:disabled{opacity:.35;cursor:not-allowed}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calendar-day,.cal-empty{min-height:56px;border-radius:12px;background:var(--bg);padding:7px;font-size:11px}
.calendar-day{cursor:pointer}
.calendar-day:active{transform:scale(.95)}
.calendar-day b,.calendar-day small{display:block}
.calendar-day small{color:var(--green);font-size:11px;margin-top:6px}
.heat-0{background:var(--line);color:var(--ink)}
.heat-1{background:#ffe4c2;color:var(--ink)}
.heat-2{background:#ffb768;color:var(--ink)}
.heat-3{background:var(--orange);color:#fff}
.heat-3 small{color:#fff2e0!important}
.heat-4{background:#c9660a;color:#fff}
.heat-4 small{color:#ffe4c2!important}
.calendar-legend{display:flex;gap:10px;flex-wrap:wrap;margin:-6px 0 14px;font-size:11px;color:var(--muted)}.calendar-legend span{display:flex;align-items:center;gap:4px}.calendar-legend i{display:block;width:11px;height:11px;border-radius:3px}

/* ---------- insight list / zones ---------- */
.insight-list{display:grid;gap:8px}
.insight{padding:11px 13px;border-radius:14px;background:var(--bg);border-left:0;position:relative;padding-left:17px}
.insight:before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:3px;background:var(--orange)}
.insight.rest-ok:before{background:var(--green)}
.insight.rest-warn:before{background:var(--orange)}
.insight.rest-alert:before{background:var(--red)}
.insight.tag-review:before{background:var(--blue)}
.insight.tag-analysis:before{background:#8b5cf6}
.insight.tag-saran:before{background:var(--green)}
.insight.tag-highlight:before{background:var(--accent)}
.insight ul{margin:5px 0 0;padding-left:16px;color:var(--muted);line-height:1.5}
.insight ul li{font-size:12px;margin-bottom:3px}
.insight ul li:last-child{margin-bottom:0}
.insight .review-eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.wrapped-panel{background:var(--ink);color:var(--white)}
.wrapped-panel .eyebrow{color:#c7c7cc}
.wrapped-panel h3,.wrapped-panel p{color:var(--white)}
.wrapped-panel .btn.primary{background:var(--white);color:var(--ink)}
.wrapped-preview{text-align:center;margin-bottom:14px}
.wrapped-preview img{width:100%;max-width:320px;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.wrapped-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.overlay-filters{margin-bottom:2px}
.overlay-stat-picker{margin-top:6px}
.overlay-stat-group{margin-top:10px}
.overlay-stat-group-label{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--muted);margin-bottom:6px}
.overlay-stat-chips{display:flex;flex-wrap:wrap;gap:8px}
.overlay-stat-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:11.5px;font-weight:600;color:var(--ink);cursor:pointer;font:inherit}
.overlay-stat-chip input{accent-color:var(--green);width:15px;height:15px}
.overlay-stat-chip:has(input:checked),.overlay-stat-chip.on-canvas{background:var(--ink);color:var(--white);border-color:var(--ink)}
.ovl-studio{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-top:16px;max-width:100%}
.ovl-stage-col{flex:0 1 330px;min-width:0;max-width:330px;margin:0 auto;width:100%}
.ovl-stage{position:relative;width:100%;max-width:100%;border-radius:20px;overflow:hidden;box-shadow:var(--card-shadow-hover);background:repeating-conic-gradient(#00000014 0% 25%,transparent 0% 50%) 50%/18px 18px;touch-action:none;box-sizing:border-box}
.ovl-stage canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.ovl-sel-box{position:absolute;border:1.5px dashed rgba(255,255,255,.9);border-radius:6px;pointer-events:none;box-shadow:0 0 0 1.5px rgba(0,0,0,.35);box-sizing:border-box}
.ovl-handle{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--white);border:2px solid var(--accent);pointer-events:auto;cursor:nwse-resize;touch-action:none}
.ovl-stage-hint{margin:8px 0 0;font-size:11.5px;text-align:center}
.ovl-stage-actions{display:flex;gap:8px;margin-top:10px}
.ovl-stage-actions .btn{flex:1;min-width:0}
.ovl-side{flex:1 1 250px;min-width:0;max-width:100%}
.ovl-tabs{display:flex;width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ovl-tabs .sub-tab{white-space:nowrap;flex:0 0 auto}
.ovl-pane{max-width:100%}
.ovl-hint{margin:0 0 10px;font-size:11px}
.ovl-cat-chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 12px;padding-bottom:2px}
.ovl-cat-chip{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:6px 13px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease}
.ovl-cat-chip.active{background:var(--ink);color:var(--white);border-color:var(--ink)}
.ovl-tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.ovl-tpl{display:block;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 6px 9px;cursor:pointer;font:inherit;color:inherit;min-width:0;transition:border-color .2s ease,transform .2s var(--ease-spring,ease)}
.ovl-tpl-thumb{display:block;width:100%;aspect-ratio:9/16;border-radius:9px;overflow:hidden;margin-bottom:7px;background:#1c1c22;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.ovl-tpl-thumb svg{display:block;width:100%;height:100%}
.ovl-tpl b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;font-weight:600;line-height:1.25}
.ovl-tpl:hover{border-color:var(--ink2);transform:translateY(-1px)}
.ovl-tpl:active{transform:translateY(0)}
.ovl-preset-save{display:flex;gap:8px;margin-bottom:10px}
.ovl-preset-save input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;color:inherit}
.ovl-preset-save .btn{flex:none}
.ovl-preset-card{position:relative}
.ovl-preset-del{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ovl-preset-del:hover{background:rgba(0,0,0,.75)}
.ovl-emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.ovl-emoji{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 0;font-size:18px;cursor:pointer;line-height:1}
.ovl-emoji:hover{border-color:var(--ink2)}
.ovl-field{display:block;margin-bottom:11px;max-width:100%}
.ovl-field>span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.3px;color:var(--muted);margin-bottom:5px}
.ovl-field select,.ovl-field input[type=text],.ovl-field textarea,.ovl-field input[type=file]{width:100%;max-width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--white);color:var(--ink);font:inherit;font-size:12.5px}
.ovl-field input[type=range]{width:100%;max-width:100%;box-sizing:border-box;accent-color:var(--accent)}
.ovl-field input[type=checkbox]{width:17px;height:17px;accent-color:var(--green)}
.ovl-swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ovl-sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.ovl-sw.on{border-color:var(--accent);transform:scale(1.12)}
.ovl-sw-custom{width:28px;height:24px;border:1px solid var(--line);border-radius:6px;background:none;padding:0;cursor:pointer}
.ovl-btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ovl-btn-row .btn{flex:1 1 calc(50% - 6px);min-width:0;font-size:11.5px;padding:8px 6px}
.ovl-layers{display:flex;flex-direction:column;gap:6px}
.ovl-layer{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;cursor:pointer;min-width:0}
.ovl-layer>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ovl-layer.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.ovl-layer-acts{display:flex;gap:4px;flex:none}
.ovl-layer-acts button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:13px;padding:0 3px;line-height:1}
@media(max-width:760px){
  .ovl-studio{flex-direction:column;align-items:stretch}
  .ovl-stage-col{max-width:192px;margin:0 auto 10px;position:sticky;top:calc(44px + env(safe-area-inset-top,0px) + 4px);z-index:15;background:color-mix(in srgb,var(--ios-bg) 90%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);padding:6px 0 4px}
  .ovl-stage-hint{display:none}
  .ovl-stage-actions{margin-top:6px;gap:6px}
  .ovl-stage-actions .btn{font-size:10.5px;padding:7px 3px}
}
.overlay-route-toggle{margin-top:2px}
.kudos-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.kudos-chip{background:var(--bg);color:var(--ink2);border-radius:20px;padding:5px 11px;font-size:11px;font-weight:600}
.comment-list{margin-top:12px;display:grid;gap:9px}
.comment-row{padding:9px 11px;border-radius:10px;background:var(--bg)}
.comment-row b{font-size:12px}
.comment-row p{margin:3px 0 0;font-size:12px;color:var(--ink2)}
.insight b,.insight p{display:block;margin:0;font-size:12px}
.insight.trophy{width:100%;border:0;text-align:left;cursor:pointer;font:inherit;color:var(--ink);padding-right:28px}.insight.trophy:hover{filter:brightness(.98);border-left-color:var(--blue)}.insight.trophy:after{content:'›';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;font-weight:600}
.insight p{color:var(--muted);line-height:1.4;margin-top:4px}
.workout-steps{display:grid;gap:7px;margin-top:8px}.workout-step{padding:10px 12px;background:var(--bg);border-radius:10px;border-left:3px solid var(--blue)}.workout-step b,.workout-step small{display:block;font-size:12px}.workout-step small{color:var(--muted);margin-top:3px;line-height:1.35}

.plan-timeline{position:relative}.timeline-row{display:grid;grid-template-columns:14px 1fr 14px;gap:10px;align-items:center}.timeline-status{width:11px;height:11px;border-radius:50%;background:#b6b6bf;box-shadow:0 0 0 4px var(--bg)}.timeline-row.tercapai .timeline-status{background:var(--green)}.timeline-row.sebagian .timeline-status{background:#e5a13d}.timeline-row.terlewat .timeline-status{background:var(--red)}.timeline-row.akan-datang .timeline-status{background:var(--blue)}.timeline-copy{min-width:0}.timeline-arrow{font-size:22px;color:var(--muted)}.timeline-legend{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;font-size:11px;color:var(--muted)}.timeline-legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#b6b6bf}.timeline-legend .tercapai:before{background:var(--green)}.timeline-legend .sebagian:before{background:#e5a13d}.timeline-legend .terlewat:before{background:var(--red)}.timeline-legend .akan-datang:before{background:var(--blue)}
.compliance-type{padding:12px;background:var(--bg);border-radius:14px}.compliance-type-head{display:flex;justify-content:space-between;gap:8px;font-size:12px}.compliance-type-head b{font-size:13px}.compliance-bar{height:7px;margin-top:9px;border-radius:9px;background:var(--line);overflow:hidden}.compliance-bar i{display:block;height:100%;border-radius:inherit;background:var(--blue)}.compliance-type small{display:block;color:var(--muted);margin-top:6px;font-size:11px}

/* ---------- settings ---------- */

.zone-inputs label,.settings-form label,.modal-box label{display:block;color:var(--muted);font-size:11px;font-weight:700}
.zone-inputs input,.settings-form input,.settings-form select,.modal-box input,.modal-box select{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:10px;font:inherit;color:var(--ink);font-size:13px}
.settings-form textarea{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:10px;font:inherit;color:var(--ink);font-size:13px;resize:vertical}

/* ---------- plan week ---------- */

/* ---------- menu latihan mingguan ---------- */

.menu-days{display:grid;gap:6px;margin-top:10px}
.menu-days[hidden]{display:none}
.menu-day-row{background:var(--bg);border-radius:12px;padding:8px 10px;border:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;display:block}

.menu-day-row small{font-size:11px}
/* ---- Kartu hari di "My Plan" (lebih informatif + interaktif) ---- */
.plan-day-row{display:flex;align-items:stretch;gap:8px}

.plan-day-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.plan-action-list{display:grid;gap:6px}
.menu-locked{border:1px solid var(--line);background:var(--white);border-radius:16px;padding:14px}
.menu-locked-badge{display:inline-block;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap;background:var(--green-light);color:var(--green)}
.plan-form-section{margin-bottom:16px}
.plan-form-section>label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:6px}
.day-chip-row{display:flex;gap:6px;flex-wrap:wrap}
.day-chip{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-size:11px;font-weight:600;color:var(--ink);cursor:pointer}
.day-chip.active-off{background:var(--muted);color:var(--white);border-color:var(--muted)}

/* ---------- modal / activity detail w/ leaflet (mobile: bottom sheet) ---------- */
.modal{display:none;position:fixed;inset:0;align-items:flex-end;justify-content:center;background:rgba(20,20,25,.6);z-index:999;padding:0}
.modal.show{display:flex}

@keyframes sheet-up{from{transform:translateY(100%)}to{transform:translateY(0)}}

.detail-box-inner{padding:22px}

.route-map-leaflet{width:100%;height:240px;background:#e9edf1}

.panel-collapse-btn{border:0;background:var(--bg);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);flex:none;padding:0}

.route-reco-head{display:flex;gap:10px;align-items:flex-start}
.route-reco-arrow{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:transform .3s ease}

.pro-fly-top b{display:block;font-size:16px}.pro-fly-top small{font-size:12px;opacity:.8}
.pro-fly-x{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:16px;cursor:pointer;backdrop-filter:blur(8px)}
.pro-fly-stats{position:absolute;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:2;justify-content:center}
.pro-fly-stats div{background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#fff;border-radius:12px;padding:7px 12px;text-align:center;min-width:70px}
.pro-fly-stats small{display:block;font-size:10.5px;opacity:.75}.pro-fly-stats b{font-size:15px;font-variant-numeric:tabular-nums}
.pro-fly-ctrl{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border-radius:16px;padding:10px 12px;z-index:2}
.pro-fly-ctrl button{width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:#000;font-size:15px;cursor:pointer;flex:none}
.pro-fly-ctrl input{flex:1;accent-color:#fc4c02}
.pro-fly-ctrl select{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px;font:inherit;font-size:12px}
.pro-fly-load{position:absolute;inset:0;display:grid;place-items:center;color:#fff;z-index:3;background:#000}
.pro-fly-load *{color:#fff!important}.pro-fly-load p{padding:0 30px;text-align:center;font-size:14px}
.pro-fly .maplibregl-ctrl-bottom-right,.pro-fly .maplibregl-ctrl-bottom-left{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.pro-fly-dot{width:18px;height:18px;border-radius:50%;background:#0a84ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(10,132,255,.3)}
/* ghost */
.pro-ghost-bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pro-ghost-bar b{margin-left:auto}
.pro-ghost-mk span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
/* jendela cuaca */
.pro-hours{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px 0 2px;margin-top:10px}
.pro-hours::-webkit-scrollbar{display:none}
.pro-hour{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:12px;background:var(--bg)}
.pro-hour.in{background:var(--accent-light);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pro-hour small{font-size:10.5px;font-weight:700;color:var(--muted)}.pro-hour span{font-size:16px}.pro-hour i{width:20px;height:4px;border-radius:99px}
.pro-hour b{font-size:12.5px}.pro-hour em{font-style:normal;font-size:10.5px;color:var(--ios-blue);font-weight:700}
.pro-day-ic{flex:none;width:30px;font-size:20px;text-align:center}
.pro-reco-link{margin-top:0}
/* event */
.pro-event-head{display:flex;gap:14px;align-items:flex-start}
.pro-event-head>div:nth-child(2){flex:1;min-width:0}
.pro-event-head h3{margin:1px 0 2px}
.pro-count{flex:none;width:64px;height:64px;border-radius:16px;background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pro-count b{font-size:26px;font-weight:800}.pro-count small{font-size:10px;font-weight:700;opacity:.9;margin-top:3px}
.pro-ev-wx{margin-top:10px}
.pro-check{margin-top:12px;border-radius:12px;background:var(--ios-fill2);padding:4px 12px}
.pro-check summary{cursor:pointer;font-size:13.5px;font-weight:700;padding:9px 0}
.pro-check label.gx-check{margin:4px 0 8px}
.pro-ev-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* pacer */
.pro-file{display:flex!important;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:14px;border:1.5px dashed var(--ios-sep);border-radius:12px;font-size:13.5px!important;font-weight:700!important;color:var(--accent)!important;cursor:pointer}
.pro-file input{display:none!important}
.pro-seg-ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--ios-label3)}
.pro-seg-ic.up{background:var(--ios-red)}.pro-seg-ic.down{background:var(--ios-blue)}.pro-seg-ic.flat{background:var(--ios-green)}
.pro-feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:10px}
.pro-feed div{background:var(--bg);border-radius:10px;padding:8px}
.pro-feed b{display:block;font-size:14px;font-variant-numeric:tabular-nums}.pro-feed small{display:block;font-size:11px;color:var(--muted)}.pro-feed span{display:block;font-size:11px;margin-top:3px;line-height:1.3}
/* nilai interval */
.pro-grade{display:flex;gap:12px;align-items:center;margin-top:6px}
.pro-grade>div:last-child{min-width:0}.pro-grade b{display:block;font-size:14.5px}.pro-grade small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pro-grade-score{flex:none;width:56px;height:56px;border-radius:16px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pro-grade-score b{font-size:24px!important;color:#fff}.pro-grade-score small{color:rgba(255,255,255,.85)!important;font-weight:700}
.pro-reps{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:12px;padding:8px;border-radius:12px;background:var(--bg)}
.pro-reps div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;gap:2px}
.pro-reps i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent)}
.pro-reps small,.pro-reps em{font-size:10px;color:var(--muted);font-style:normal}.pro-reps b{font-size:11px;font-variant-numeric:tabular-nums}
/* setup */
.pro-setup summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px}
.pro-setup summary::-webkit-details-marker{display:none}
.pro-setup summary b{font-size:14px}.pro-setup summary small{font-size:12px;color:var(--muted)}
/* biaya 6 bulan */
.pro-months{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:10px}
.pro-months div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.pro-months i{display:block;width:100%;max-width:40px;min-height:3px;border-radius:7px 7px 3px 3px;background:var(--ios-orange)}
.pro-months b{font-size:10.5px;white-space:nowrap}.pro-months small{font-size:11px;color:var(--muted);font-weight:700}
/* sepatu */
.pro-shoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:700px){.pro-shoes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pro-shoe{display:flex;flex-direction:column;gap:3px;border:0;text-align:left;font:inherit;color:var(--ink);background:var(--ios-card);border-radius:var(--ios-radius-lg);padding:13px;box-shadow:var(--card-shadow);cursor:pointer;min-width:0}
.pro-shoe.retired{opacity:.55}
.pro-shoe-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.pro-shoe-top b{font-size:14px;line-height:1.25}
.pro-shoe small{font-size:11px;color:var(--ios-label2);line-height:1.35}
.pro-shoe-km{margin-top:6px}.pro-shoe-km b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.pro-shoe-km span{font-size:12px;color:var(--ios-label2);margin-left:3px}
/* timeline */
.pro-tl{position:relative;background:var(--ios-card);border-radius:var(--ios-radius-lg);padding:4px 14px;box-shadow:var(--card-shadow)}
.pro-tl-item{display:flex;gap:12px;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;font:inherit;color:var(--ink);padding:11px 0;border-top:.5px solid var(--ios-sep);cursor:pointer}
.pro-tl-item:first-child{border-top:0}
.pro-tl-ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--ios-fill2);font-size:17px}
.pro-tl-body{min-width:0}.pro-tl-body b{display:block;font-size:14px;line-height:1.3}.pro-tl-body small{display:block;font-size:12px;color:var(--ios-label2);margin-top:2px}

/* =====================================================================
   ACTIVE COACH · DESIGN SYSTEM v3 (navigasi 5 tab, satu sistem visual)
   ===================================================================== */
:root{
  --acx-bg:#f4f4f7;--acx-surface:#ffffff;--acx-surface-2:#f7f7fa;--acx-sunken:#eeeef3;
  --acx-line:rgba(22,22,38,.08);--acx-line-2:rgba(22,22,38,.14);
  --acx-text:#12121a;--acx-text-2:#5b5b6b;--acx-text-3:#9a9aab;
  --acx-coral:#ff5a36;--acx-blue:#2f7bff;--acx-violet:#7a5cff;--acx-amber:#f59e0b;--acx-pink:#ec4899;
  --acx-green:#16a34a;--acx-teal:#0ea5b7;--acx-orange:#f97316;--acx-red:#ef4444;--acx-indigo:#5b5bd6;--acx-purple:#a855f7;--acx-yellow:#eab308;--acx-gray:#8b8b9b;--acx-strava:#fc4c02;
  --acx-accent:var(--acx-coral);
  --acx-r-lg:22px;--acx-r:18px;--acx-r-sm:13px;
  --acx-shadow:0 1px 2px rgba(20,20,40,.04),0 6px 20px -12px rgba(20,20,40,.18);
  --acx-shadow-lg:0 20px 50px -24px rgba(20,20,40,.35);
  --acx-glass:rgba(255,255,255,.78);
  --acx-side-w:256px;
  --ios-bg:var(--acx-bg);--canvas:var(--acx-bg);--ios-card:var(--acx-surface);--white:var(--acx-surface);
  --ink:var(--acx-text);--muted:var(--acx-text-2);--ios-label2:var(--acx-text-2);--line:var(--acx-line);--ios-sep:var(--acx-line);
}
:root[data-theme="dark"]{
  --acx-bg:#0b0b0f;--acx-surface:#16161d;--acx-surface-2:#1c1c24;--acx-sunken:#101015;
  --acx-line:rgba(255,255,255,.07);--acx-line-2:rgba(255,255,255,.13);
  --acx-text:#f4f4f8;--acx-text-2:#a4a4b4;--acx-text-3:#6c6c7c;
  --acx-coral:#ff6b4a;--acx-blue:#4d8dff;--acx-violet:#9179ff;--acx-amber:#fbbf24;--acx-pink:#f472b6;
  --acx-green:#22c55e;--acx-teal:#22d3ee;--acx-orange:#fb923c;--acx-red:#f87171;--acx-indigo:#818cf8;--acx-purple:#c084fc;--acx-yellow:#facc15;--acx-gray:#8e8e9e;
  --acx-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -18px rgba(0,0,0,.8);
  --acx-shadow-lg:0 24px 60px -24px rgba(0,0,0,.9);
  --acx-glass:rgba(22,22,29,.78);
  --ios-bg:var(--acx-bg);--canvas:var(--acx-bg);--ios-card:var(--acx-surface);--white:var(--acx-surface);--ink:var(--acx-text);--muted:var(--acx-text-2);--ios-label2:var(--acx-text-2);--line:var(--acx-line);--ios-sep:var(--acx-line);
}
html[data-tab="dashboard"]{--acx-accent:var(--acx-coral)}
html[data-tab="training"]{--acx-accent:var(--acx-blue)}
html[data-tab="performance"]{--acx-accent:var(--acx-violet)}
html[data-tab="garage"]{--acx-accent:var(--acx-amber)}
html[data-tab="sharing"]{--acx-accent:var(--acx-pink)}
.tone-coral{--tone:var(--acx-coral)}.tone-blue{--tone:var(--acx-blue)}.tone-violet{--tone:var(--acx-violet)}.tone-amber{--tone:var(--acx-amber)}.tone-pink{--tone:var(--acx-pink)}
.tone-green{--tone:var(--acx-green)}.tone-teal{--tone:var(--acx-teal)}.tone-orange{--tone:var(--acx-orange)}.tone-red{--tone:var(--acx-red)}.tone-indigo{--tone:var(--acx-indigo)}
.tone-purple{--tone:var(--acx-purple)}.tone-yellow{--tone:var(--acx-yellow)}.tone-gray{--tone:var(--acx-gray)}.tone-strava{--tone:var(--acx-strava)}
html,body{background:var(--acx-bg)!important}
body{color:var(--acx-text);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
.acx-hidden,.fab-stack{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.icon.ic-inline{font-size:1.05em;vertical-align:-.16em;margin-right:4px}
.icon.ic-inline.ok{color:var(--acx-green)}.icon.ic-inline.warn{color:var(--acx-orange)}.icon.ic-inline.gold{color:var(--acx-yellow);margin:0 0 0 4px}

/* ---------- shell ---------- */
.app.acx-app{max-width:none!important;margin:0!important;box-shadow:none!important;background:var(--acx-bg)!important;padding-left:0}
.acx-content.content{max-width:640px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom,0px))}
html[data-view="tablet"] .acx-content.content{max-width:780px;padding-left:24px;padding-right:24px}
.acx-page[hidden],.acx-sub[hidden]{display:none!important}
.acx-page{display:block!important;animation:acx-in .32s cubic-bezier(.22,1,.36,1)}
@keyframes acx-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.acx-page>*{grid-column:auto!important}

/* ---------- navigation (bottom bar on phone, sidebar on desktop) ---------- */
.acx-nav{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px);max-width:520px;height:66px;display:flex;align-items:stretch;gap:2px;padding:6px;border-radius:24px;background:var(--acx-glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--acx-line);box-shadow:var(--acx-shadow-lg)}
.acx-nav[hidden]{display:none!important}
.acx-brand,.acx-nav-foot{display:none}
.acx-tab{flex:1;min-width:0;border:0;background:transparent;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--acx-text-3);font:600 10.5px/1 Inter,system-ui,sans-serif;letter-spacing:0;cursor:pointer;position:relative;transition:color .2s,background .25s;-webkit-tap-highlight-color:transparent}
.acx-tab-ic{font-size:23px;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.acx-tab-ic svg{stroke-width:1.9}
.acx-tab.active{color:var(--tab-c)}
.acx-tab.active .acx-tab-ic{transform:translateY(-1px) scale(1.06)}
.acx-tab.active .acx-tab-ic svg{stroke-width:2.2}
.acx-tab.active:before{content:"";position:absolute;inset:0;border-radius:18px;background:color-mix(in srgb,var(--tab-c) 13%,transparent);z-index:-1}
.acx-tab[data-tone="coral"]{--tab-c:var(--acx-coral)}.acx-tab[data-tone="blue"]{--tab-c:var(--acx-blue)}.acx-tab[data-tone="violet"]{--tab-c:var(--acx-violet)}.acx-tab[data-tone="amber"]{--tab-c:var(--acx-amber)}.acx-tab[data-tone="pink"]{--tab-c:var(--acx-pink)}
.acx-tab:active{transform:scale(.96)}

html[data-view="desktop"] .app.acx-app{padding-left:var(--acx-side-w)!important}
html[data-view="desktop"] .acx-content.content{max-width:1200px;padding:0 40px 64px}
html[data-view="desktop"] .acx-nav{left:0;top:0;bottom:0;transform:none;width:var(--acx-side-w);max-width:none;height:auto;flex-direction:column;align-items:stretch;gap:4px;padding:22px 14px 16px;border-radius:0;border:0;border-right:1px solid var(--acx-line);box-shadow:none;background:var(--acx-surface)}
html[data-view="desktop"] .acx-brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
html[data-view="desktop"] .acx-brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.3px}
html[data-view="desktop"] .acx-brand small{display:block;font-size:12px;color:var(--acx-text-2);margin-top:1px}
html[data-view="desktop"] .acx-tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:46px;padding:0 14px;font-size:14.5px;font-weight:600;color:var(--acx-text-2);border-radius:14px}
html[data-view="desktop"] .acx-tab-ic{font-size:21px}
html[data-view="desktop"] .acx-tab:hover{background:var(--acx-surface-2);color:var(--acx-text)}
html[data-view="desktop"] .acx-tab.active{color:var(--tab-c);background:color-mix(in srgb,var(--tab-c) 11%,transparent)}
html[data-view="desktop"] .acx-tab.active:before{display:none}
html[data-view="desktop"] .acx-tab.active:after{content:"";position:absolute;left:-14px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--tab-c)}
html[data-view="desktop"] .acx-nav-foot{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.acx-nav-search{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--acx-line);background:var(--acx-surface-2);color:var(--acx-text-2);font:500 13.5px Inter,system-ui,sans-serif;cursor:pointer}
.acx-nav-search kbd{margin-left:auto;font:600 11px Inter,system-ui;padding:2px 7px;border-radius:6px;background:var(--acx-surface);border:1px solid var(--acx-line);color:var(--acx-text-3)}
.acx-nav-profile{display:flex;align-items:center;gap:11px;padding:10px;border-radius:14px;border:0;background:var(--acx-surface-2);color:var(--acx-text);cursor:pointer;text-align:left;font:inherit}
.acx-nav-profile:hover{background:var(--acx-sunken)}
.acx-nav-profile .avatar-btn{margin:0;width:34px;height:34px}
.acx-nav-profile-text{flex:1;min-width:0}
.acx-nav-profile-text b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acx-nav-profile-text small{display:block;font-size:11.5px;color:var(--acx-text-2)}
.acx-nav-profile>.icon{color:var(--acx-text-3);font-size:18px}

.acx-logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;background:conic-gradient(from 210deg,#ff5a36,#ec4899,#7a5cff,#2f7bff,#ff5a36);box-shadow:0 8px 20px -10px rgba(236,72,153,.7);position:relative;overflow:hidden}
.acx-logo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 55%)}
.acx-logo .icon{font-size:22px;position:relative;z-index:1}
.acx-logo .icon svg{stroke-width:2.5}
.acx-logo-lg{width:74px;height:74px;border-radius:22px}
.acx-logo-lg .icon{font-size:42px}

/* ---------- header ---------- */
.acx-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 18px) 0 14px}
.acx-head-text{min-width:0}
.acx-kicker{display:block;font-size:13px;font-weight:600;color:var(--acx-text-2);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acx-title{margin:0;font-size:30px;line-height:1.08;font-weight:800;letter-spacing:-.9px;color:var(--acx-text)}
html[data-view="desktop"] .acx-head{padding-top:34px;padding-bottom:18px}
html[data-view="desktop"] .acx-title{font-size:36px}
.acx-actions{display:flex;align-items:center;gap:8px;flex:none}
.acx-iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--acx-line);background:var(--acx-surface);color:var(--acx-text);display:grid;place-items:center;cursor:pointer;position:relative;box-shadow:var(--acx-shadow);transition:transform .15s}
.acx-iconbtn .icon{font-size:19px}
.acx-iconbtn:active{transform:scale(.92)}
.acx-dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--acx-text-3);box-shadow:0 0 0 2px var(--acx-surface)}
html[data-strava="on"] .acx-dot{background:var(--acx-green)}
html[data-strava="off"] .acx-dot{background:var(--acx-orange)}
html.is-syncing .acx-syncbtn .icon,html.is-syncing .acx-sync-orb .icon{animation:acx-spin 1s linear infinite}
@keyframes acx-spin{to{transform:rotate(360deg)}}
.acx-head .avatar-btn{width:40px;height:40px;margin:0;font-size:14px;background:linear-gradient(135deg,var(--acx-accent),color-mix(in srgb,var(--acx-accent) 55%,#7a5cff));color:#fff;background-size:cover;background-position:center}
.acx-head .avatar-btn.has-photo{color:transparent}
html[data-view="desktop"] .acx-head .avatar-btn,html[data-view="desktop"] .acx-head .acx-iconbtn[data-open-search]{display:none}
.acx-crumb{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--acx-accent);font:600 14px Inter,system-ui;padding:0 0 6px;margin-left:-4px;cursor:pointer}
.acx-crumb .icon{font-size:18px}
.acx-crumb[hidden]{display:none}

/* ---------- sub-navigation ---------- */
.acx-subnav{position:sticky;top:0;z-index:25;display:flex;gap:4px;margin:0 -16px 14px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--acx-bg) 86%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px)}
.acx-subnav::-webkit-scrollbar{display:none}
.acx-subnav{--pad:4px}
.acx-subnav:before{content:"";position:absolute;left:16px;right:16px;top:8px;bottom:8px;border-radius:16px;background:var(--acx-sunken);z-index:-1}
html[data-view="desktop"] .acx-subnav{margin:0 0 18px;padding:8px 0;max-width:620px}
html[data-view="desktop"] .acx-subnav:before{left:0;right:0}
.acx-subpill{position:absolute;left:0;top:12px;bottom:12px;border-radius:12px;background:var(--acx-surface);box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 10px -6px rgba(0,0,0,.2);transition:transform .38s cubic-bezier(.22,1,.36,1),width .38s cubic-bezier(.22,1,.36,1);z-index:0}
:root[data-theme="dark"] .acx-subpill{background:var(--acx-surface-2)}
.acx-subtab{position:relative;z-index:1;flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 14px;margin:4px 0;border:0;background:transparent;border-radius:12px;color:var(--acx-text-2);font:650 13.5px/1 Inter,system-ui,sans-serif;white-space:nowrap;cursor:pointer;transition:color .2s}
.acx-subtab:first-of-type{margin-left:4px}.acx-subtab:last-of-type{margin-right:4px}
.acx-subtab .icon{font-size:17px}
.acx-subtab.active{color:var(--acx-accent)}
.acx-subtab.active .icon svg{stroke-width:2.2}
.acx-subnav.is-collapsed{display:none}
.acx-sub{animation:acx-in .28s cubic-bezier(.22,1,.36,1)}

/* ---------- layout grids ---------- */
.acx-today,.acx-split,.acx-profile{display:block}
html[data-view="desktop"] .acx-today,html[data-view="desktop"] .acx-split,html[data-view="desktop"] .acx-profile{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:28px;align-items:start}
html[data-view="desktop"] .acx-profile{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
html[data-view="desktop"] .acx-col-side{position:sticky;top:12px}
.acx-sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.acx-sec h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px}
.acx-sec-first{margin-top:4px}
html[data-view="desktop"] .acx-col-side>.acx-sec:first-child,html[data-view="desktop"] .acx-col-side>.acx-group-title:first-child{margin-top:0}
.acx-sec-note{font-size:12.5px;color:var(--acx-text-3);font-weight:500}
.acx-link{display:inline-flex;align-items:center;gap:1px;border:0;background:none;color:var(--acx-accent);font:650 13.5px Inter,system-ui;cursor:pointer;padding:4px 0}
.acx-link .icon{font-size:15px}
.acx-eyebrow{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--acx-text-3)}
.acx-eyebrow .icon{font-size:13px}

/* ---------- cards ---------- */
.acx-card{display:block;position:relative;background:var(--acx-surface);border:1px solid var(--acx-line);border-radius:var(--acx-r-lg);padding:16px;box-shadow:var(--acx-shadow);color:var(--acx-text);text-align:left;font:inherit;width:100%}
.acx-card+.acx-card{margin-top:12px}
button.acx-card,article.acx-card[role=button]{cursor:pointer;transition:transform .18s,box-shadow .2s}
button.acx-card:active,article.acx-card[role=button]:active{transform:scale(.985)}
.acx-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.acx-card-head h3{margin:3px 0 0;font-size:16.5px;font-weight:750;letter-spacing:-.3px}
.acx-card-chev{position:absolute;right:14px;top:16px;color:var(--acx-text-3);font-size:18px}
.acx-help{margin:10px 2px 0;font-size:12.5px;line-height:1.5;color:var(--acx-text-2)}
.acx-empty{display:flex;align-items:center;gap:14px}
.acx-empty>div{flex:1;min-width:0}
.acx-empty b{display:block;font-size:15px}
.acx-empty p{margin:2px 0 0;font-size:13px;color:var(--acx-text-2)}
.acx-empty-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--acx-accent) 13%,transparent);color:var(--acx-accent);font-size:22px;flex:none}
.acx-empty-sm{font-size:13.5px;color:var(--acx-text-2);text-align:center;padding:22px}
.acx-pad{padding:4px 16px 16px}

/* ---------- buttons, chips ---------- */
.acx-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:13px;border:0;background:var(--acx-accent);color:#fff;font:700 14px Inter,system-ui;cursor:pointer;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--acx-accent) 80%,transparent);transition:transform .15s,filter .2s;text-decoration:none}
.acx-btn:active{transform:scale(.97)}
.acx-btn:hover{filter:brightness(1.05)}
.acx-btn-ghost{background:color-mix(in srgb,var(--acx-accent) 11%,transparent);color:var(--acx-accent);box-shadow:none}
.acx-btn-light{background:rgba(255,255,255,.22);color:#fff;box-shadow:none;backdrop-filter:blur(6px)}
.acx-btn .icon{font-size:16px}
.acx-actions-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acx-actions-row .acx-btn{flex:1 1 150px}
.acx-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--acx-accent) 12%,transparent);color:var(--acx-accent);font-size:12px;font-weight:700;white-space:nowrap}
.acx-chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.acx-chiprow::-webkit-scrollbar{display:none}
.acx-chipbtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--acx-line-2);background:var(--acx-surface);color:var(--acx-text-2);font:650 13px Inter,system-ui;cursor:pointer;white-space:nowrap}
.acx-chipbtn .icon{font-size:15px}
.acx-chipbtn.active{background:var(--acx-text);border-color:var(--acx-text);color:var(--acx-bg)}
.acx-chipbtn.is-tool{color:var(--acx-accent);border-color:color-mix(in srgb,var(--acx-accent) 35%,transparent);background:color-mix(in srgb,var(--acx-accent) 7%,var(--acx-surface))}
.acx-chip-sep{flex:none;width:1px;background:var(--acx-line-2);margin:6px 2px}

/* ---------- segmented ---------- */
.seg.acx-seg{display:flex;gap:2px;padding:3px;border-radius:13px;background:var(--acx-sunken);margin:0 0 12px;width:100%;max-width:none}
.seg.acx-seg .seg-item{flex:1;height:34px;border-radius:10px;border:0;background:transparent;color:var(--acx-text-2);font:650 13px Inter,system-ui;cursor:pointer;transition:background .2s,color .2s}
.seg.acx-seg .seg-item.active{background:var(--acx-surface);color:var(--acx-text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
:root[data-theme="dark"] .seg.acx-seg .seg-item.active{background:var(--acx-surface-2)}
.seg.acx-seg.acx-seg-sm .seg-item{height:30px;font-size:12.5px}
.acx-pilltabs.sub-tabs{display:flex;gap:6px;padding:0;margin:0 0 12px;background:none;border:0;position:relative;overflow-x:auto;scrollbar-width:none}
.acx-pilltabs .sub-tab-pill{display:none!important}
.acx-pilltabs .sub-tab{flex:none;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--acx-line-2);background:var(--acx-surface);color:var(--acx-text-2);font:650 13px Inter,system-ui;cursor:pointer}
.acx-pilltabs .sub-tab.active{background:var(--acx-accent);border-color:var(--acx-accent);color:#fff}

/* ---------- HARI INI: readiness hero ---------- */
.acx-ready{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:center;padding:18px 40px 18px 18px;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--acx-coral) 14%,transparent),transparent 55%),radial-gradient(120% 140% at 100% 100%,color-mix(in srgb,var(--acx-violet) 12%,transparent),transparent 60%),var(--acx-surface)}
.acx-ready .gauge-wrap{width:112px;height:112px;margin:0}
.acx-ready .gauge-wrap svg{transform:rotate(-90deg)}
.acx-ready .gauge-track{fill:none;stroke:var(--acx-sunken);stroke-width:8}
.acx-ready .gauge-value{fill:none;stroke-width:8;stroke-linecap:round}
.acx-ready .gauge-value.ring-ctl{stroke:var(--acx-blue)}
.acx-ready .gauge-value.ring-atl{stroke:var(--acx-orange)}
.acx-ready .gauge-num{font-size:24px;font-weight:800;letter-spacing:-.6px;animation:none}
.acx-ready-level{display:block;margin:4px 0 2px}
.acx-ready-level .level{background:none;padding:0;font-size:19px;font-weight:800;letter-spacing:-.4px;text-transform:none;border-radius:0}
.acx-ready-level .level.green{color:var(--acx-green)}.acx-ready-level .level.orange{color:var(--acx-orange)}.acx-ready-level .level.red{color:var(--acx-red)}
.acx-ready-advice{margin:0;font-size:13.5px;line-height:1.45;color:var(--acx-text-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.acx-ready-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;font-size:12px;color:var(--acx-text-2)}
.acx-ready-legend span{display:inline-flex;align-items:center;gap:5px}
.acx-ready-legend b{color:var(--acx-text);font-weight:750}
.acx-ready .ring-dot{width:8px;height:8px;border-radius:50%}
.acx-ready .ring-dot.ctl{background:var(--acx-blue)}.acx-ready .ring-dot.atl{background:var(--acx-orange)}

/* ---------- HARI INI: session card ---------- */
#dashBriefing{margin-top:12px}
.acx-session{padding:18px}
.acx-session-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.acx-session h3{margin:8px 0 6px;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.6px}
.acx-session-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;font-weight:600;color:var(--acx-text-2)}
.acx-session-meta span{display:inline-flex;align-items:center;gap:5px}
.acx-session-meta .icon{font-size:15px;color:var(--acx-accent)}
.acx-session-detail{margin:8px 0 0;font-size:13.5px;line-height:1.5;color:var(--acx-text-2)}
.acx-session.is-rest{background:linear-gradient(135deg,color-mix(in srgb,var(--acx-indigo) 10%,var(--acx-surface)),var(--acx-surface))}
.acx-progress{margin-top:14px}
.acx-progress-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--acx-text-2);margin-bottom:6px}
.acx-progress-head b{color:var(--acx-text)}
.acx-progress-track{height:8px;border-radius:99px;background:var(--acx-sunken);overflow:hidden}
.acx-progress-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--acx-accent),color-mix(in srgb,var(--acx-accent) 60%,#ffd166));transition:width .8s cubic-bezier(.22,1,.36,1)}
.acx-notes{display:grid;gap:8px;margin-top:14px}
.acx-note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--acx-surface-2);border:1px solid var(--acx-line)}
.acx-note .icon{font-size:18px;margin-top:1px;color:var(--acx-orange);flex:none}
.acx-note.n-alert .icon{color:var(--acx-red)}.acx-note.n-ok .icon{color:var(--acx-coral)}
.acx-note b{display:block;font-size:13.5px}
.acx-note small{display:block;font-size:12.5px;line-height:1.4;color:var(--acx-text-2);margin-top:1px}
.acx-onboard h3{margin:6px 0 10px}
.acx-steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.acx-steps li{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.acx-steps i{width:24px;height:24px;border-radius:50%;border:2px solid var(--acx-line-2);display:grid;place-items:center;font-style:normal;color:#fff;flex:none}
.acx-steps li.is-done{color:var(--acx-text-2);text-decoration:line-through}
.acx-steps li.is-done i{background:var(--acx-green);border-color:var(--acx-green)}

/* ---------- HARI INI: last activity ---------- */
.acx-last{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:center;padding:12px}
.acx-last-map{width:118px;height:96px;border-radius:14px;overflow:hidden;background:var(--acx-sunken);display:grid;place-items:center;color:var(--acx-text-3)}
.acx-last-map svg{width:100%;height:100%;display:block}
.acx-last-map svg rect{fill:var(--acx-sunken)}
.acx-last-map svg polyline{stroke:var(--acx-coral)}
.acx-last-map.is-empty .icon{font-size:32px}
.acx-last-title{display:block;font-size:16px;font-weight:750;letter-spacing:-.3px;margin:3px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acx-last-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.acx-last-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.acx-last-stats>div:nth-child(4){display:none}.acx-last{grid-template-columns:96px minmax(0,1fr);gap:12px}.acx-last-map{width:96px;height:84px}}
.acx-last-stats small{display:block;font-size:11px;color:var(--acx-text-3);font-weight:600}
.acx-last-stats b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.acx-last-stats b span{font-size:11px;font-weight:600;color:var(--acx-text-2);margin-left:2px}

/* ---------- tiles ---------- */
.acx-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
html[data-view="desktop"] .acx-today .acx-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.acx-tile{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:13px 13px 11px;border-radius:var(--acx-r);border:1px solid var(--acx-line);background:var(--acx-surface);box-shadow:var(--acx-shadow);color:var(--acx-text);text-align:left;font:inherit;cursor:pointer;min-width:0;transition:transform .15s}
.acx-tile:active{transform:scale(.97)}
.acx-tile-top{display:flex;align-items:center;gap:6px;min-width:0}
.acx-tile-ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--tone) 14%,transparent);color:var(--tone);font-size:15px;flex:none}
.acx-tile-ic svg{stroke-width:2.2}
.acx-tile-name{font-size:12.5px;font-weight:700;color:var(--acx-text-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acx-delta{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:99px;white-space:nowrap}
.acx-delta.up{color:var(--acx-green);background:color-mix(in srgb,var(--acx-green) 12%,transparent)}
.acx-delta.down{color:var(--acx-red);background:color-mix(in srgb,var(--acx-red) 11%,transparent)}
.acx-delta.flat{color:var(--acx-text-2);background:var(--acx-sunken)}
.acx-tile-val{display:flex;align-items:baseline;gap:4px;margin-top:10px;min-width:0}
.acx-tile-val b{font-size:25px;font-weight:800;letter-spacing:-.8px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.acx-tile-val span{font-size:12.5px;font-weight:650;color:var(--acx-text-2)}
.acx-tile-sub{font-size:11.5px;color:var(--acx-text-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acx-tile .hcard-spark{height:22px;margin-top:8px}
.acx-tile-extra{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.acx-tile-extra button{flex:1 1 140px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:12px;border:1px dashed var(--acx-line-2);background:transparent;color:var(--acx-text-2);font:600 12.5px Inter,system-ui;cursor:pointer}
.acx-tile-extra .icon{font-size:15px;color:var(--acx-accent)}
.acx-tiles-2{grid-template-columns:repeat(2,minmax(0,1fr))!important;margin-bottom:12px}
.acx-tiles-2 .acx-tile{cursor:default}

/* ---------- chart card ---------- */
.acx-chart-card{margin-top:12px;padding:14px 14px 8px}
.acx-chart-card .chart-card{padding:0!important;margin:0!important;background:none!important;border:0!important;box-shadow:none!important}
.acx-chart-card .seg.acx-seg{margin-bottom:10px}

/* ---------- HARI INI: week card ---------- */
.acx-week{padding:14px}
.acx-weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.acx-day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--acx-text-2);font:inherit}
.acx-day small{font-size:11px;font-weight:700;color:var(--acx-text-3)}
.acx-day i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:750;background:var(--acx-sunken);color:var(--acx-text-2);border:2px solid transparent}
.acx-day em{font-style:normal;font-size:10px;font-weight:650;min-height:12px;color:var(--acx-text-3);white-space:nowrap}
.acx-day.st-done i{background:var(--acx-coral);color:#fff}
.acx-day.st-done i .icon{font-size:17px}
.acx-day.st-done i .icon svg{stroke-width:2.6}
.acx-day.st-plan i{background:transparent;border:2px dashed color-mix(in srgb,var(--acx-blue) 60%,transparent);color:var(--acx-blue)}
.acx-day.st-miss i{background:transparent;border:2px solid color-mix(in srgb,var(--acx-red) 40%,transparent);color:var(--acx-red)}
.acx-day.is-today small{color:var(--acx-coral)}
.acx-day.is-today i{box-shadow:0 0 0 3px color-mix(in srgb,var(--acx-coral) 25%,transparent)}
.acx-rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--acx-line)}
.acx-ring{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
.acx-ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.acx-ring-track{fill:none;stroke:var(--acx-sunken);stroke-width:6}
.acx-ring-val{fill:none;stroke:var(--tone);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray 1s cubic-bezier(.22,1,.36,1)}
.acx-ring b{position:absolute;top:0;height:64px;display:grid;place-items:center;font-size:14px;font-weight:800;letter-spacing:-.3px}
.acx-ring small{margin-top:6px;font-size:12px;font-weight:700}
.acx-ring span{font-size:11px;color:var(--acx-text-3);font-variant-numeric:tabular-nums}
.acx-week-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--acx-text-2)}
.acx-week-foot span{display:inline-flex;align-items:center;gap:5px}
.acx-week-foot .icon{color:var(--acx-coral);font-size:15px}

/* ---------- insights ---------- */
.acx-insights{display:grid;gap:8px}
.acx-insights .ins-row{border:1px solid var(--acx-line);background:var(--acx-surface);border-radius:var(--acx-r);box-shadow:var(--acx-shadow);padding:13px 12px;align-items:center}
.acx-insights .ins-row+.ins-row:before{display:none}
.acx-insights .ins-icon{width:34px;height:34px;border-radius:11px}
.acx-insights .ins-text b{font-size:14px}
.acx-insights .ins-text small{font-size:12.5px;line-height:1.45;color:var(--acx-text-2)}

/* ---------- grouped list rows ---------- */
.acx-list{background:var(--acx-surface);border:1px solid var(--acx-line);border-radius:var(--acx-r);box-shadow:var(--acx-shadow);overflow:hidden}
.acx-list:empty{display:none}
.acx-list+.acx-list{margin-top:12px}
.acx-row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;border:0;background:transparent;color:var(--acx-text);text-align:left;font:inherit;cursor:pointer;position:relative;list-style:none}
.acx-row::-webkit-details-marker{display:none}
.acx-row+.acx-row:before,.acx-row-details+.acx-row:before,.acx-row+.acx-row-details>.acx-row:before,.acx-row-details+.acx-row-details>.acx-row:before{content:"";position:absolute;left:60px;right:0;top:0;height:1px;background:var(--acx-line)}
.acx-row:hover{background:var(--acx-surface-2)}
.acx-row:active{background:var(--acx-sunken)}
.acx-row.as-static{cursor:default}
.acx-row.as-static:hover{background:transparent}
.acx-row-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--tone) 14%,transparent);color:var(--tone);font-size:18px}
.acx-row-ic svg{stroke-width:2.1}
.acx-row-text{flex:1;min-width:0}
.acx-row-text b{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.2px}
.acx-row-text small{display:block;font-size:12.5px;line-height:1.35;color:var(--acx-text-2);margin-top:1px}
.acx-row-val{font-size:13px;font-weight:700;color:var(--acx-text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.acx-row-chev{color:var(--acx-text-3);font-size:17px;flex:none}
.acx-row-details[open]>.acx-row .acx-row-chev{transform:rotate(90deg)}
.acx-row-chev{transition:transform .2s}
.acx-row.is-danger .acx-row-ic{--tone:var(--acx-red)}
.acx-row.is-busy{opacity:.6;pointer-events:none}
.acx-pad-list{padding-bottom:12px}
.acx-pad-list .seg.acx-seg{margin:0 14px 8px;width:auto!important;max-width:none!important;display:flex!important}
.acx-tools{margin-bottom:4px}
.acx-tools-row{margin:12px 0}
.acx-toggle input{position:absolute;opacity:0;pointer-events:none}
.acx-switch{width:50px;height:30px;border-radius:99px;background:var(--acx-line-2);position:relative;flex:none;transition:background .25s}
.acx-switch:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.34,1.4,.64,1)}
.acx-toggle input:checked+.acx-switch{background:var(--acx-green)}
.acx-toggle input:checked+.acx-switch:after{transform:translateX(20px)}
.acx-group-title{margin:26px 4px 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--acx-text-3)}
.acx-sub-title{margin:14px 0 6px;font-size:13px;font-weight:750}

/* ---------- KPIs ---------- */
.acx-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:4px}
html[data-view="desktop"] .acx-kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}
.acx-kpis-3{grid-template-columns:repeat(3,minmax(0,1fr))!important;margin:12px 0}
.acx-kpi{display:flex;flex-direction:column;gap:2px;padding:13px 14px;border-radius:var(--acx-r);border:1px solid var(--acx-line);background:linear-gradient(160deg,color-mix(in srgb,var(--tone) 10%,var(--acx-surface)),var(--acx-surface) 70%);box-shadow:var(--acx-shadow);text-align:left;font:inherit;color:var(--acx-text);min-width:0}
button.acx-kpi{cursor:pointer}
.acx-kpi small{font-size:11.5px;font-weight:700;color:var(--acx-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acx-kpi b{font-size:27px;font-weight:800;letter-spacing:-.8px;color:var(--tone);font-variant-numeric:tabular-nums;line-height:1.1}
.acx-kpi b span{font-size:12px;font-weight:650;color:var(--acx-text-2);margin-left:3px;letter-spacing:0}
.acx-kpi em{font-style:normal;font-size:11.5px;font-weight:650;color:var(--acx-text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acx-kpi em.up{color:var(--acx-green)}.acx-kpi em.down{color:var(--acx-red)}

/* ---------- performa: analysis banner ---------- */
.acx-analysis{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:12px;row-gap:8px;align-items:center;width:100%;margin:0 0 6px;padding:12px 14px;border-radius:var(--acx-r);border:1px solid color-mix(in srgb,var(--acx-violet) 25%,var(--acx-line));background:linear-gradient(120deg,color-mix(in srgb,var(--acx-violet) 12%,var(--acx-surface)),color-mix(in srgb,var(--acx-pink) 8%,var(--acx-surface)));color:var(--acx-text);text-align:left;font:inherit;cursor:pointer}
.acx-analysis-ic{grid-row:1/3;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--acx-violet);color:#fff;font-size:19px}
.acx-analysis-text b{display:block;font-size:14px;font-weight:750}
.acx-analysis-text small{display:block;font-size:12px;color:var(--acx-text-2);margin-top:1px}
.acx-analysis .acx-row-chev{grid-row:1/3;grid-column:3}
.acx-analysis-bar{grid-column:2;height:5px;border-radius:99px;background:color-mix(in srgb,var(--acx-violet) 16%,transparent);overflow:hidden}
.acx-analysis-bar i{display:block;height:100%;background:var(--acx-violet);border-radius:inherit}
.acx-analysis.is-full .acx-analysis-bar{display:none}
.acx-analysis.is-full{grid-template-rows:auto}

/* ---------- metric grids (profil, rekor, kepatuhan) ---------- */
.acx-metric-grid.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
html[data-view="desktop"] #recordMetrics.acx-metric-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.acx-metric-grid .metric{background:var(--acx-surface-2);border:1px solid var(--acx-line);border-radius:16px;padding:12px;box-shadow:none;min-width:0}
#recordMetrics .metric{background:var(--acx-surface);box-shadow:var(--acx-shadow)}
.acx-metric-grid .metric .eyebrow{font-size:10.5px;letter-spacing:.04em;color:var(--acx-text-3);display:flex;align-items:center;gap:5px}
.acx-metric-grid .metric b{display:block;font-size:20px;font-weight:800;letter-spacing:-.5px;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acx-metric-grid .metric small{display:block;font-size:11.5px;color:var(--acx-text-2);margin-top:2px}
.acx-metric-grid .metric-icon .icon{color:var(--acx-accent)}

/* ---------- filters (riwayat, top 10, rute) ---------- */
.acx-filterbar{display:grid;gap:10px;margin-bottom:14px}
.acx-search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;background:var(--acx-surface);border:1px solid var(--acx-line);box-shadow:var(--acx-shadow)}
.acx-search .icon{color:var(--acx-text-3);font-size:18px}
.acx-search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:500 15px Inter,system-ui;color:var(--acx-text)}
.acx-filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.acx-search-row{display:flex;gap:8px;align-items:stretch}.acx-search-row .acx-search{flex:1;min-width:0}.acx-search-row .acx-viewswitch{height:44px}
.acx-filter-3{display:grid;grid-template-columns:1fr 1fr 1fr}.acx-filter-3 .acx-select{padding:5px 10px}.acx-filter-3 input[type=date]{font-size:12.5px}
.acx-select{display:flex;flex-direction:column;justify-content:center;gap:1px;flex:1 1 120px;min-width:0;padding:5px 12px;border-radius:12px;background:var(--acx-surface);border:1px solid var(--acx-line);font-size:10.5px;font-weight:700;color:var(--acx-text-3);text-transform:uppercase;letter-spacing:.04em}
.acx-select select,.acx-select input{border:0;background:transparent;outline:0;padding:0;margin:0;font:600 13.5px Inter,system-ui;color:var(--acx-text);text-transform:none;letter-spacing:0;min-width:0;width:100%;height:22px}
.acx-select-sm{flex:none;min-width:120px}
.acx-card .acx-filter-row{margin-bottom:12px}
.acx-card .acx-select{background:var(--acx-surface-2)}
.acx-viewswitch.view-switch{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--acx-sunken);border:0;margin:0;flex:none}
.acx-viewswitch button{width:40px;border:0;border-radius:9px;background:transparent;color:var(--acx-text-2);display:grid;place-items:center;cursor:pointer}
.acx-viewswitch button .icon{font-size:17px}
.acx-viewswitch button.active{background:var(--acx-surface);color:var(--acx-text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.acx-filter-grid.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 10px}
html[data-view="desktop"] .acx-filter-grid.filters{grid-template-columns:repeat(5,minmax(0,1fr))}
.acx-filter-grid label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--acx-text-3);padding:6px 10px;border-radius:12px;background:var(--acx-surface-2);border:1px solid var(--acx-line)}
.acx-filter-grid select{border:0;background:transparent;font:600 13px Inter,system-ui;color:var(--acx-text);padding:0;outline:0;text-transform:none;letter-spacing:0}
.route-traffic-note{font-size:11.5px;margin:0 0 10px}

/* ---------- training sub pages ---------- */
.heatmap-panel .heatmap-map{height:340px;border-radius:16px;overflow:hidden;margin-top:4px}
html[data-view="desktop"] .heatmap-panel .heatmap-map{height:460px}
.acx-cal .calendar-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.acx-cal .calendar-nav b{font-size:17px;font-weight:800;letter-spacing:-.3px}
.acx-cal .cal-nav-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--acx-line);background:var(--acx-surface-2);color:var(--acx-text);display:grid;place-items:center;cursor:pointer;font-size:18px}
html[data-view="desktop"] .acx-sub[data-sub-view="calendar"]{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
html[data-view="desktop"] .acx-sub[data-sub-view="calendar"][hidden]{display:none}
html[data-view="desktop"] #calStreakBox .acx-kpis-3{grid-template-columns:1fr!important;margin-top:0}
html[data-view="desktop"] #calStreakBox .acx-kpi{flex-direction:row;align-items:baseline;justify-content:space-between}
#complianceCard{scroll-margin-top:70px}
#top10Card,#segmentsCard{scroll-margin-top:70px}
.acx-target{margin-bottom:12px}
.acx-target:last-child{margin-bottom:0}
.acx-target .target-row-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.acx-target .target-row-head span{color:var(--acx-text-2);font-variant-numeric:tabular-nums}
.acx-target .target-track{height:8px;border-radius:99px;background:var(--acx-sunken);overflow:hidden}
.acx-target .target-fill{height:100%;border-radius:inherit;background:var(--tone)}

/* ---------- garage & detail hosts ---------- */
.acx-host{min-height:40px}
.acx-detail-head{display:flex;align-items:flex-start;gap:14px;padding:6px 0 16px}
.acx-detail-head .acx-title{font-size:26px}
html[data-view="desktop"] .acx-detail-head .acx-title{font-size:32px}
.acx-detail-head p{margin:5px 0 0;font-size:14px;line-height:1.45;color:var(--acx-text-2)}

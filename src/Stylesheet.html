.route-reco-chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 2px}
.route-reco-note{font-size:11px!important;color:var(--muted)!important;margin-top:6px!important}
.route-reco-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.route-reco-actions .btn{flex:1 1 auto;min-width:120px;text-align:center;text-decoration:none;font-size:12px;padding:9px 10px}
.detail-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}
.detail-metric{background:var(--bg);padding:11px;border-radius:10px}
.detail-metric small,.detail-metric b{display:block}
.detail-metric small{color:var(--muted);font-size:11px}
.detail-metric b{font-size:15px;margin-top:4px}
.detail-chart{height:150px;margin-top:14px}.detail-section{margin-top:20px}.segment-toggle{width:100%;margin-top:8px;border:0;background:var(--bg);color:var(--ink);font-weight:600;padding:10px;border-radius:12px;cursor:pointer}.segment-extra[hidden]{display:none}
.day-activity-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.day-activity-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.day-activity-row:active{transform:scale(.98)}
.day-activity-sport{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink2);background:var(--bg);border-radius:6px;padding:4px 6px;white-space:nowrap}
.day-activity-main{flex:1;min-width:0}
.day-activity-main b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-activity-main small{color:var(--muted);font-size:11px}
.day-activity-chevron{color:var(--muted);font-size:16px}
.chart-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chart-summary span{background:var(--bg);border-radius:8px;padding:5px 7px;font-size:11px;color:var(--muted)}.chart-summary b{color:var(--ink)}
.photo-setting{display:flex;align-items:center;gap:14px}.photo-setting p{margin:0 0 8px;font-size:12px}.photo-setting input{max-width:220px;font-size:11px}.photo-setting .link-btn{margin-top:7px;padding:0}

/* ---------- lihat selengkapnya / halaman detail generik ---------- */
.panel-head{flex-wrap:wrap}
.panel-more{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;padding:2px 0}
.panel-more:hover{color:var(--accent)}
.detail-page-hero{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.detail-back-btn{flex:none}
.detail-page-hero>div{flex:1;min-width:200px}
#detailPageBody .panel{margin-bottom:12px}
#detailPageBody .panel:last-child{margin-bottom:0}
.day-status-list{display:grid;gap:6px;margin-top:4px;max-height:420px;overflow-y:auto}
.day-status-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--bg);font-size:12px;border-left:4px solid var(--line)}
.day-status-row b{font-size:12px}
.day-status-row.is-active{border-left-color:var(--green)}
.day-status-row.is-rest{color:var(--muted)}
.day-status-row.is-today{border-left-color:var(--blue)}
.day-status-row.is-active.lv1{border-left-color:var(--ios-teal)}
.day-status-row.is-active.lv3{background:color-mix(in srgb,var(--ios-green) 12%,var(--bg))}
.calendar-day{position:relative}
.calendar-day .plan-dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--ios-blue)}
.calendar-day.planned{outline:1.5px solid color-mix(in srgb,var(--ios-blue) 55%,transparent);outline-offset:-1.5px}
/* ---------- sketsa sepeda interaktif (garasi) ---------- */
.sk-wrap{perspective:900px;margin:6px 0 4px}
.sk-stage{transition:transform .35s ease;transform-style:preserve-3d;touch-action:pan-y;cursor:grab}
.sk-stage.tilting{transition:none;cursor:grabbing}
.sk-svg{width:100%;height:auto;display:block}
.sk-hot{cursor:pointer;stroke:#fff;stroke-width:3;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.sk-hot.bad{animation:skPulse 1.2s ease-in-out infinite}
@keyframes skPulse{0%,100%{opacity:1}50%{opacity:.4}}
.sk-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
.sk-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}
.tab-loading{position:relative;min-height:140px}
.tab-loading::after{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(90deg,var(--line) 25%,var(--bg) 37%,var(--line) 63%);background-size:400% 100%;animation:skel-shimmer .85s ease infinite;opacity:.75;z-index:5;pointer-events:none}
.detail-note{background:var(--bg);border-radius:11px;padding:11px 12px;color:var(--muted);font-size:12px;line-height:1.5;margin-top:12px}
.predict-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.predict-grid{grid-template-columns:repeat(4,1fr)}}
.predict-card{background:var(--bg);border-radius:14px;padding:13px 10px;text-align:center}
.predict-card b{display:block;font-size:19px;font-weight:800;letter-spacing:-.3px;margin-top:5px;font-variant-numeric:tabular-nums}
.predict-card small{color:var(--muted);font-size:11px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:25px;z-index:40;transition:.2s;font-size:12px}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- bottom nav (mobile-first, always on, fills the full width) ---------- */
.sidebar{display:none!important}
.bottom-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:fixed;z-index:30;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100vw - 24px);max-width:420px;height:60px;padding-bottom:0;border-radius:26px;background:var(--glass-bg);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);align-items:stretch;box-shadow:var(--glass-shadow)}
.bottom-nav button{width:100%;min-width:0;border:0;background:transparent;color:var(--muted);font:600 9.5px -apple-system,system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .25s var(--ease-spring),color .2s ease;border-radius:20px}
.bottom-nav button span{font-size:19px;transition:transform .25s var(--ease-spring)}
.bottom-nav button:active span{transform:scale(.82)}
.bottom-nav button.active{color:var(--accent);font-weight:700}
.bottom-nav button.active span{transform:translateY(-1px) scale(1.08)}
.bottom-nav .plan-shortcut span{color:var(--ink)}
.content{padding-bottom:100px}

@media(min-width:1000px){
  .sidebar{display:flex!important}
  .bottom-nav{display:none!important}
  .content{padding:26px 34px 40px}
  .content .topbar{margin-left:-34px;margin-right:-34px;padding-left:34px;padding-right:34px}
  .topbar h1{font-size:26px}
  .charts-grid{grid-template-columns:1fr 1fr}
  .metric-grid{grid-template-columns:repeat(4,1fr)}
  .activity-feed{grid-template-columns:repeat(2,1fr)}
  .settings-grid{grid-template-columns:1fr 1.1fr}
  .dashboard-grid{grid-template-columns:1fr 1.2fr}
  .dashboard-summary-grid{grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:520px){
  .profile-header{padding:13px;margin-bottom:10px}.profile-avatar{width:42px;height:42px;font-size:16px}.profile-info h2{font-size:17px}.profile-info p{font-size:11px}.profile-stats-row{display:none}.plan-hero{padding:18px}.plan-hero h2{font-size:21px}.plan-hero-top{gap:8px}.readiness-chip{font-size:11px;padding:5px 8px}.date-presets{width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.date-presets button{white-space:nowrap}.filters{align-items:stretch}
  .metric-grid{grid-template-columns:repeat(2,1fr)}
  .zone-grid{grid-template-columns:repeat(2,1fr)}
  .filters{grid-template-columns:1fr 1fr;display:grid}
  .filters .btn{grid-column:1/-1}
  .profile-stats-row{gap:16px}
}
.app-footer{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:18px 16px 90px;color:var(--muted);font-size:11px;text-align:center}
.app-footer b{color:var(--ink2)}
.footer-ig{display:inline-flex;align-items:center;gap:5px;color:var(--muted);text-decoration:none;font-weight:700}
.footer-ig:hover{color:var(--ink)}
@media(min-width:900px){.app-footer{padding-bottom:18px}}

/* ---------- floating feedback + sync buttons: legacy standalone rules removed, unified in .fab-stack below ---------- */
.sync-popup-status{margin:2px 0 14px}
.sync-popup-actions{display:flex;flex-direction:column;gap:8px}
.sync-popup-actions .theme-toggle{display:flex;align-items:center;justify-content:center;gap:7px}
.popup-overlay{position:fixed;inset:0;z-index:70;background:rgba(20,20,30,.5);display:flex;align-items:flex-end;justify-content:center;padding:0}
.popup-overlay[hidden]{display:none}
.popup-box{position:relative;background:var(--white);border-radius:24px 24px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.08);padding:26px 22px;max-width:360px;width:100%;max-height:86vh;overflow-y:auto}
.popup-overlay:not([hidden]) .popup-box{animation:sheet-up .28s cubic-bezier(.2,.8,.2,1)}
.popup-box .close{position:absolute;top:10px;right:12px;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}

/* ---------- desktop: modal/popup back to centered dialog, no sheet handle ---------- */
@media(min-width:1000px){
  .modal{align-items:center;padding:14px}
  .detail-box{border-radius:var(--radius);max-height:90vh}
  .modal.show .detail-box{animation:modal-fade .18s ease}
  .sheet-handle{display:none}
  .popup-overlay{align-items:center;padding:20px}
  .popup-box{border-radius:var(--radius)}
  .popup-overlay:not([hidden]) .popup-box{animation:modal-fade .18s ease}
}

/* ---------- skeleton loading (fast, semua beranimasi) ---------- */
.loading-skeleton{max-width:640px;margin:14px auto 0;padding:0 2px}
.skel{background:linear-gradient(90deg,var(--line) 25%,var(--bg) 37%,var(--line) 63%);background-size:400% 100%;animation:skel-shimmer .85s ease infinite;border-radius:14px}
@keyframes skel-shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.skel-profile{height:74px;margin-bottom:14px;border-radius:16px}
.skel-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.skel-metric{height:64px}
.skel-panel{height:130px;margin-bottom:12px}
@media(min-width:1000px){.skel-grid{grid-template-columns:repeat(4,1fr)}}

/* ---------- pull-to-refresh (mobile only) ---------- */
.ptr-indicator{display:flex;align-items:center;justify-content:center;gap:7px;height:0;overflow:hidden;color:var(--muted);font-size:11px;font-weight:700}
.ptr-indicator.ready{color:var(--ink)}
.ptr-spinner{width:13px;height:13px;flex:none;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:btnspin .7s linear infinite;opacity:0}
.ptr-indicator.ready .ptr-spinner,.ptr-indicator.loading .ptr-spinner{opacity:1}
@media(min-width:1000px){.ptr-indicator{display:none!important}}

/* details/summary marker cleanup (was dashboard-only, now global) */
details.panel summary{list-style:none;cursor:pointer}
details.panel summary::-webkit-details-marker{display:none}

/* =======================================================================
   APPLE HEALTH UI OVERHAUL — native iOS app feel (mobile-first)
   ======================================================================= */
:root{
  --ios-bg:#f2f2f7; --ios-card:#ffffff; --ios-sep:rgba(60,60,67,.14);
  --ios-label:#000; --ios-label2:rgba(60,60,67,.6); --ios-label3:rgba(60,60,67,.3);
  --ios-fill:rgba(118,118,128,.12); --ios-fill2:rgba(118,118,128,.08);
  --ios-pink:#ff2d55; --ios-red:#ff3b30; --ios-orange:#ff9500; --ios-yellow:#ffcc00;
  --ios-green:#34c759; --ios-teal:#30b0c7; --ios-blue:#007aff; --ios-indigo:#5856d6; --ios-purple:#af52de;
  --ios-radius:14px; --ios-radius-lg:18px;
  --tabbar-h:calc(52px + env(safe-area-inset-bottom,0px));
  --shell-w:480px;
  --canvas:var(--ios-bg); --bg:var(--ios-fill); --white:var(--ios-card);
  --ink:var(--ios-label); --ink2:rgba(60,60,67,.75); --muted:var(--ios-label2); --line:var(--ios-sep);
  --accent:var(--ios-pink); --accent-2:#ff375f; --accent-light:rgba(255,45,85,.12);
  --blue:var(--ios-blue); --green:var(--ios-green); --red:var(--ios-red); --orange:var(--ios-orange);
  --card-shadow:0 1px 2px rgba(0,0,0,.05); --panel-shadow:0 1px 2px rgba(0,0,0,.05);
  --card-shadow-hover:0 2px 8px rgba(0,0,0,.08);
  --card-radius:var(--ios-radius-lg);
}
:root[data-theme="dark"]{
  --ios-bg:#000; --ios-card:#1c1c1e; --ios-sep:rgba(84,84,88,.5);
  --ios-label:#fff; --ios-label2:rgba(235,235,245,.6); --ios-label3:rgba(235,235,245,.3);
  --ios-fill:rgba(118,118,128,.24); --ios-fill2:rgba(118,118,128,.16);
  --ios-blue:#0a84ff; --ios-green:#30d158; --ios-orange:#ff9f0a; --ios-red:#ff453a; --ios-pink:#ff375f; --ios-teal:#40c8e0; --ios-indigo:#5e5ce6; --ios-purple:#bf5af2;
  --ink2:rgba(235,235,245,.75);
  --card-shadow:none; --panel-shadow:none; --card-shadow-hover:none;
}
html,body{background:var(--ios-bg)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;letter-spacing:-.01em;color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}

/* ---------- app shell: a phone column, centered on desktop ---------- */
.app{display:block;min-height:100vh;min-height:100dvh;min-height:var(--app-vh);background:var(--ios-bg)}
.sidebar{display:none!important}
.content{width:100%;max-width:var(--shell-w);margin:0 auto;padding:0 16px calc(var(--tabbar-h) + 26px);flex:none}
@media(min-width:900px){
  body{background:#e9e9ef}
  :root[data-theme="dark"] body{background:#0a0a0c}
  .app{max-width:var(--shell-w);margin:0 auto;min-height:100dvh;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 30px 70px -30px rgba(0,0,0,.35)}
}
.hidden-filters{display:none!important}
.page>*{margin-top:0}
.page>*+*{margin-top:0}

/* ---------- large title header (Apple Health "Summary") ---------- */
.ios-head{padding:calc(env(safe-area-inset-top,0px) + 12px) 0 6px;position:relative}
.ios-head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.ios-head-text{min-width:0}
.ios-kicker{display:block;font-size:13px;font-weight:600;color:var(--ios-label2);text-transform:none;letter-spacing:0;margin-bottom:1px}
.ios-title{margin:0;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.9px;color:var(--ink)}
.ios-large-head{padding:6px 0 10px}
.ios-large-head .ios-title{font-size:28px;letter-spacing:-.7px}
.ios-large-head p{margin:6px 0 0;font-size:14px;line-height:1.4;color:var(--ios-label2)}
.avatar-btn{width:34px;height:34px;border-radius:50%;flex:none;font-size:14px;font-weight:700;background:var(--ios-fill);color:var(--ios-label2);border:0;display:grid;place-items:center;margin-bottom:6px}
.avatar-btn.has-photo{color:transparent}
.avatar-btn.active{box-shadow:0 0 0 2px var(--ios-bg),0 0 0 4px var(--accent)}

/* ---------- inner nav bar (push pages) ---------- */
.ios-nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;height:44px;margin:0 -16px 4px;padding:env(safe-area-inset-top,0px) 10px 0;background:color-mix(in srgb,var(--ios-bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent}
.ios-nav.stuck{border-bottom-color:var(--ios-sep)}
.ios-back,.ios-done{display:inline-flex;align-items:center;gap:1px;border:0;background:transparent;color:var(--ios-blue);font:inherit;font-size:16px;font-weight:500;cursor:pointer;padding:6px 4px;min-width:84px}
.ios-back .icon{font-size:19px;margin-right:-1px}
.ios-done{justify-content:flex-end;font-weight:600}
.ios-nav-title{flex:1;text-align:center;font-size:16px;font-weight:600;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ios-nav-spacer{min-width:84px}

/* ---------- segmented control ---------- */
.seg{display:flex;gap:2px;background:var(--ios-fill2);border-radius:9px;padding:2px;margin:12px 0 2px;position:relative}
.seg-item{flex:1;min-width:0;border:0;background:transparent;border-radius:7px;padding:6px 4px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s ease,box-shadow .2s ease}
.seg-item.active{background:var(--ios-card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg-item.active{background:#636366;box-shadow:none}

/* ---------- section header ---------- */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 9px;padding:0 2px}
.sec-head h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.5px}
.sec-note{font-size:12.5px;color:var(--ios-label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-badge{display:block;margin-top:3px;font-size:11.5px;font-weight:600;color:var(--ios-label2)}
.sync-badge.connected{color:var(--ios-green)}.sync-badge.disconnected{color:var(--ios-orange)}
.link-btn{background:none;border:0;color:var(--ios-blue);font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;padding:0}

/* ---------- collapsible dashboard sections (jarang dicek, disembunyikan default) ---------- */
.dash-collapsible{margin:26px 0 0}
.dash-collapsible summary.sec-head{margin:0 0 9px;list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dash-collapsible summary.sec-head::-webkit-details-marker{display:none}
.dash-collapsible summary.sec-head::after{content:'⌄';font-size:17px;font-weight:700;color:var(--ios-label3);transition:transform .25s var(--ease-spring,ease);flex:none;margin-left:8px}
.dash-collapsible[open] summary.sec-head::after{transform:rotate(180deg)}
.dash-collapsible .sec-head-title{display:flex;align-items:baseline;gap:10px;min-width:0}
.dash-collapsible[open] .group-list,.dash-collapsible[open] .card{animation:dashCollapseIn .3s var(--ease-spring,ease)}
.dash-collapsible-link{display:flex;justify-content:flex-end;margin:0 0 9px}
@keyframes dashCollapseIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* ---------- generic card ---------- */
.card,.panel{background:var(--ios-card);border-radius:var(--ios-radius-lg);padding:16px;box-shadow:var(--card-shadow);margin:0}
.panel+.panel,.card+.card{margin-top:12px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.panel-head h3,.panel h3{font-size:17px;font-weight:700;letter-spacing:-.35px;margin:1px 0 0}
.eyebrow{display:block;font-size:12.5px;font-weight:600;color:var(--ios-label2);letter-spacing:0;text-transform:none;margin-bottom:1px}
.eyebrow::first-letter{text-transform:uppercase}

/* ---------- Health "pinned" metric cards ---------- */
.hcard-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.hcard{display:block;width:100%;text-align:left;background:var(--ios-card);border:0;border-radius:var(--ios-radius-lg);padding:13px 14px 14px;box-shadow:var(--card-shadow);cursor:pointer;font:inherit;color:var(--ink);min-width:0;position:relative;overflow:hidden}
.hcard-top{display:flex;align-items:center;gap:6px;min-width:0}
.hcard-top .icon{font-size:14px;flex:none}
.hcard-name{font-size:13.5px;font-weight:600;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hcard-time{margin-left:auto;font-size:11.5px;color:var(--ios-label3);flex:none}
.hcard-val{display:flex;align-items:baseline;gap:4px;margin-top:10px;flex-wrap:wrap}
.hcard-val b{font-size:27px;font-weight:700;letter-spacing:-.9px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hcard-val span{font-size:13px;font-weight:600;color:var(--ios-label2)}
.hcard-sub{display:block;margin-top:5px;font-size:11.5px;color:var(--ios-label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hcard-spark{display:block;width:100%;height:26px;margin-top:9px}
.hcard-spark rect{rx:1.2}

/* ---------- grouped inset list (Apple Health "Browse") ---------- */
.group-list{background:var(--ios-card);border-radius:var(--ios-radius-lg);overflow:hidden;box-shadow:var(--card-shadow)}
.group-list+.sec-head{margin-top:26px}
.glist-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:11px 14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);position:relative}
.glist-row+.glist-row:before{content:"";position:absolute;left:52px;right:0;top:0;height:.5px;background:var(--ios-sep)}
.glist-row:active{background:var(--ios-fill2)}
.glist-icon{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff;background:var(--ios-blue)}
.glist-icon .icon{font-size:16px}
.glist-icon .icon svg{stroke-width:2.1}
.glist-text{flex:1;min-width:0}
.glist-text b{display:block;font-size:15.5px;font-weight:500;letter-spacing:-.25px;line-height:1.25}
.glist-text small{display:block;font-size:12.5px;color:var(--ios-label2);line-height:1.3;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glist-chev{color:var(--ios-label3);font-size:15px;flex:none}
.glist-chev svg{stroke-width:2.6}
.glist-value{font-size:14px;color:var(--ios-label2);flex:none;font-variant-numeric:tabular-nums}
.glist-row.as-toggle{cursor:default}
.glist-row.as-toggle:active{background:transparent}

/* trend rows */
.trend-row .glist-icon{border-radius:50%}
.trend-delta{font-size:13px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.trend-delta.up{color:var(--ios-green)}
.trend-delta.down{color:var(--ios-red)}
.trend-delta.flat{color:var(--ios-label2)}

/* ---------- highlights scroller ---------- */
.hl-scroller{display:flex;gap:11px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.hl-scroller::-webkit-scrollbar{display:none}
.hl-card{flex:0 0 74%;max-width:280px;scroll-snap-align:start;background:var(--ios-card);border-radius:var(--ios-radius-lg);padding:14px;box-shadow:var(--card-shadow);cursor:pointer;min-width:0}
.hl-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hl-top b{font-size:14px;font-weight:600;letter-spacing:-.2px}
.hl-icon{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;flex:none}
.hl-icon .icon{font-size:14px}
.hl-body .insight{background:transparent;padding:0}
.hl-body .insight:before{display:none}
.hl-body .insight b{font-size:15px}
.hl-body .insight p{font-size:12.5px;line-height:1.35;margin:3px 0 0}
.hl-body .mini-gauge{width:84px;height:84px;margin:0 0 10px;background:radial-gradient(var(--ios-card) 73%,transparent 74%),conic-gradient(var(--ink) var(--value),var(--line) 0)}
.hl-body .mini-gauge.hr{background:radial-gradient(var(--ios-card) 73%,transparent 74%),conic-gradient(var(--blue) var(--value),var(--line) 0)}
/* lubang cincin dilebarkan (ring lebih tipis) supaya teks di tengah tidak menabrak garis cincin */
.hl-body .mini-gauge b{font-size:16px;line-height:1.1}
.hl-body .mini-gauge small{font-size:10px;line-height:1.1;margin-top:2px;white-space:nowrap}

/* ---------- briefing card ---------- */
.brief{background:var(--ios-card);border-radius:var(--ios-radius-lg);padding:16px;box-shadow:var(--card-shadow);margin-top:14px}
.brief-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brief-kicker{font-size:12.5px;font-weight:600;color:var(--ios-label2)}
.brief h2{margin:3px 0 4px;font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.brief p{margin:0;font-size:13.5px;line-height:1.4;color:var(--ios-label2)}
.brief-chip{flex:none;border-radius:99px;padding:5px 10px;font-size:11.5px;font-weight:600;background:var(--ios-fill);color:var(--ink2);white-space:nowrap}
.brief-bar{margin:14px 0 12px}
.brief-bar-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--ios-label2)}
.brief-track{height:9px;border-radius:99px;background:var(--ios-fill);overflow:hidden}
.brief-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),#ff8a5b);transition:width .8s var(--ease-spring)}
.brief-actions{display:flex;gap:8px;flex-wrap:wrap}
.brief-actions .btn{flex:1;min-width:120px}

/* ---------- briefing flip (kartu "Today" bisa diketuk untuk flip) ---------- */
.brief-flip{perspective:1400px;margin-top:14px}
.brief-flip-inner{display:grid;transition:transform .65s cubic-bezier(.34,1.15,.64,1);transform-style:preserve-3d}
.brief-flip.flipped .brief-flip-inner{transform:rotateY(180deg)}
.brief-face{grid-column:1;grid-row:1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;margin-top:0;cursor:pointer}
.brief-back{transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center}
.brief-flip-btn{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;border:none;background:var(--ios-fill);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.brief-flip-btn svg{width:14px;height:14px}
.brief-tl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 2px}
.brief-tl-stat{background:var(--ios-fill);border-radius:12px;padding:9px 6px;text-align:center}
.brief-tl-stat b{display:block;font-size:16px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.brief-tl-stat small{font-size:10px;color:var(--ios-label2);text-transform:uppercase;letter-spacing:.3px}

/* ---------- donut komposisi effort mingguan ---------- */
.donut-wrap{display:flex;align-items:center;gap:16px;margin-top:10px;flex-wrap:wrap}
.donut-chart{position:relative;width:104px;height:104px;flex:none}
.donut-chart svg{width:100%;height:100%}
.donut-seg{transition:opacity .25s ease}
.donut-seg.donut-dim{opacity:.25}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center b{font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1}
.donut-center small{font-size:10px;color:var(--ios-label2);margin-top:2px}
.donut-legend{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.donut-legend-item{display:flex;align-items:center;gap:7px;background:none;border:none;padding:5px 2px;font-size:12.5px;color:var(--ink2);text-align:left;cursor:pointer;border-radius:8px;transition:opacity .2s ease}
.donut-legend-item.donut-dim{opacity:.4}
.donut-legend-item b{margin-left:auto;font-variant-numeric:tabular-nums}
.donut-dot{width:9px;height:9px;border-radius:50%;flex:none}

/* ---------- ring card ---------- */
.ring-card{display:flex;gap:16px;align-items:center;margin-top:0}
.ring-card .gauge-wrap{width:118px;height:118px;flex:none;position:relative}
.ring-card .gauge-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge-num{position:absolute;inset:0;display:grid;place-items:center;font-size:23px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.ring-card .gauge-copy{min-width:0;flex:1}
.ring-card .level{display:inline-block;border-radius:99px;padding:3px 9px;font-size:11.5px;font-weight:700;background:var(--ios-fill);color:var(--ink2)}
.ring-card .advice{margin:8px 0 10px;font-size:13px;line-height:1.4;color:var(--ios-label2)}
.ring-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ios-label2)}
.ring-legend span{display:inline-flex;align-items:center;gap:5px}
.ring-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.ring-dot.tsb{background:var(--ios-green)}.ring-dot.ctl{background:var(--ios-blue)}.ring-dot.atl{background:var(--ios-orange)}

/* ---------- search bar ---------- */
.search-bar{display:flex;align-items:center;gap:7px;background:var(--ios-fill);border-radius:10px;padding:8px 10px;margin-top:12px}
.search-bar .icon{color:var(--ios-label2);font-size:16px;flex:none}
.search-bar input{flex:1;min-width:0;border:0;background:transparent;outline:0;font:inherit;font-size:16px;color:var(--ink);padding:0}
.search-bar input::placeholder{color:var(--ios-label2)}
.search-bar input::-webkit-search-cancel-button{display:none}
.search-clear{border:0;background:var(--ios-label3);color:var(--ios-card);width:18px;height:18px;border-radius:50%;font-size:10px;line-height:1;cursor:pointer;flex:none}
.browse-empty{padding:34px 16px;text-align:center;color:var(--ios-label2);font-size:14px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:var(--shell-w);z-index:60;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabbar-h);padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--ios-card) 78%,transparent);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--ios-sep)}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:11.5px;font-weight:500;letter-spacing:-.1px;color:var(--ios-label2);cursor:pointer;padding:6px 0 4px}
.tabbar button .icon{font-size:23px}
.tabbar button .icon svg{stroke-width:1.8}
.tabbar button.active{color:var(--accent)}
.tabbar button.active .icon svg{stroke-width:2.2}
.tabbar button:active{opacity:.55}

/* ---------- floating buttons (single expandable menu, tidak mengganggu pandangan) ---------- */
.fab-stack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 12px);width:100%;max-width:var(--shell-w);z-index:55;display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding:0 16px;pointer-events:none}
.fab{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:.5px solid var(--ios-sep);background:color-mix(in srgb,var(--ios-card) 88%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);color:var(--ink2);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px -8px rgba(0,0,0,.4);position:relative}
.fab .icon{font-size:20px}
.fab:active{transform:scale(.92)}
.fab-sync-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ios-green);display:none}
.fab-sync-dot.on{display:block}
.fab-main{background:var(--accent);color:#fff;border:0;width:46px;height:46px;box-shadow:0 8px 22px -8px rgba(0,0,0,.5)}
.fab-main .icon{transition:transform .22s ease}
.fab-stack:not(.fab-collapsed) .fab-main .icon{transform:rotate(45deg)}
.fab-stack.fab-collapsed .fab-mini,.fab-stack.fab-collapsed .fab-sync{opacity:0;transform:translateY(8px) scale(.85);pointer-events:none!important}
.fab-stack .fab-mini,.fab-stack .fab-sync{transition:opacity .22s ease,transform .22s ease}
.fab-stack:not(.fab-collapsed) .fab-mini,.fab-stack:not(.fab-collapsed) .fab-sync{opacity:1;transform:none}
.fab-stack.fab-collapsed{opacity:.92}
.heatmap-cta{margin-top:10px;display:flex;justify-content:flex-end}
.heatmap-cta .btn{font-size:12px;padding:9px 12px}
.route-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:8px}
.route-traffic-note:empty{display:none}
/* ---------- global fast loader + inline spinner (semua loading beranimasi) ---------- */
.global-loader{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.28);color:#fff;font-size:13px;font-weight:700}
.global-loader[hidden]{display:none!important}
.global-spinner{width:22px;height:22px;flex:none;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:btnspin .6s linear infinite}
.inline-loader{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;color:var(--muted);font-size:12.5px;font-weight:700}
.inline-loader .global-spinner{border-color:var(--line);border-top-color:var(--accent)}
.wr-skeleton{display:flex;flex-direction:column;gap:10px}
.wr-skeleton .skel{height:86px}

/* ---------- iOS switch ---------- */
.ios-switch{width:51px;height:31px;border-radius:99px;border:0;background:var(--ios-fill);position:relative;cursor:pointer;flex:none;transition:background .25s ease;padding:0}
.ios-switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:transform .25s var(--ease-spring)}
.ios-switch[aria-checked="true"]{background:var(--ios-green)}
.ios-switch[aria-checked="true"] i{transform:translateX(20px)}
.toggle-row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:99px;background:var(--ios-fill);position:relative;cursor:pointer;flex:none;transition:background .25s ease;margin:0}
.toggle-row input[type=checkbox]:after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:transform .25s var(--ease-spring)}
.toggle-row input[type=checkbox]:checked{background:var(--ios-green)}
.toggle-row input[type=checkbox]:checked:after{transform:translateX(20px)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--ios-card);border-radius:var(--ios-radius);padding:12px 14px;margin-top:10px}
.toggle-row span b{display:block;font-size:15px;font-weight:500}
.toggle-row span small{display:block;font-size:12.5px;color:var(--ios-label2);margin-top:2px;line-height:1.3}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-size:16px;font-weight:600;letter-spacing:-.2px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.secondary{background:var(--ios-fill);color:var(--ios-blue);border:0}
.btn:active{opacity:.75;transform:scale(.97)}

/* ---------- inset forms ---------- */
.inset-group{background:var(--ios-card);border-radius:var(--ios-radius);overflow:hidden}
.inset-field{display:flex;align-items:center;gap:10px;padding:13px 14px;position:relative;background:transparent}
.inset-field+.inset-field:before{content:"";position:absolute;left:44px;right:0;top:0;height:.5px;background:var(--ios-sep)}
.inset-field input{border:0;background:transparent;outline:0;flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);padding:0}
.inset-field input::placeholder{color:var(--ios-label3)}
.auth-field-icon{color:var(--ios-label2);font-size:17px;flex:none;width:20px;display:grid;place-items:center}
.settings-form label{display:block;font-size:12.5px;color:var(--ios-label2);font-weight:600;margin-bottom:10px}
.settings-form input,.settings-form select,.settings-form textarea,.filters input,.filters select{display:block;width:100%;margin-top:5px;border:0;background:var(--ios-fill);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);box-sizing:border-box}
.settings-form textarea{resize:vertical}

/* ---------- login ---------- */
.login-display-fab{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;z-index:20}
.login-screen{background:var(--ios-bg);padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));align-items:flex-start}
.auth-card{max-width:360px;gap:20px;padding-top:6vh}
.auth-app-icon{width:76px;height:76px;border-radius:20px;background:linear-gradient(160deg,#ff6482,var(--ios-pink));color:#fff;font-size:38px;box-shadow:0 14px 30px -12px rgba(255,45,85,.6)}
.auth-app-icon svg{stroke-width:2.2}
.auth-title{font-size:32px;font-weight:800;letter-spacing:-.8px}
.auth-subtitle{font-size:15px;line-height:1.45;max-width:290px;color:var(--ios-label2)}
.auth-points{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:16px}
.auth-points li{display:flex;gap:13px;align-items:flex-start}
.auth-point-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.auth-point-icon .icon{font-size:17px}
.auth-points b{display:block;font-size:15px;font-weight:600;letter-spacing:-.2px}
.auth-points small{display:block;font-size:13px;color:var(--ios-label2);line-height:1.35;margin-top:1px}
.auth-form{gap:14px}
.auth-submit{width:100%;border-radius:13px;padding:14px;font-size:17px;box-shadow:none}
.auth-toggle{font-size:15px}
.auth-error{background:rgba(255,59,48,.12);color:var(--ios-red);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600}
.auth-foot{margin:4px 0 0;font-size:11.5px;color:var(--ios-label3);text-align:center;line-height:1.5}
.auth-foot a{color:var(--ios-label2);text-decoration:none}

/* ---------- sheets ---------- */
.popup-overlay,.modal{background:rgba(0,0,0,.4);align-items:flex-end}
.popup-box,.detail-box{background:var(--ios-bg);border-radius:14px 14px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom,0px));max-width:var(--shell-w);width:100%;max-height:90vh;overflow-y:auto}
.sheet-handle{display:flex;justify-content:center;padding:6px 0 10px;position:sticky;top:0;background:inherit;z-index:2}
.sheet-handle i{width:36px;height:5px;border-radius:99px;background:var(--ios-label3);display:block}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sheet-head h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.4px}
.sheet-close{width:30px;height:30px;border-radius:50%;border:0;background:var(--ios-fill);color:var(--ios-label2);font-size:13px;cursor:pointer;flex:none;display:grid;place-items:center;position:static}
.detail-box .sheet-close{position:absolute;right:16px;top:14px;z-index:3}
.sync-popup-status{font-size:13px;margin:0 0 12px}

/* ---------- insights ---------- */
.insight{background:var(--ios-fill2);border-radius:12px;padding:12px 13px;padding-left:13px}
.insight:before{display:none}
.insight b{font-size:15px;font-weight:600;letter-spacing:-.2px}
.insight p{margin:3px 0 0;font-size:13px;line-height:1.4;color:var(--ios-label2)}
.insight.rest-warn{background:rgba(255,149,0,.12)}
.insight.rest-alert{background:rgba(255,59,48,.12)}
.insight.rest-ok{background:rgba(52,199,89,.12)}
.insight-list{display:grid;gap:9px}

/* ---------- targets ---------- */
.target-list{display:grid;gap:14px}
.target-row-head{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:6px}
.target-row-head b{font-weight:600}
.target-row-head span{color:var(--ios-label2);font-variant-numeric:tabular-nums}
.target-track{height:9px;border-radius:99px;background:var(--ios-fill);overflow:hidden;margin-top:0}
.target-fill{height:100%;border-radius:inherit;background:var(--ios-green)}
.target-row.running .target-fill{background:var(--ios-blue)}

/* ---------- activity cards ---------- */
.activity-feed{display:grid;gap:11px}
.activity-card{background:var(--ios-card);border-radius:var(--ios-radius-lg);box-shadow:var(--card-shadow);overflow:hidden}
.activity-card h3{font-size:16px;font-weight:600;letter-spacing:-.3px}
.sport-chip{font-size:11px;font-weight:600;border-radius:99px;padding:3px 9px;background:rgba(255,149,0,.14);color:var(--ios-orange)}
.sport-chip.run{background:rgba(0,122,255,.14);color:var(--ios-blue)}
.sport-chip.other{background:var(--ios-fill);color:var(--ios-label2)}
.activity-stat b{font-size:15px;font-weight:600}
.activity-stat small{font-size:11px;color:var(--ios-label2);letter-spacing:.2px}
.view-switch{display:flex;width:max-content;background:var(--ios-fill2);border-radius:9px;padding:2px;margin:-3px 0 12px}
.view-switch button{border:0;background:transparent;border-radius:7px;padding:6px 12px;color:var(--ios-label2);font:600 13px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;cursor:pointer}
.view-switch button.active{background:var(--ios-card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.compact-feed{gap:0;background:var(--ios-card);border-radius:var(--ios-radius-lg);overflow:hidden;box-shadow:var(--card-shadow)}
.compact-activity{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--ink);padding:12px 14px;text-align:left;font:inherit;cursor:pointer}
.compact-activity+.compact-activity{border-top:.5px solid var(--ios-sep)}
.compact-activity:active{background:var(--ios-fill2)}
.compact-activity-icon{width:31px;height:31px;display:grid;place-items:center;border-radius:8px;background:rgba(255,149,0,.14);color:var(--ios-orange);flex:none}
.compact-activity-icon.run{background:rgba(0,122,255,.14);color:var(--ios-blue)}
.compact-activity-icon .icon{font-size:17px}
.compact-activity-main{min-width:0;flex:1}
.compact-activity-main b,.compact-activity-main small,.compact-activity-stats b,.compact-activity-stats small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compact-activity-main b{font-size:14.5px;font-weight:600}.compact-activity-main small,.compact-activity-stats small{margin-top:2px;color:var(--ios-label2);font-size:11.5px}
.compact-activity-stats{max-width:44%;text-align:right;flex:none}.compact-activity-stats b{font-size:13px;font-weight:600}
.coach-note-form{display:grid;gap:9px;padding:12px;margin-top:2px;border-radius:12px;background:var(--ios-fill2)}
.coach-note-form label{display:grid;gap:5px;color:var(--ios-label2);font-size:12.5px;font-weight:600}.coach-note-form textarea{width:100%;border:0;border-radius:9px;background:var(--ios-card);padding:10px;color:var(--ink);font:inherit;resize:vertical}
.coach-note-form .btn{justify-self:start;padding:9px 13px;font-size:14px}
.review-summary{background:rgba(90,200,250,.16)}
.plan-week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:14px 0 10px}
.plan-week-cell{display:grid;justify-items:center;gap:3px;min-width:0;border:0;border-radius:9px;padding:7px 2px;background:var(--ios-fill2);color:var(--ink);font:inherit;cursor:pointer}.plan-week-cell>span{height:16px}.plan-week-cell svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.plan-week-cell b{font-size:10px;font-weight:700}.plan-week-cell small{font-size:9px;color:var(--ios-label2);white-space:nowrap}.plan-week-cell.today{box-shadow:inset 0 0 0 1.5px var(--accent)}.plan-week-cell.done{background:rgba(52,199,89,.12)}.plan-week-cell.missed{background:rgba(255,59,48,.10)}

/* ---------- calendar ---------- */
.calendar-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.calendar-dow span{text-align:center;font-size:11px;font-weight:600;color:var(--ios-label2)}
.calendar-day,.cal-empty{min-height:48px;border-radius:10px}
.calendar-nav b{font-size:16px;font-weight:600}
.cal-nav-btn{border:0;background:var(--ios-fill);color:var(--ios-blue);border-radius:8px;width:32px;height:32px}
.heat-1{background:rgba(255,45,85,.22)}
.heat-2{background:rgba(255,45,85,.45);color:#fff}
.heat-3{background:rgba(255,45,85,.72);color:#fff}
.heat-4{background:var(--ios-pink);color:#fff}
.heat-2 small,.heat-3 small,.heat-4 small{color:rgba(255,255,255,.85)!important}

/* ---------- misc alignment with iOS ---------- */
.sub-tabs{background:var(--ios-fill2);border-radius:9px;padding:2px;margin:0 0 14px}
.sub-tab{font-size:13px;font-weight:600;color:var(--ink);padding:6px 12px;border-radius:7px}
.sub-tab.active{background:var(--ios-card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sub-tab-pill{display:none}
.chart-wrap{height:180px}
.chart-wrap.tall{height:210px}
.charts-grid{display:grid;gap:12px}
.dashboard-grid{display:grid;gap:12px}
.filters{gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filters label{font-size:12.5px;color:var(--ios-label2);display:flex;flex-direction:column;gap:4px;flex:1 1 128px;min-width:0}
.filters>input{flex:1 1 128px;min-width:0}
.filters input,.filters select{width:100%;min-width:0!important;box-sizing:border-box}
.activity-filters{width:100%}
.activity-filters input{min-width:0!important}
.zone-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profile-id-card{display:flex;align-items:center;gap:13px;background:var(--ios-card);border-radius:var(--ios-radius-lg);padding:14px;box-shadow:var(--card-shadow);margin-bottom:6px}
.profile-id-card .profile-avatar{width:50px;height:50px;font-size:19px}
.profile-id-card b{display:block;font-size:19px;font-weight:700;letter-spacing:-.4px}
.profile-id-card small{display:block;font-size:13px;color:var(--ios-label2);margin-top:2px}
.profile-section-title{margin:26px 0 9px;font-size:21px;font-weight:700;letter-spacing:-.5px}
.settings-grid{display:grid;gap:12px}
.profile-settings-section{background:var(--ios-card);border-radius:var(--ios-radius-lg);box-shadow:var(--card-shadow);overflow:hidden}
.profile-settings-section summary{display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none;padding:14px;cursor:pointer}.profile-settings-section summary::-webkit-details-marker{display:none}
.profile-settings-section summary b,.profile-settings-section summary small{display:block}.profile-settings-section summary b{font-size:15.5px;font-weight:600}.profile-settings-section summary small{margin-top:2px;color:var(--ios-label2);font-size:12.5px}.profile-settings-section summary>.icon{color:var(--ios-label3);font-size:16px;transition:transform .2s ease}.profile-settings-section[open] summary>.icon{transform:rotate(90deg)}
.profile-settings-section .card{border-radius:0;box-shadow:none;border-top:.5px solid var(--ios-sep)}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.metric{background:var(--ios-card);border-radius:var(--ios-radius-lg);padding:13px 14px;box-shadow:var(--card-shadow)}
.metric b{font-size:24px;font-weight:700;letter-spacing:-.8px;margin:9px 0 1px}
.metric small{font-size:11.5px;color:var(--ios-label2)}
.metric .eyebrow{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin:0}
.metric-icon{width:20px;height:20px;border-radius:6px;box-shadow:none}
.feed-empty,.empty-state,.chart-empty{background:var(--ios-card);border:0;border-radius:var(--ios-radius-lg);padding:28px 18px;color:var(--ios-label2);font-size:14px}
.toast{border-radius:14px;font-size:14px;font-weight:500}
.compare-bar{max-width:var(--shell-w);left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 10px);border-radius:14px}
.detail-back-btn{display:none}
.hero{display:none}
.browse-section-label,.browse-list,.browse-row{display:none}
.app-footer{display:none}


/* ================= Grafik gaya Apple Health ================= */
.seg-chart{margin:0 0 12px}
.chart-card{padding:14px 14px 8px}
.chart-head{margin-bottom:2px}
.chart-kicker{display:block;font-size:11.5px;font-weight:700;letter-spacing:.3px}
.chart-val{display:flex;align-items:baseline;gap:5px;margin-top:1px}
.chart-val b{font-size:29px;font-weight:700;letter-spacing:-.9px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.chart-val span{font-size:14px;font-weight:600;color:var(--ios-label2)}
.chart-range{display:block;font-size:12.5px;color:var(--ios-label2);margin-top:1px}
.hchart{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
.hchart-grid{stroke:var(--ios-sep);stroke-width:.7}
.hchart-ylab{fill:var(--ios-label3);font-size:10.5px;font-weight:600;font-family:inherit}
.hchart-xlab{fill:var(--ios-label3);font-size:10.5px;font-weight:600;font-family:inherit}
.hchart-avg{stroke:var(--ios-label3);stroke-width:.8;stroke-dasharray:3 2.5;opacity:.85}
.hchart-avglab{fill:var(--ios-label3);font-size:10px;font-weight:700;letter-spacing:.3px;font-family:inherit}
.hchart-line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hchart-bar{transition:opacity .2s ease}
.chart-empty{margin:14px 2px;font-size:13.5px;color:var(--ios-label2);text-align:center}

/* ================= Baris insight ================= */
.ins-row{display:flex;align-items:flex-start;gap:12px;width:100%;border:0;background:transparent;padding:13px 14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);position:relative}
.ins-row+.ins-row:before{content:"";position:absolute;left:52px;right:0;top:0;height:.5px;background:var(--ios-sep)}
.ins-row:active{background:var(--ios-fill2)}
.ins-icon{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;margin-top:1px}
.ins-icon .icon{font-size:15px}
.ins-icon .icon svg{stroke-width:2.2}
.ins-text{flex:1;min-width:0}
.ins-text b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.25px}
.ins-text small{display:block;font-size:13px;line-height:1.38;color:var(--ios-label2);margin-top:2px}
.ins-text small b{display:inline;font-size:inherit;font-weight:700;color:var(--ink)}
.ins-row .glist-chev{align-self:center}

/* ================= Layar sambutan / login ala Apple Health ================= */
.login-screen{display:block;background:var(--ios-bg);padding:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.auth-card{max-width:var(--shell-w);width:100%;margin:0 auto;display:block;padding:calc(env(safe-area-inset-top,0px) + 8vh) 22px calc(env(safe-area-inset-bottom,0px) + 28px)}
.auth-hero{display:block;text-align:center;margin-bottom:34px}
.auth-app-icon{width:78px;height:78px;border-radius:21px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(160deg,#ff5f6d,#fa114f);color:#fff;font-size:36px;box-shadow:0 14px 30px -12px rgba(250,17,79,.55),inset 0 1px 0 rgba(255,255,255,.3)}
.auth-title{margin:0;font-size:31px;font-weight:800;letter-spacing:-.8px;line-height:1.14;color:var(--ink)}
.auth-subtitle{margin:9px auto 0;max-width:300px;font-size:14.5px;line-height:1.45;color:var(--ios-label2)}
.auth-points{list-style:none;margin:0 0 30px;padding:0;display:flex;flex-direction:column;gap:22px}
.auth-points li{display:flex;gap:16px;align-items:flex-start}
.auth-point-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;margin-top:1px}
.auth-point-icon .icon{font-size:16px}
.auth-point-icon .icon svg{stroke-width:2.2}
.auth-points b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.2px;color:var(--ink)}
.auth-points small{display:block;font-size:13.5px;line-height:1.4;color:var(--ios-label2);margin-top:2px}
.auth-form{display:block}
.auth-form .inset-group{background:var(--ios-card);border-radius:var(--ios-radius-lg);overflow:hidden;box-shadow:var(--card-shadow)}
.inset-field{display:flex;align-items:center;gap:11px;padding:13px 15px;position:relative;background:transparent}
.inset-field+.inset-field:before{content:"";position:absolute;left:46px;right:0;top:0;height:.5px;background:var(--ios-sep)}
.inset-field input{border:0;background:transparent;outline:0;flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);padding:0}
.inset-field input::placeholder{color:var(--ios-label3)}
.auth-submit{width:100%;border-radius:14px;padding:15px;font-size:16px;font-weight:600;margin-top:18px;background:var(--accent);color:#fff;border:0;box-shadow:none}
.auth-submit:disabled{opacity:.5}
.auth-toggle{display:block;width:100%;text-align:center;margin-top:16px;font-size:15px;color:var(--ios-blue);font-weight:500}
.auth-error{background:var(--ios-fill2);color:var(--ios-red);border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:600;text-align:center;margin-bottom:14px}
.auth-foot{margin:28px 0 0;text-align:center;font-size:11.5px;line-height:1.5;color:var(--ios-label3)}
.auth-foot a{color:var(--ios-label3)}
@media(min-height:760px){.auth-card{padding-top:11vh}}

/* ---------- Browse deep-link anchor highlight ---------- */
@keyframes anchorFlash{0%{background:var(--accent-light)}100%{background:transparent}}
.anchor-flash{animation:anchorFlash 1.6s ease-out;border-radius:14px;scroll-margin-top:64px}
.page .card,.page article.card{scroll-margin-top:60px}
.browse-lead{font-size:12.5px;line-height:1.5;color:var(--ink2);margin:0 0 12px}

/* Segmented control mode tampilan (Terang/Gelap/Otomatis) di popup Sinkronisasi & Tampilan */
.theme-seg{margin:0 14px 12px}

/* ================= Perbaikan: Cincin Latihan, Kalender, Kebugaran ================= */
/* Cincin: warna ring & legenda memakai satu variabel yang sama (Fatigue = oranye seperti grafik ATL) */
:root{--ring-ctl:var(--ios-blue);--ring-atl:var(--ios-orange)}
.ring-ctl{stroke:var(--ring-ctl)}
.ring-atl{stroke:var(--ring-atl)}
.ring-dot.ctl{background:var(--ring-ctl)}
.ring-dot.atl{background:var(--ring-atl)}
.ring-card .gauge-wrap{width:120px;height:120px}
.ring-card .gauge-wrap .gauge-track,.ring-card .gauge-wrap .gauge-value{stroke-width:8}
.ring-card .gauge-num{font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1;pointer-events:none}

/* Kalender: semua sel tinggi sama, jumlah baris tetap 6 supaya tinggi kartu tidak loncat antar bulan */
.calendar-dow,.calendar-grid{grid-template-columns:repeat(7,minmax(0,1fr))}
.calendar-grid{--cal-h:52px;grid-template-rows:repeat(6,var(--cal-h));grid-auto-rows:var(--cal-h);gap:6px}
.calendar-day,.cal-empty{box-sizing:border-box;height:var(--cal-h);min-height:0;padding:6px 2px;overflow:hidden}
.cal-empty{background:transparent}
.calendar-day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.calendar-day b{font-size:13px;line-height:1}
.calendar-day small{margin:0;font-size:9.5px;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* Kebugaran: tab section */
.insight-seg{margin:0}
.insight-section{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--card-gap)}
[data-insight-section]>.card{margin-top:0}


/* =======================================================================
   TAMPILAN DESKTOP (>=1000px): sidebar kiri + area konten lebar
   Mobile tetap memakai layout di atas tanpa perubahan.
   ======================================================================= */
.side-brand,.tabbar .side-profile,.dash-brief-head{display:none}

/* Tablet: kolom aplikasi lebih lebar dari layar HP */
/* Tablet (700-999px): kolom aplikasi lebih lebar dari layar HP */
html[data-view="tablet"]{--shell-w:720px}
html[data-view="tablet"] .hcard-grid{grid-template-columns:repeat(3,1fr)}
html[data-view="tablet"] #shareSummary{grid-template-columns:repeat(2,1fr)}

/* Desktop: aturan lama yang tadinya hanya berlaku lewat @media, kini ikut mode paksa */
html[data-view="desktop"] .charts-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
html[data-view="desktop"] .dashboard-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
html[data-view="desktop"] .settings-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
html[data-view="desktop"] .predict-grid,html[data-view="desktop"] .skel-grid{grid-template-columns:repeat(4,1fr)}
html[data-view="desktop"] .ptr-indicator{display:none!important}

/* HP: batalkan aturan lama @media(min-width:1000px) saat mode HP dipaksa di layar lebar */
html[data-view="mobile"] .charts-grid,html[data-view="mobile"] .dashboard-grid,html[data-view="mobile"] .settings-grid,html[data-view="mobile"] .activity-feed{grid-template-columns:minmax(0,1fr)}
html[data-view="mobile"] .predict-grid,html[data-view="mobile"] .skel-grid{grid-template-columns:repeat(2,1fr)}

/* Desktop (dipilih oleh atribut data-view yang diatur JS: otomatis mengikuti lebar layar, atau dipaksa lewat tombol) */
html[data-view="desktop"]{--desktop-on:1}
  html[data-view="desktop"]{--side-w:248px;--page-pad:40px}
  html[data-view="desktop"],html[data-view="desktop"] body,:root[data-theme="dark"][data-view="desktop"] body{background:var(--ios-bg)}
  html[data-view="desktop"] .app{max-width:none;margin:0;box-shadow:none;padding-left:var(--side-w)}
  html[data-view="desktop"] .content{max-width:1280px;margin:0 auto;padding:0 var(--page-pad) 64px}

  /* ---------- sidebar (tabbar dipakai ulang, JS navigasi tidak berubah) ---------- */
  html[data-view="desktop"] .tabbar{left:0;top:0;bottom:0;transform:none;width:var(--side-w);max-width:none;height:auto;padding:24px 14px 18px;display:flex;flex-direction:column;align-items:stretch;gap:3px;background:var(--ios-card);-webkit-backdrop-filter:none;backdrop-filter:none;border-top:0;border-right:.5px solid var(--ios-sep)}
  html[data-view="desktop"] .side-brand{display:flex;align-items:center;gap:11px;padding:2px 10px 24px}
  html[data-view="desktop"] .side-logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(160deg,#ff5f6d,#fa114f);box-shadow:0 8px 18px -10px rgba(250,17,79,.6)}
  html[data-view="desktop"] .side-logo .icon{font-size:19px}
  html[data-view="desktop"] .side-brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
  html[data-view="desktop"] .side-brand small{display:block;font-size:12px;color:var(--ios-label2);margin-top:1px}
  html[data-view="desktop"] .tabbar button[data-page]{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:500;color:var(--ink2)}
  html[data-view="desktop"] .tabbar button[data-page] .icon{font-size:20px}
  html[data-view="desktop"] .tabbar button[data-page]:hover{background:var(--ios-fill2)}
  html[data-view="desktop"] .tabbar button.active{background:var(--accent-light);color:var(--accent);font-weight:600}
  html[data-view="desktop"] .tabbar button:active{opacity:1}
  html[data-view="desktop"] .tabbar button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  html[data-view="desktop"] .tabbar .side-profile{display:flex;align-items:center;gap:11px;margin-top:auto;padding:10px;border-radius:12px;background:var(--ios-fill2);font-size:14px;font-weight:600;color:var(--ink);text-align:left}
  html[data-view="desktop"] .tabbar .side-profile:hover{background:var(--ios-fill)}
  html[data-view="desktop"] .tabbar .side-profile .avatar{margin:0;width:32px;height:32px;font-size:13px}
  html[data-view="desktop"] .tabbar .side-profile small{display:block;font-size:12px;font-weight:500;color:var(--ios-label2)}

  /* ---------- header & bar halaman ---------- */
  html[data-view="desktop"] .ios-head{padding-top:38px}
  html[data-view="desktop"] .ios-head .avatar-btn{display:none}
  html[data-view="desktop"] .ios-title{font-size:38px}
  html[data-view="desktop"] .ios-nav{margin:0 0 6px;padding:0;height:56px;top:0}
  html[data-view="desktop"] .ios-back{padding-left:0}
  html[data-view="desktop"] .seg{width:100%;max-width:440px;justify-self:start}
  html[data-view="desktop"] .search-bar{max-width:520px}
  html[data-view="desktop"] .loading-skeleton{max-width:100%}

  /* ---------- grid halaman ---------- */
  html[data-view="desktop"] .page{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:start}
  html[data-view="desktop"] .page>*{grid-column:1/-1;min-width:0}
  html[data-view="desktop"] .page[data-page-view="profile"],html[data-view="desktop"] .page[data-page-view="plan"],html[data-view="desktop"] .page[data-page-view="detail"]{max-width:1100px;margin-left:auto;margin-right:auto}
  html[data-view="desktop"] .page[data-page-view="calendar"]{max-width:900px;margin-left:auto;margin-right:auto}
  html[data-view="desktop"] .hcard-grid{grid-template-columns:repeat(3,1fr);gap:16px}
  html[data-view="desktop"] #shareSummary{grid-template-columns:repeat(4,1fr)}
  html[data-view="desktop"] .card,html[data-view="desktop"] .panel{padding:20px}
  html[data-view="desktop"] .sec-head{margin-top:32px}
  html[data-view="desktop"] .sec-head h2{font-size:22px}

  /* ---------- Ringkasan ---------- */
  html[data-view="desktop"] .dash-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:start}
  html[data-view="desktop"] .dash-cell{grid-column:1/-1;min-width:0}
  html[data-view="desktop"] .dash-brief-head{display:flex}
  html[data-view="desktop"] .dash-brief{grid-column:1/8;grid-row:1}
  html[data-view="desktop"] .dash-ring{grid-column:8/13;grid-row:1}
  html[data-view="desktop"] .dash-favs{grid-row:2}
  html[data-view="desktop"] .dash-chart{grid-column:1/8;grid-row:3}
  html[data-view="desktop"] .dash-insight{grid-column:8/13;grid-row:3}
  html[data-view="desktop"] .dash-hl{grid-row:4}
  html[data-view="desktop"] .dash-focus{grid-column:1/7;grid-row:5}
  html[data-view="desktop"] .dash-target{grid-column:7/13;grid-row:5}
  html[data-view="desktop"] .dash-trend{grid-row:6}
  html[data-view="desktop"] #dashBriefing .brief-flip,html[data-view="desktop"] #dashBriefing>.brief{margin-top:0}
  html[data-view="desktop"] .dash-cell>.dash-collapsible{margin-top:32px}
  html[data-view="desktop"] .hl-scroller{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;overflow:visible;margin:0;padding:0;scroll-snap-type:none}
  html[data-view="desktop"] .hl-card{flex:none;max-width:none}

  /* ---------- Jelajahi & Berbagi ---------- */
  html[data-view="desktop"] #browseList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;align-items:start}
  html[data-view="desktop"] #browseList>.browse-empty{grid-column:1/-1}
  html[data-view="desktop"] .split-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;align-items:start}
  html[data-view="desktop"] .split-2>.stack{min-width:0}

  /* ---------- Overlay Studio ---------- */
  html[data-view="desktop"] .ovl-studio{flex-wrap:nowrap;gap:36px}
  html[data-view="desktop"] .ovl-stage-col{flex:0 0 340px;max-width:340px;margin:0;position:sticky;top:72px}
  html[data-view="desktop"] .ovl-side{flex:1 1 0;min-width:0}
  html[data-view="desktop"] .ovl-tpl-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}

  /* ---------- Aktivitas ---------- */
  html[data-view="desktop"] .page[data-page-view="activities"] .heatmap-panel{grid-column:1/9;grid-row:2;margin-top:0}
  html[data-view="desktop"] .page[data-page-view="activities"] .route-reco-panel{grid-column:9/13;grid-row:2;margin-top:0;align-self:stretch}
  html[data-view="desktop"] .heatmap-map{height:440px}
  html[data-view="desktop"] .activity-feed{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  html[data-view="desktop"] .activity-feed.compact-feed{grid-template-columns:1fr;gap:0}
  html[data-view="desktop"] .mini-map{height:140px}

  /* ---------- Kebugaran, Kalender ---------- */
  html[data-view="desktop"] .insight-section[data-insight-section="load"]{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
  html[data-view="desktop"] .chart-wrap{height:260px}
  html[data-view="desktop"] .chart-wrap.tall{height:340px}
  html[data-view="desktop"] .calendar-grid{--cal-h:74px;gap:8px}
  html[data-view="desktop"] .calendar-day b{font-size:15px}
  html[data-view="desktop"] .calendar-day small{font-size:11px}

  /* ---------- dialog (bukan bottom sheet lagi) ---------- */
  html[data-view="desktop"] .popup-overlay,html[data-view="desktop"] .modal{align-items:center;padding:24px}
  html[data-view="desktop"] .popup-box{max-width:440px;border-radius:20px;padding:14px 22px 24px}
  html[data-view="desktop"] .detail-box{max-width:760px;border-radius:20px;padding:14px 26px 26px;max-height:88vh}
  html[data-view="desktop"] .detail-box.wide{max-width:920px}
  html[data-view="desktop"] .sheet-handle{display:none}
  html[data-view="desktop"] .modal.show .detail-box,html[data-view="desktop"] .popup-overlay:not([hidden]) .popup-box{animation:modal-fade .18s ease}
  html[data-view="desktop"] .route-map-leaflet{height:340px}

  /* ---------- tombol melayang, toast, bar bandingkan ---------- */
  html[data-view="desktop"] .fab-stack{left:auto;right:28px;bottom:28px;transform:none;width:auto;max-width:none;padding:0}
  html[data-view="desktop"] .toast{bottom:28px;left:calc(50% + var(--side-w)/2)}
  html[data-view="desktop"] .compare-bar{max-width:none;width:max-content;left:calc(50% + var(--side-w)/2);bottom:28px}

  /* ---------- interaksi mouse ---------- */
  @media(hover:hover){
    html[data-view="desktop"] .glist-row:hover,html[data-view="desktop"] .ins-row:hover,html[data-view="desktop"] .compact-activity:hover{background:var(--ios-fill2)}
    html[data-view="desktop"] .hcard[type="button"]:hover,html[data-view="desktop"] .activity-card:hover,html[data-view="desktop"] .hl-card:hover{box-shadow:var(--card-shadow-hover)}
  }

  /* ---------- layar masuk: dua kolom ---------- */
  html[data-view="desktop"] .login-screen{display:flex}
  html[data-view="desktop"] .auth-card{max-width:1040px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 400px;column-gap:96px;align-items:center;padding:48px 40px}
  html[data-view="desktop"] .auth-left .auth-hero{text-align:left;margin-bottom:36px}
  html[data-view="desktop"] .auth-left .auth-app-icon{margin:0 0 22px}
  html[data-view="desktop"] .auth-left .auth-title{font-size:44px;letter-spacing:-1.2px}
  html[data-view="desktop"] .auth-left .auth-subtitle{margin:12px 0 0;max-width:400px;font-size:17px}
  html[data-view="desktop"] .auth-left .auth-points{margin:0}
  html[data-view="desktop"] .auth-right{background:var(--ios-card);border-radius:24px;padding:32px;box-shadow:0 24px 60px -30px rgba(0,0,0,.3)}
  html[data-view="desktop"] .auth-right .auth-form .inset-group{background:var(--ios-fill2);box-shadow:none}
@media(min-width:1440px){
  html[data-view="desktop"] .dash-favs .hcard-grid{grid-template-columns:repeat(6,1fr)}
}

/* ===== Review Mingguan Cerdas ===== */
.wr{display:flex;flex-direction:column;gap:var(--card-gap);transition:opacity .15s ease}.wr.loading{opacity:1;pointer-events:none}
.wr-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.wr-top h3{margin:2px 0 0}
.wr-nav{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:12px;padding:3px}.wr-nav span{font-size:12px;font-weight:600;padding:0 8px;white-space:nowrap}
.wr-nav button{width:30px;height:30px;border:0;border-radius:9px;background:var(--white);color:var(--ink);font-size:18px;cursor:pointer}.wr-nav button:disabled{opacity:.35;cursor:default}
.wr-hero-body{display:flex;gap:18px;align-items:center;margin-top:14px}.wr-ring{position:relative;width:104px;height:104px;flex:none}.wr-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.wr-ring circle{fill:none;stroke-width:9;stroke-linecap:round}.wr-ring .bg{stroke:var(--line)}.wr-ring .fg{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.wr-ring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.wr-ring b{font-size:28px;line-height:1}.wr-ring small{color:var(--muted);font-size:11px}
.wr-grade{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}.wr-headline{margin:4px 0 8px;font-size:14px;line-height:1.5;color:var(--ink2)}
.wr-chip{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--orange-light);color:var(--orange-dark)}
.wr-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--card-gap)}
.wr-kpi{background:var(--white);border-radius:var(--card-radius);box-shadow:var(--card-shadow);padding:14px}.wr-kpi>span{font-size:12px;color:var(--muted);font-weight:600}.wr-kpi b{display:block;font-size:22px;margin:4px 0}
.wr-kpi>div{display:flex;gap:6px;align-items:center}.wr-kpi small{color:var(--muted);font-size:11px}.wr-sub{display:block;margin-top:4px}
.wr-d{font-style:normal;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--bg);color:var(--muted)}.wr-d.up{color:var(--green);background:var(--green-light)}.wr-d.down{color:var(--red);background:var(--red-light)}
.wr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--card-gap);align-items:start}.wr-grid:empty{display:none}
.wr-days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px}.wr-day{text-align:center}.wr-day b{display:block;font-size:12px;margin-top:6px}.wr-day small{font-size:10px;color:var(--muted)}
.wr-bars{height:96px;display:flex;align-items:flex-end;justify-content:center;gap:3px;background:var(--bg);border-radius:10px;padding:4px}.wr-bars i{width:42%;border-radius:5px 5px 2px 2px;min-height:2px}
.wr-bars .p{border:1.5px dashed var(--muted);background:transparent;opacity:.6}.wr-bars .a{background:var(--accent)}
.wr-day.st-done .a{background:var(--green)}.wr-day.st-partial .a{background:var(--orange)}.wr-day.st-bonus .a{background:var(--blue)}.wr-day.st-missed .wr-bars{outline:1.5px solid var(--red)}.wr-day.st-missed small{color:var(--red)}
.wr-legend{font-size:12px;color:var(--ink2);margin:12px 0 0;line-height:1.5}.wr-legend span{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin:0 2px 0 8px}.wr-legend .p{border:1.5px dashed var(--muted)}.wr-legend .a{background:var(--green)}
.wr-trend{display:flex;gap:6px;align-items:flex-end;height:150px;margin-top:8px}.wr-trend>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px}
.wr-trend i{width:100%;border-radius:6px 6px 2px 2px;background:var(--line)}.wr-trend .cur i{background:var(--accent)}.wr-trend small{font-size:9px;color:var(--muted);white-space:nowrap}.wr-trend b{font-size:10px}
.wr-zbar{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin-top:8px}.wr-zleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px}.wr-zleg s{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.wr-comp{margin-top:12px}.wr-comp>div:first-child{display:flex;justify-content:space-between;font-size:13px}.wr-track{height:7px;background:var(--bg);border-radius:4px;margin:5px 0;overflow:hidden}.wr-track i{display:block;height:100%;border-radius:4px}.wr-comp small{font-size:11px;color:var(--muted)}
.wr-ins{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.wr-ins:first-of-type{border-top:0}.wr-ins b{font-size:14px}.wr-ins p{margin:3px 0 0;font-size:13px;line-height:1.5;color:var(--ink2)}
.wr-ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.wr-hl{display:grid;gap:10px}.wr-hl>div{background:var(--bg);border-radius:12px;padding:12px}.wr-hl span{font-size:12px;color:var(--muted);font-weight:600}.wr-hl b{display:block;font-size:20px;margin:2px 0}.wr-hl small{font-size:11px;color:var(--muted)}
.wr-rec{font-style:normal;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;background:var(--accent);color:#fff;margin-left:4px}

/* chips */

/* tanjakan */

.pro-sim-out b{font-size:26px;font-variant-numeric:tabular-nums}.pro-sim-out span{font-size:13px}.pro-sim-out small{margin-left:auto;font-size:12px;color:var(--ios-label2)}

/* intensitas */

.pro-tri i{display:block;height:100%}.pro-tri .z1{background:var(--ios-green)}.pro-tri .z2{background:var(--ios-orange)}.pro-tri .z3{background:var(--ios-red)}

.pro-rec span,.pro-ins span{font-size:11.5px;color:var(--ios-label2);line-height:1.35}
/* switch */
.pro-auto small{display:block;font-size:12px;margin-top:2px}
.pro-switch{position:relative;flex:none;width:51px;height:31px;cursor:pointer}
.pro-switch input{opacity:0;width:0;height:0;position:absolute}
.pro-switch i{position:absolute;inset:0;border-radius:99px;background:var(--ios-fill);transition:background .2s}
.pro-switch i::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}

/* peta interaktif */
.pro-metric-chips{margin-top:6px}
.pro-readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;margin-top:8px}
.pro-readout div{background:var(--bg);border-radius:10px;padding:7px 8px;min-width:0}
.pro-readout small{display:block;font-size:10.5px;font-weight:700;color:var(--muted)}
.pro-readout b{display:block;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pro-scrub{display:block;width:100%;height:120px;margin-top:8px;border-radius:12px;background:var(--bg);touch-action:none;cursor:crosshair}
.pro-imap-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pro-imap-ctrl select,.pro-select,.pro-search{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;font:inherit;font-size:13px;color:var(--ink)}
.pro-select,.pro-search{width:100%;margin-top:10px;padding:10px}
/* flyover */
.pro-fly{position:fixed;inset:0;z-index:9999;background:#000}

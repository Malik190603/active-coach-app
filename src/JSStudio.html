/* ---------------------------- format angka & data ---------------------------- */
function stNum(v,d){return (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toFixed(d)}

function stPace(p){if(!p||!isFinite(p))return '-';let m=Math.floor(p),s=Math.round((p-m)*60);if(s===60){m++;s=0}return m+':'+String(s).padStart(2,'0')}

function stDateObj(s){let d=new Date(String(s||'').slice(0,10)+'T12:00:00');return isNaN(d)?new Date():d}

    case 'pace':return {k,label:'Pace',value:stPace(D.pace),unit:'/km'};
    case 'speed':return {k,label:'Kecepatan',value:stNum(D.speed,1),unit:'km/j'};
    case 'elev':return {k,label:'Elevasi',value:Math.round(D.elev).toLocaleString('id-ID'),unit:'m'};
    case 'hr':return {k,label:'Detak rata²',value:String(Math.round(D.hr)),unit:'bpm'};

function stSmartMetrics(D){
  let out=[];
  if(D.isRun)out=['distance','pace','time','elev','hr','cadence','kcal'];
  else if(D.isRide)out=['distance','speed','time','elev','power','hr','kcal','maxspeed'];
  else out=[D.distance>0.2?'distance':'time','time','hr','kcal','elev'];
  if(!D.isRun&&D.elev<40)out=out.filter(k=>k!=='elev').concat(['elev']);
  return out.filter((k,i)=>out.indexOf(k)===i&&ST_METRICS[k].ok(D));
}
function stTrimRoute(pts,m){
  if(!pts||pts.length<8||!m)return pts||[];
  let cut=(arr)=>{let d=0;for(let i=1;i<arr.length;i++){d+=acxHaversine(arr[i-1],arr[i]);if(d>=m)return i}return 0};
  let a=cut(pts),b=cut(pts.slice().reverse());

}
function personalRecordLabel(x){
  let r=DATA.records||{},labels=[];
  [['runPace','PR Pace'],['cyclingSpeed','PR Kecepatan'],['maxSpeed','Kecepatan maks tertinggi'],['elevation','PR Elevasi'],['sprint','Sprint tercepat'],['power','PR Power'],['calories','PR Kalori'],['longest','Aktivitas terpanjang']].forEach(m=>{let rec=r[m[0]];if(rec&&rec.id&&String(rec.id)===String(x.id))labels.push(m[1])});
  return labels.length?labels.slice(0,2).join(' · '):'';
}
function stBadge(x){
  try{
    let logs=(DATA.logs||[]).filter(l=>l.sport===x.sport&&l.date<=x.date),d30=dateKey(new Date(stDateObj(x.date).getTime()-30*864e5)),d90=dateKey(new Date(stDateObj(x.date).getTime()-90*864e5));
    let pr=typeof personalRecordLabel==='function'?personalRecordLabel(x):'';if(pr)return pr;
    if(x.distance>0&&logs.length>4&&logs.every(l=>l.distance<=x.distance))return 'Jarak terjauh sepanjang masa';

    let days=new Set((DATA.logs||[]).map(l=>l.date)),c=stDateObj(x.date),streak=0;while(days.has(dateKey(c))&&streak<60){streak++;c.setDate(c.getDate()-1)}
    if(streak>=3)return 'Hari ke-'+streak+' berturut-turut';
    let mon=startOfWeek(stDateObj(x.date)),wk=(DATA.logs||[]).filter(l=>l.date>=dateKey(mon)&&l.date<=x.date).length;
    if(wk>=2)return 'Sesi ke-'+wk+' minggu ini';
  }catch(e){}

}
function stWeek(x){
  let mon=startOfWeek(stDateObj(x.date)),days=[],tot={km:0,min:0,elev:0,n:0};
  for(let i=0;i<7;i++){let d=new Date(mon);d.setDate(mon.getDate()+i);let k=dateKey(d),items=(DATA.logs||[]).filter(l=>l.date===k);let km=items.reduce((s,l)=>s+(l.distance||0),0);days.push({k,label:['Sen','Sel','Rab','Kam','Jum','Sab','Min'][i],km,min:items.reduce((s,l)=>s+(l.minutes||0),0),on:k===x.date,n:items.length});tot.km+=km;tot.min+=days[i].min;tot.elev+=items.reduce((s,l)=>s+(l.elevation||0),0);tot.n+=items.length}

}
function stSplits(x){
  let s=x&&x.stravaId&&ST_STREAMS[x.stravaId];if(!s)return null;
  let dist=(s.distance&&s.distance.data)||[],time=(s.time&&s.time.data)||[],mov=(s.moving&&s.moving.data)||null;
  if(dist.length<2||time.length<2)return null;

  for(let km=unit;km<=Math.floor(total/unit)*unit;km+=unit){while(idx<dist.length-1&&dist[idx]<km*1000)idx++;let t=movingTime(idx),seg=t-lastT;if(seg>0)out.push({km,sec:seg,len:unit,speed:unit/seg*3600,pace:seg/60/unit});lastT=t;last=km}
  let rem=total-last;if(rem>unit*0.25){let t=movingTime(time.length-1),seg=t-lastT;if(seg>0)out.push({km:+total.toFixed(1),sec:seg,len:rem,speed:rem/seg*3600,pace:seg/60/rem,partial:true})}

}
function stSeries(x,key,n){
  let s=x&&x.stravaId&&ST_STREAMS[x.stravaId],arr=s&&s[key]&&s[key].data;if(!arr||arr.length<8)return null;
  n=n||240;let out=[];for(let i=0;i<n;i++)out.push(arr[Math.round(i*(arr.length-1)/(n-1))]);
  let dist=s.distance&&s.distance.data;return {v:out,min:Math.min.apply(null,out),max:Math.max.apply(null,out),total:dist?dist[dist.length-1]/1000:0};
}
function stData(x){
  let p=DATA.profile||{},name=p.nama||(typeof SESSION!=='undefined'&&SESSION.nama)||'Atlet';
  let isRun=x.sport==='Running',isRide=x.sport==='Cycling',dt=stDateObj(x.date);
  let hide=!!(DATA.privacy&&DATA.privacy.hideRoutes);
  let raw=(!hide&&x.polyline)?decodePolyline(x.polyline):[];
  let pts=ST.trim?stTrimRoute(raw,200):raw;
  let D={x,id:x.id,title:(ST.title||x.title||'Aktivitas').trim(),sub:ST.sub||'',name,first:String(name).split(' ')[0],
    sport:x.sport,isRun,isRide,sportLabel:isRun?'LARI':isRide?'BERSEPEDA':String(x.sportType||x.sport||'AKTIVITAS').toUpperCase(),verb:isRun?'Lari':isRide?'Gowes':'Latihan',
    date:dt,dateStr:ST_DAYS[dt.getDay()]+', '+dt.getDate()+' '+ST_MON[dt.getMonth()]+' '+dt.getFullYear(),dateShort:dt.getDate()+' '+ST_MON[dt.getMonth()].slice(0,3)+' '+dt.getFullYear(),
    distance:x.distance||0,minutes:x.minutes||0,pace:x.avgPace||(x.distance>0&&x.minutes>0?x.minutes/x.distance:0),speed:x.avgSpeed||(x.minutes>0?x.distance/(x.minutes/60):0),
    elev:x.elevation||0,hr:x.avgHr||0,maxHr:x.maxHr||0,kcal:x.calories||0,power:x.avgPower||0,cadence:x.avgCadence||0,maxSpeed:x.maxSpeed||0,
    pts:acxDecimate(pts,900),hasRoute:pts.length>1,badge:stBadge(x)};
  let meta=x.stravaId&&ST_META[x.stravaId];D.sec=meta&&meta.movingTime?meta.movingTime:Math.round(D.minutes*60);
  let hm=meta&&String(meta.startLocal||'').match(/T(\d\d):(\d\d)/);D.startHM=hm?hm[1]+':'+hm[2]:'';D.hour=hm?+hm[1]:-1;

}

/* ---------------------------- helper canvas ---------------------------- */
function F(w,px,fam,style){return (style?style+' ':'')+w+' '+Math.max(1,Math.round(px))+'px '+(SF[fam]||fam)+', Inter, system-ui, sans-serif'}

  if(o.spacing){let chars=[...s],w=chars.reduce((a,c)=>a+ctx.measureText(c).width,0)+o.spacing*(chars.length-1),sx=o.align==='center'?x-w/2:o.align==='right'?x-w:x;ctx.textAlign='left';chars.forEach(c=>{if(o.stroke){ctx.strokeText(c,sx,y)}else ctx.fillText(c,sx,y);sx+=ctx.measureText(c).width+o.spacing});return w}

function hexA(hex,a){hex=String(hex||'#000');if(hex[0]!=='#')return hex;let h=hex.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');let n=parseInt(h,16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'}
function lum(hex){let h=String(hex).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');let n=parseInt(h,16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;return .2126*r+.7152*g+.0722*b}
function shade(hex,amt){let h=String(hex).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');let n=parseInt(h,16),f=c=>Math.max(0,Math.min(255,Math.round(c+(amt<0?c*amt:(255-c)*amt))));return '#'+[f(n>>16&255),f(n>>8&255),f(n&255)].map(v=>v.toString(16).padStart(2,'0')).join('')}
function projectRoute(pts,box,pad){

function routePath(ctx,m){ctx.beginPath();m.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]))}
function drawRoute(ctx,D,box,o){

name: Build APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Siapkan file proyek (boleh upload file .zip langsung)
        run: |
          if [ ! -f package.json ]; then
            z=$(ls *.zip 2>/dev/null | head -1)
            if [ -n "$z" ]; then echo "Mengekstrak $z"; unzip -q -o "$z" -d _src; fi
            dir=$(dirname "$(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' | head -1)")
            echo "Proyek ditemukan di $dir"
            shopt -s dotglob && cp -r "$dir"/* .
          fi
          test -f package-lock.json || npm install --package-lock-only --no-audit --no-fund

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Pasang dependensi
        run: npm ci

      - name: Susun aplikasi web (www/)
        env:
          VERSION_CODE: ${{ github.run_number }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Kunci tanda tangan
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Memakai kunci rilis pribadi (GitHub Secrets)"
          else
            mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Kunci rilis belum diisi di GitHub Secrets — APK memakai kunci debug. Lihat README bagian Kunci rilis."
          fi

      - name: Siapkan proyek Android
        env:
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: npm run android:prepare

      - name: Build APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then ./gradlew assembleRelease --no-daemon --stacktrace; else ./gradlew assembleDebug --no-daemon --stacktrace; fi

      - name: Beri nama file
        run: |
          f=$(ls android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | head -1)
          echo "APK: $f"
          cp "$f" "ActiveCoach-v1.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ActiveCoach-APK
          path: ActiveCoach-*.apk

      - name: Catatan rilis (dari pesan commit)
        run: |
          { echo "## Yang baru"; git log -1 --pretty=format:%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | sed '/^$/N;/^\n$/D'; echo; echo; echo "Unduh file .apk di bawah dari HP lalu pasang menimpa versi lama."; } > release-notes.md
          cat release-notes.md

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Active Coach v1.1.${{ github.run_number }}
          body_path: release-notes.md
          make_latest: true
          files: ActiveCoach-*.apk

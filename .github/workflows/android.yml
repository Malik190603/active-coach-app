name: Build APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Siapkan file proyek (boleh upload file .zip langsung)
        run: |
          if [ ! -f package.json ]; then
            z=$(ls *.zip 2>/dev/null | head -1)
            if [ -n "$z" ]; then echo "Mengekstrak $z"; unzip -q -o "$z" -d _src; fi
            dir=$(dirname "$(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' | head -1)")
            echo "Proyek ditemukan di $dir"
            shopt -s dotglob && cp -r "$dir"/* .
          fi
          test -f package-lock.json || npm install --package-lock-only --no-audit --no-fund

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Pasang dependensi
        run: npm ci

      - name: Susun aplikasi web (www/)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Siapkan proyek Android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: npm run android:prepare

      - name: Kunci tanda tangan
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Beri nama file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "ActiveCoach-v1.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ActiveCoach-APK
          path: ActiveCoach-*.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Active Coach v1.1.${{ github.run_number }}
          body: APK Android Active Coach (Masuk dengan Strava, peta baru, Studio 16 template). Unduh file .apk di bawah dari HP lalu pasang menimpa versi lama.
          files: ActiveCoach-*.apk

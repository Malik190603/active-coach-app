name: Build APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # token OIDC GitHub untuk menyalakan/mematikan maintenance (tanpa rahasia bersama)

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Nomor versi & saluran rilis
        id: ver
        # Versi semver dari package.json (+ PATCH otomatis). Pesan commit berisi [beta] → rilis beta (prerelease):
        # hanya HP yang mengaktifkan "Saluran beta" yang menerimanya, tanpa notifikasi & tanpa maintenance.
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          node scripts/version.mjs
          beta=false; case "$MSG" in *"[beta]"*) beta=true;; esac
          echo "beta=$beta" >> "$GITHUB_OUTPUT"; echo "Saluran: $([ $beta = true ] && echo beta || echo stabil)"

      - name: Mode maintenance — mulai (hanya bila update mengubah server)
        id: maint
        # Menyala bila commit mengubah folder supabase/ atau pesannya berisi [maintenance];
        # [no-maintenance] membatalkan. Pengguna lain dikunci & diberi notifikasi, pemilik tetap bisa masuk.
        env:
          SB_URL: ${{ vars.SUPABASE_URL }}
          SB_ANON: ${{ vars.SUPABASE_ANON_KEY }}
          MSG: ${{ github.event.head_commit.message }}
          VER: ${{ steps.ver.outputs.version }}
          BETA: ${{ steps.ver.outputs.beta }}
        run: |
          server=no; want=no
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^supabase/'; then server=yes; want=yes; fi
          case "$MSG" in *"[maintenance]"*) want=yes;; esac
          case "$MSG" in *"[no-maintenance]"*) want=no;; esac
          if [ "$BETA" = true ]; then want=no; server=no; echo "Rilis beta: tanpa maintenance & tanpa perubahan server"; fi
          echo "server=$server" >> "$GITHUB_OUTPUT"; echo "want=$want" >> "$GITHUB_OUTPUT"
          if [ "$want" != yes ] || [ -z "$SB_URL" ]; then echo "Tanpa maintenance (server=$server)"; exit 0; fi
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=active-coach-maint" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).value||"")}catch(e){}})' || true)
          echo "::add-mask::$OIDC"
          body=$(node -e 'process.stdout.write(JSON.stringify({on:true,minutes:45,reason:"Pembaruan server & aplikasi",version:process.env.VER}))')
          curl -sS -m 60 -X POST "$SB_URL/functions/v1/strava-callback?maint=1" -H "apikey: $SB_ANON" -H "x-github-oidc: $OIDC" -H "Content-Type: application/json" -d "$body" > maint.json || true
          cat maint.json; echo
          if grep -q '"on":true' maint.json; then echo "on=true" >> "$GITHUB_OUTPUT"; echo "::notice::Mode maintenance aktif selama build"; else echo "::warning::Maintenance tidak menyala (fungsi strava-callback v6 / SQL maintenance belum dipasang?)"; fi

      - name: Siapkan file proyek (boleh upload file .zip langsung)
        run: |
          if [ ! -f package.json ]; then
            z=$(ls *.zip 2>/dev/null | head -1)
            if [ -n "$z" ]; then echo "Mengekstrak $z"; unzip -q -o "$z" -d _src; fi
            dir=$(dirname "$(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' | head -1)")
            echo "Proyek ditemukan di $dir"
            shopt -s dotglob && cp -r "$dir"/* .
          fi
          test -f package-lock.json || npm install --package-lock-only --no-audit --no-fund

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Pasang dependensi
        run: npm ci

      - name: Susun aplikasi web (www/)
        env:
          VERSION_CODE: ${{ github.run_number }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: npm run build

      - name: Pemeriksaan kode sebelum rilis
        # Sintaks semua skrip aplikasi, engine, konfigurasi & fungsi server. Gagal = tidak ada rilis.
        run: npm run check

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Pemeriksaan tipe fungsi server (Deno)
        run: deno check supabase/functions/strava-callback/index.ts supabase/functions/proxy/index.ts

      - name: Siapkan proyek Android
        # prepare-android menulis signingConfig tetap (signing/debug.keystore) ke build.gradle
        env:
          VERSION_CODE: ${{ github.run_number }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: npm run android:prepare

      - name: Build APK (rilis)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Pastikan tanda tangan sama dengan versi sebelumnya
        # Gagal (dan tidak rilis) bila APK tidak ditandatangani kunci tetap,
        # supaya pengguna tidak pernah perlu uninstall untuk update.
        run: |
          EXPECTED=350be8974a9244ca94f1528cc06b69a3485c5b1eea17139e8c921d4d6665c6d3
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee certs.txt
          GOT=$(grep -m1 -i "certificate SHA-256 digest" certs.txt | awk '{print $NF}' | tr 'A-F' 'a-f')
          echo "SHA-256 APK: $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then echo "::error::APK ditandatangani kunci lain ($GOT). Rilis dibatalkan."; exit 1; fi
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          "$AAPT" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -E "^package:|application-debuggable" | tee badging.txt
          if grep -q "application-debuggable" badging.txt; then echo "::error::APK masih bisa di-debug. Rilis dibatalkan."; exit 1; fi

      - name: Perbarui server Supabase (SQL baru + Edge Functions)
        id: server
        # Otomatis hanya bila secret SUPABASE_ACCESS_TOKEN diisi. Tanpa itu, pemilik memperbarui server
        # sendiri lalu menekan "Selesai maintenance" di Developer › Maintenance.
        if: ${{ steps.maint.outputs.server == 'yes' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SB_URL: ${{ vars.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SB_URL" ]; then echo "auto=false" >> "$GITHUB_OUTPUT"; echo "::notice::Server perlu diperbarui manual (SQL / deploy fungsi), lalu tekan Selesai maintenance di aplikasi."; exit 0; fi
          REF=$(echo "$SB_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*#\1#')
          for f in $(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'supabase/migrations/*.sql' | sort); do
            echo "▶ SQL $f"
            node -e 'process.stdout.write(JSON.stringify({query:require("fs").readFileSync(process.argv[1],"utf8")}))' "$f" > q.json
            code=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data-binary @q.json)
            head -c 600 out.json; echo
            if [ "$code" -ge 300 ]; then echo "::error::SQL $f gagal (HTTP $code)"; exit 1; fi
          done
          fns=$(git diff --name-only HEAD~1 HEAD -- supabase/functions | cut -d/ -f3 | sort -u | tr '\n' ' ')
          if [ -n "${fns// }" ]; then
            echo "▶ Deploy fungsi: $fns"
            npx -y supabase@2 functions deploy $fns --project-ref "$REF" --use-api || npx -y supabase@2 functions deploy $fns --project-ref "$REF"
          fi
          echo "auto=true" >> "$GITHUB_OUTPUT"

      - name: Beri nama file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "ActiveCoach-v${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ActiveCoach-APK
          path: ActiveCoach-*.apk

      - name: Catatan rilis (dari pesan commit)
        run: node scripts/release-notes.mjs

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Active Coach v${{ steps.ver.outputs.version }}${{ steps.ver.outputs.beta == 'true' && ' (beta)' || '' }}
          body_path: release-notes.md
          prerelease: ${{ steps.ver.outputs.beta == 'true' }}
          make_latest: ${{ steps.ver.outputs.beta == 'true' && 'false' || 'true' }}
          files: ActiveCoach-*.apk

      - name: Kabari pengguna (pengumuman + notifikasi versi baru)
        # Server mengecek rilis terbaru di GitHub sendiri, jadi aman dipanggil berulang (sekali per versi).
        # Saat maintenance, kabar versi baru digabung ke notifikasi "maintenance selesai".
        if: ${{ vars.SUPABASE_URL != '' && steps.maint.outputs.on != 'true' && steps.ver.outputs.beta != 'true' }}
        continue-on-error: true
        run: |
          sleep 15
          curl -sS -m 90 -X POST "${{ vars.SUPABASE_URL }}/functions/v1/strava-callback?release=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" -H "Content-Type: application/json" -d '{}' || true

      - name: Mode maintenance — selesai
        # Selalu jalan bila maintenance dinyalakan di awal, termasuk saat build gagal (kunci dibuka diam-diam).
        if: ${{ always() && steps.maint.outputs.on == 'true' }}
        env:
          SB_URL: ${{ vars.SUPABASE_URL }}
          SB_ANON: ${{ vars.SUPABASE_ANON_KEY }}
          JOB: ${{ job.status }}
          SERVER: ${{ steps.maint.outputs.server }}
          AUTO: ${{ steps.server.outputs.auto }}
        run: |
          if [ "$JOB" != "success" ]; then body='{"on":false,"quiet":true}'; echo "Build gagal → buka kunci tanpa notifikasi"
          elif [ "$SERVER" = yes ] && [ "$AUTO" != true ]; then body='{"on":true,"minutes":120,"reason":"Pembaruan server","await_owner":true}'; echo "Menunggu pemilik memperbarui server"
          else sleep 15; body='{"on":false,"release":true}'; echo "Selesai → kabari pengguna"; fi
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=active-coach-maint" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).value||"")}catch(e){}})' || true)
          echo "::add-mask::$OIDC"
          for i in 1 2 3; do
            if curl -sS -m 90 -f -X POST "$SB_URL/functions/v1/strava-callback?maint=1" -H "apikey: $SB_ANON" -H "x-github-oidc: $OIDC" -H "Content-Type: application/json" -d "$body"; then echo; exit 0; fi
            sleep 10
          done
          echo "::warning::Gagal mengubah mode maintenance — kunci tetap terbuka otomatis saat waktunya habis (maks. 45 menit)."

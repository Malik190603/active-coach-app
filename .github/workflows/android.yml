name: Build APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Siapkan file proyek (boleh upload file .zip langsung)
        run: |
          if [ ! -f package.json ]; then
            z=$(ls *.zip 2>/dev/null | head -1)
            if [ -n "$z" ]; then echo "Mengekstrak $z"; unzip -q -o "$z" -d _src; fi
            dir=$(dirname "$(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' | head -1)")
            echo "Proyek ditemukan di $dir"
            shopt -s dotglob && cp -r "$dir"/* .
          fi
          test -f package-lock.json || npm install --package-lock-only --no-audit --no-fund

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Pasang dependensi
        run: npm ci

      - name: Susun aplikasi web (www/)
        env:
          VERSION_CODE: ${{ github.run_number }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Siapkan proyek Android
        # prepare-android menulis signingConfig tetap (signing/debug.keystore) ke build.gradle
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: npm run android:prepare

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Pastikan tanda tangan sama dengan versi sebelumnya
        # Gagal (dan tidak rilis) bila APK tidak ditandatangani kunci tetap,
        # supaya pengguna tidak pernah perlu uninstall untuk update.
        run: |
          EXPECTED=350be8974a9244ca94f1528cc06b69a3485c5b1eea17139e8c921d4d6665c6d3
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          GOT=$(grep -m1 -i "certificate SHA-256 digest" certs.txt | awk '{print $NF}' | tr 'A-F' 'a-f')
          echo "SHA-256 APK: $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then echo "::error::APK ditandatangani kunci lain ($GOT). Rilis dibatalkan."; exit 1; fi

      - name: Beri nama file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "ActiveCoach-v1.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ActiveCoach-APK
          path: ActiveCoach-*.apk

      - name: Catatan rilis (dari pesan commit)
        run: node scripts/release-notes.mjs

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Active Coach v1.1.${{ github.run_number }}
          body_path: release-notes.md
          make_latest: true
          files: ActiveCoach-*.apk
